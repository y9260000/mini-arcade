me.root.position.set(0, 0, .2);
const phoneGrp = new THREE.Group(); phoneGrp.position.set(.02, -.68, -.05); me.arms[1].add(phoneGrp);
box(.2, .03, .12, 0x212529, .05, 0, 0, phoneGrp); box(.17, .005, .1, new THREE.MeshBasicMaterial({ color: 0x74c0fc }), .05, .018, 0, phoneGrp);

// ---------- balance physics ----------
// lean θ: + = toward the front (right). Bus acceleration pushes the opposite way (brake → +θ).
const FALL = .95;
let theta = 0, omega = 0, input = 0, aBus = 0, events = [], nextEventT = 3, speed = 0, targetSpeed = 40, dist = 0, stops = 0, nextStop = 300, overAt = 0, state = 'ready', fallT = 0, survived = 0;

const $score = $('score'), $center = $('center'), $warn = $('warn'), $needle = $('needle');
const showScreen = html => { $center.innerHTML = html; $center.style.display = ''; };
const showIntro = () => showScreen(Arcade.titleScreen({ emoji: '🚌', title: '급정거 버티기', how: [
  ['👆', '화면 <b>왼쪽/오른쪽</b>을 누르면 그쪽으로 몸을 기울여요 (← → 키)'],
  ['🚦', '창밖 <b>신호등·표지판</b>이 오면 곧 급정거·급출발·방지턱!'],
  ['📏', '아래 <b>균형 게이지</b>의 바늘을 초록 칸에 유지'],
  ['🤕', '빨간 칸 끝까지 기울면 꽈당! 정거장을 최대한 많이'],

  brake: { warn: '🚦 빨간불! 급정거 온다 →', col: '#e03131', fire() { push(+1, 1.25, .55); targetSpeed = 0; setTimeout(() => { targetSpeed = rr(35, 55); }, 1600); Arcade.sfx.crash(); line('아 씨…! (끼이익)'); } },
  go: { warn: '🟢 초록불! 급출발 ←', col: '#2f9e44', fire() { push(-1, 1.0, .6); targetSpeed = rr(45, 65); Arcade.sfx.whoosh(true); line('부아앙~'); } },
  bump: { warn: '⛰️ 과속방지턱!', col: '#f59f00', fire() { omega += rr(-1.8, 1.8); bounce = .35; Arcade.sfx.thud(); line('덜컹!'); } },
  curve: { warn: '↩️ 급커브! 좌우로 흔들려요', col: '#7048e8', fire() { curveT = 1.8; Arcade.sfx.whoosh(); line('으어어…'); } },
  back: { warn: '🔙 앗 정류장 지나쳤다! 후진 온다', col: '#495057', fire() {

    setTimeout(() => { if (state !== 'playing') return; reversing = true; targetSpeed = -22; push(+1, .9, .6); line('삐- 삐- 삐-'); }, 650);   // backing up throws you forward
    setTimeout(() => { if (state !== 'playing') return; push(-1, 1.05, .5); targetSpeed = 0; Arcade.sfx.thud(); line('끼익!'); }, 2700);       // stopping from reverse throws you back

  } },

};
let bounce = 0, curveT = 0, lineT = 0, reversing = false, beepT = 0;
const pigeon = new THREE.Group(); pigeon.visible = false; scene.add(pigeon);
{ const b = new THREE.Mesh(new THREE.SphereGeometry(.18, 8, 6), flat(0x868e96)); b.scale.set(1.5, 1, 1); pigeon.add(b);
  const h = new THREE.Mesh(new THREE.SphereGeometry(.11, 8, 6), flat(0x5c7cfa)); h.position.set(.24, .08, 0); pigeon.add(h);
  const bk = new THREE.Mesh(new THREE.ConeGeometry(.04, .12, 4), flat(0xfab005)); bk.rotation.z = -Math.PI / 2; bk.position.set(.36, .07, 0); pigeon.add(bk);

let driverLine = '';

// ---------- input: hold left / right ----------
const held = new Map();   // pointerId → -1 | +1

      if (!h.fired && h.m.position.x < 3) { h.fired = true; KINDS[h.kind].fire(); }   // fires once the sign is in plain view
      if (!h.fired && (!soon || h.m.position.x < soon.m.position.x)) soon = h;
      if (h.m.position.x < -16) { scene.remove(h.m); hazards.splice(i, 1); }
    }
    if (soon) { const k = KINDS[soon.kind]; $warn.style.display = 'block'; $warn.style.background = k.col; $warn.textContent = k.warn; $warn.classList.toggle('soon', soon.m.position.x < 6.5); }
    else $warn.style.display = 'none';
    // forces on the body
    aBus = 0; for (let i = events.length - 1; i >= 0; i--) { const ev = events[i]; ev.t -= dt; aBus += ev.dir * ev.a * Math.sin(Math.PI * Math.max(0, ev.t) / ev.dur); if (ev.t <= 0) events.splice(i, 1); }
    if (curveT > 0) { curveT -= dt; aBus += Math.sin(curveT * 5.5) * .9; }
    const lvl = Math.min(1, survived / 80);
    const noise = (Math.sin(t * 3.1) * .5 + Math.sin(t * 7.3) * .3) * (.25 + lvl * .35) * Math.min(1, speed / 30);
    const alpha = (1.2 + lvl * .8) * Math.sin(theta) + aBus * 6.5 + noise + input * 7 - omega * 1.8;   // press toward the side you want to lean   // slightly unstable upright + bus push + your counter-lean
    omega += alpha * dt; theta += omega * dt;
    if (pig) {   // pigeon flight + head collision
      pig.x += pig.dir * 7.5 * dt; pigeon.position.set(pig.x, PIGEON_Y, me.root.position.z);
      pigeon.userData.wings.forEach((w, j) => w.rotation.x = (j ? 1 : -1) * Math.sin(t * 40) * .7);
      const headX = Math.sin(theta) * 1.17, headH = Math.cos(theta) * 1.17;   // head of a leaning passenger
      if (!pig.hit && !pig.dodged && Math.abs(pig.x - headX) < .35) {
        if (headH > PIGEON_Y - .08) { pig.hit = true; omega += -pig.dir * 3.2; Arcade.sfx.crash(); Arcade.sfx.squawk(); Arcade.shake(.4); Arcade.vibrate([60, 30, 90]); Arcade.toast('🐦💥 비둘기 박치기!!', '#e03131'); }
        else { pig.dodged = true; Arcade.sfx.whoosh(); Arcade.toast('🐦 휙! 매트릭스 회피!', '#2b8a3e'); }
      }
      if (Math.abs(pig.x) > 10) { pig = null; pigeon.visible = false; }
    }
    if (Math.abs(theta) > FALL) fall();
  } else if (state === 'fall') {
    fallT += dt;
    theta += Math.sign(theta || 1) * dt * 3; theta = Math.max(-1.55, Math.min(1.55, theta));
  }
  bounce = Math.max(0, bounce - dt);
  // body pose: pivot at the feet, flailing arms when off balance
  me.root.rotation.z = -theta;   // +theta leans toward +x (front)
  const panic = Math.min(1, Math.abs(theta) / FALL);
  const flail = Math.max(0, (panic - .3) / .7);   // 0 calm → 1 full windmill
  const spin = t * 13;
  me.arms.forEach((a, i) => {
    const side = i ? 1 : -1;
    // calm: free arm hangs, phone arm bent up in front of the chest; panic: both arms swing big circles, cartoon style
    const calmZ = i ? 1.15 : .15 + theta * .6, calmX = i ? side * -.35 : side * .1;
    const windZ = spin * (i ? 1 : -1) + (i ? 0 : Math.PI), windX = side * -.75;
    a.rotation.z = calmZ * (1 - flail) + windZ * flail;
    a.rotation.x = calmX * (1 - flail) + windX * flail;
  });
  phoneGrp.rotation.z = -1.0 * (1 - flail);   // screen faces the eyes when calm
  me.legs.forEach((l, i) => l.rotation.x = (i ? 1 : -1) * (.12 + panic * .25));
  me.mouth.scale.set(1, 1 + panic * 3, 1);
  me.head.rotation.z = theta * .5 - .25 * (1 - Math.min(1, Math.abs(theta) / FALL * 2));   // eyes on the phone when calm
  if (state === 'fall') me.root.position.y = -Math.min(.25, fallT * .5);
  for (const o of others) { o.root.rotation.z = -(theta * .5 + Math.sin(t * 2 + o.ph) * .04); if (state === 'fall') o.head.rotation.y = Math.atan2(me.root.position.z - o.z, me.root.position.x - o.x); }
  for (const s of straps) s.rotation.z = -theta * .9 + Math.sin(t * 3) * .05;
  // needle
  $needle.style.left = `${50 + Math.max(-1, Math.min(1, theta / FALL)) * 50}%`;
  // scenery scrolls, bus bobs
  street.position.x -= speed / 3.6 * dt * .9; if (street.position.x < -STREET_LEN / 2) street.position.x += STREET_LEN / 2; if (street.position.x > 0) street.position.x -= STREET_LEN / 2;
  bus.position.y = Math.sin(t * 14) * .01 * Math.min(1, speed / 30) + Math.sin(bounce * 20) * bounce * .15;
  bus.rotation.z = -aBus * .015;
  // camera: side view through the open near wall, following the player a bit
  const portrait = innerWidth < innerHeight;
  camera.position.set(0, 1.6, portrait ? 7.5 : 6.2); Arcade.applyShake(camera, dt); camera.lookAt(0, 1.2, -.5);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
