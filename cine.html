<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>씨네필 통역기</title>
<script src="common.js?v=15"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#140f1e;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  .hud-score{font-size:56px}
  #say{position:fixed;left:50%;top:max(122px,calc(env(safe-area-inset-top) + 112px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));box-sizing:border-box;
    background:#fff;color:var(--ink);border-radius:22px;padding:14px 18px 16px;z-index:3;box-shadow:0 12px 34px rgba(0,0,0,.45)}
  #say::after{content:"";position:absolute;left:22%;bottom:-12px;border:12px solid transparent;border-bottom:0;border-top-color:#fff}
  #say .who{font:700 13px "Noto Sans KR",sans-serif;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;gap:8px}
  #say .who b{color:#7048e8}
  #say .txt{font-family:"Jua",sans-serif;font-size:clamp(19px,4.8vw,25px);line-height:1.4;margin-top:6px;min-height:2.8em;word-break:keep-all}
  #say .txt em{font-style:normal;color:#7048e8;background:#f3f0ff;border-radius:6px;padding:0 4px}
  #say.react .txt{color:var(--ink-soft)}
  #tbar{height:6px;border-radius:3px;background:#eee;margin-top:10px;overflow:hidden}
  #tbar i{display:block;height:100%;background:#7048e8;transform-origin:left}
  #tbar.low i{background:#fa5252}
  #choices{position:fixed;left:50%;bottom:max(64px,calc(env(safe-area-inset-bottom) + 58px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));
    display:flex;flex-direction:column;gap:10px;z-index:3}
  .ch{display:flex;align-items:center;gap:12px;border:0;cursor:pointer;text-align:left;background:rgba(255,255,255,.95);color:var(--ink);border-radius:18px;
    padding:13px 16px;font:700 clamp(15px,4vw,17px)/1.35 "Noto Sans KR",sans-serif;box-shadow:0 5px 0 rgba(0,0,0,.35);word-break:keep-all;transition:transform .05s}
  .ch:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .ch .k{flex:none;width:28px;height:28px;border-radius:50%;background:#2b2438;color:#fff;display:flex;align-items:center;justify-content:center;font:16px "Jua",sans-serif}
  .ch.ok{background:#51cf66;color:#fff} .ch.ok .k{background:#2b8a3e}
  .ch.no{background:#ff6b6b;color:#fff} .ch.no .k{background:#c92a2a}
  .ch.dim{opacity:.45}
  #choices.lock .ch{pointer-events:none}
</style>
</head>
<body>
<div class="hud">
  <div id="score" class="hud-score">0<small>개</small></div>
  <div class="hud-row"><span class="pill" id="lives"></span><span class="pill dark" id="combo" style="display:none"></span></div>
</div>
<div id="say" class="hud-ctl"><div class="who"><span>🎩 <b>옆자리 씨네필</b> · 상영 중 속삭임</span><span id="qn"></span></div><div class="txt" id="txt"></div><div id="tbar"><i id="tfill"></i></div></div>
<div id="choices" class="hud-ctl"></div>
<div class="screen" id="center"></div>

  ['숏의 구도가 권력 관계를 *수직적으로 형상화*해.', '높은 사람은 위에, 약자는 아래에 찍음', '엘리베이터 장면이 많음', '숏폼으로 찍었음'],
  ['*레드 헤링*으로 관객의 의심을 교묘하게 분산시켜.', '범인 아닌 사람을 범인처럼 보이게 함', '빨간 청어 요리가 나옴', '객석에 빨간 조명을 켬'],
  ['이 감독 특유의 *작가주의적 자의식*이 과잉돼 있어.', '감독이 자기 하고 싶은 대로만 만듦', '감독이 원래 웹소설 작가임', '감독이 직접 출연함'],
  ['*슬로우 번* 전개가 후반부 카타르시스를 극대화하지.', '초반 엄청 지루한데 마지막에 터짐', '불이 천천히 번지는 재난영화', '슬로모션이 많음'],
  ['인물 간의 *서브텍스트*가 대사보다 더 많은 걸 말하고 있어.', '말은 안 하는데 둘이 썸 탐', '자막이 대사보다 김', '둘이 문자로만 대화함'],
  ['포스트모던한 *장르 혼종성*이 정체성을 해체하지.', '코미디인지 호러인지 모르겠음', '포스트잇이 많이 나옴', '주인공이 기억을 잃음'],
  ['*익스트림 클로즈업*이 감정의 결을 해부하듯 포착해.', '얼굴을 모공 보일 만큼 크게 찍음', '배우가 극한 직업 출연자임', '카메라가 고장 남'],
  ['*매치컷*으로 시공간을 우아하게 도약하는 거지.', '모양 비슷한 장면으로 휙 넘어감', '성냥 켜는 장면이 나옴', '축구 경기 장면이 나옴'],
  ['시퀀스 전체가 하나의 거대한 *알레고리*야.', '사실 이 영화 전부 다 비유임', '알레르기 있는 주인공 얘기', '시퀀스가 길어서 화장실 다녀옴'],
  ['캐릭터의 동기가 *개연성* 측면에서 설득력이 결여됐어.', '얘 갑자기 왜 저래?', '연기가 너무 자연스러움', '캐릭터한테 입사 동기가 없음'],
  ['*쿠키 영상*이 세계관 확장을 암시하고 있어.', '속편 나온다는 뜻', '극장에서 쿠키 나눠줌', '크레딧이 너무 김'],
  ['*핸드헬드* 촬영이 다큐멘터리적 리얼리티를 부여하지.', '카메라 엄청 흔들려서 멀미남', '배우들이 손잡고 다님', '배우가 손 연기를 잘함'],

  ['*탈장르적 시도*가 대중성과의 타협을 거부한 거지.', '흥행은 망했다는 뜻', '탈의실 장면이 많음', '대중교통 장면이 나옴'],
  ['이야기의 *여백*이 오히려 관객의 정서적 참여를 유도해.', '설명을 안 해줘서 알아서 상상해야 함', '자막에 여백이 많음', '상영관이 텅 비었음'],
  ['*음향의 부재*, 그 침묵 자체가 하나의 언어인 셈이지.', '한참 동안 아무 소리도 안 남', '극장 스피커 고장', '배우가 수화로 말함'],
  ['이건 자본주의에 대한 *우화적 비판*이야.', '부자들이 나쁘게 나옴', '돈 엄청 들인 영화임', '동물이 나오는 동화임'],
  ['*컬러 팔레트*가 인물의 감정선을 따라 채도를 잃어가지.', '주인공 우울해질수록 화면이 칙칙해짐', '물감 회사 PPL임', '흑백 TV로 틀었음'],
  ['*인서트 컷*으로 디테일의 상징성을 환기시키는 거야.', '중요한 물건을 갑자기 확대해서 보여줌', '광고가 중간에 들어감', '배우가 코인 넣는 장면'],
  ['*페이소스*가 웃음 뒤에 묵직하게 남아.', '웃긴데 끝나고 나니 슬픔', '파스타 먹는 장면이 웃김', '웃다가 사레들림'],
  ['*누벨바그*의 정신을 동시대적으로 재해석했어.', '옛날 프랑스 영화 스타일 따라함', '새 파도타기 영화', '빵집에서 찍은 영화'],
  ['*러닝타임*을 감당할 만큼 서사의 밀도가 충분치 않아.', '쓸데없이 길다', '배우가 달리기를 많이 함', '시간 여행 영화임'],
];
const GENERIC = ['배우가 잘생겼다는 뜻', '그냥 팝콘이 맛있다는 뜻', '본인도 졸렸다는 뜻', '감독이랑 친하다는 뜻', '평점 4.5 주겠다는 뜻', '화장실 가고 싶다는 뜻'];
const OK_LINES = ['그렇지. 좀 보는구나?', '오… 너 왓챠에 별점 남기는 사람이구나', '정확해. 다음 주 GV 같이 갈래?', '역시 내 옆자리 자격 있어', '흠, 대중치고는 제법인데', '바로 그거야. 감독도 울고 가겠다'];
const NO_LINES = ['하… 이래서 대중은…', '너 마블만 보지?', '그건 평점 1점짜리 해석이야', '팝콘 내려놔.', '…아니야. 됐다.', '쯧. 영화를 귀로 보네'];
const TIMEOUT_LINES = ['…자니?', '듣고는 있는 거지?', '대답이 없네. 감동받았나'];

// ---------- three: dark theater ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x140f1e);
scene.fog = new THREE.Fog(0x140f1e, 8, 26);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .05, 100);
scene.add(new THREE.HemisphereLight(0x5a4a7a, 0x120c18, .9));
const screenLight = new THREE.PointLight(0x9ec5ff, 30, 30, 1.6); screenLight.position.set(0, 3, -6); scene.add(screenLight);
const faceLight = new THREE.PointLight(0xffe0b0, 2.2, 3); scene.add(faceLight);
const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .85, flatShading: true, ...extra });
const box = (w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); parent.add(m); return m; };

// movie screen with a crude animated "film"
const fc = document.createElement('canvas'); fc.width = 256; fc.height = 112; const fg = fc.getContext('2d');
const filmTex = new THREE.CanvasTexture(fc); filmTex.colorSpace = THREE.SRGBColorSpace;
const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(14, 6.1), new THREE.MeshBasicMaterial({ map: filmTex }));
screenMesh.position.set(0, 3.6, -13); scene.add(screenMesh);
box(15, 7, .2, flat(0x0b0810), 0, 3.6, -13.15);
function drawFilm(t) {
  const scene = Math.floor(t / 6) % 4, k = t % 6;
  const skies = [['#ff9a5a', '#5a2a6a'], ['#0c1a3a', '#2a4a7a'], ['#e8e2d0', '#a8a090'], ['#1a3a2a', '#6a9a6a']];
  const g = fg.createLinearGradient(0, 0, 0, 112); g.addColorStop(0, skies[scene][1]); g.addColorStop(1, skies[scene][0]);
  fg.fillStyle = g; fg.fillRect(0, 0, 256, 112);
  fg.fillStyle = 'rgba(0,0,0,.85)';
  if (scene === 0) { fg.beginPath(); fg.arc(128, 80, 26, Math.PI, 0); fill('#ffd8a0'); fg.fillStyle = '#000'; fg.fillRect(0, 84, 256, 28); fg.fillRect(60 + k * 8, 58, 6, 26); fg.fillRect(180 - k * 8, 58, 6, 26); }
  else if (scene === 1) { for (let i = 0; i < 30; i++) { fg.fillStyle = '#fff'; fg.fillRect((i * 53) % 256, (i * 29) % 70, 1.5, 1.5); } fg.fillStyle = '#000'; fg.fillRect(0, 90, 256, 22); fg.fillRect(110, 60 - Math.sin(k) * 4, 10, 30); }
  else if (scene === 2) { fg.fillStyle = '#222'; fg.beginPath(); fg.arc(128, 60, 30 + k * 6, 0, 7); fg.fill(); fg.fillStyle = '#e8e2d0'; fg.fillRect(122, 40, 4, 8); fg.fillRect(132, 40, 4, 8); }
  else { fg.fillStyle = '#0a1a10'; for (let i = 0; i < 9; i++) fg.fillRect(i * 30 + Math.sin(t + i) * 3, 40 + (i % 3) * 8, 12, 72); }
  function fill(c) { fg.fillStyle = c; fg.fill(); }
  for (let i = 0; i < 40; i++) { fg.fillStyle = `rgba(255,255,255,${Math.random() * .08})`; fg.fillRect(Math.random() * 256, Math.random() * 112, 2, 2); }
  filmTex.needsUpdate = true;
  screenLight.color.set(skies[scene][0]).lerp(new THREE.Color(0xffffff), .4);
}

// seats + audience silhouettes
const seatMat = flat(0x7a1f2b), headMat = flat(0x0d0a12);
for (let row = 0; row < 7; row++) {
  const z = -1.6 - row * 1.3, y = -row * .18;
  for (let i = -6; i <= 6; i++) {
    const x = i * .78;
    box(.66, .5, .6, seatMat, x, y + .3, z); box(.66, .9, .14, seatMat, x, y + .75, z + .3);
    if (Math.random() < .55) { box(.42, .5, .3, headMat, x, y + 1.15, z + .1); box(.3, .32, .3, headMat, x, y + 1.55, z + .1); }
  }
}
// our row
for (let i = -3; i <= 3; i++) { box(.66, .5, .6, seatMat, i * .78 - .39, .3, 0); box(.66, .9, .14, seatMat, i * .78 - .39, .75, .3); }

// the cinephile: beret, black turtleneck, round glasses, goatee
const snob = new THREE.Group(); snob.position.set(-.78, .1, 0); snob.rotation.y = Math.PI; scene.add(snob);   // faces the screen
const skin = flat(0xf1c7a0), black = flat(0x1c1c22);
box(.62, .78, .38, black, 0, .95, 0, snob);
box(.3, .14, .3, black, 0, 1.38, 0, snob);   // turtleneck collar
const armL = new THREE.Group(); armL.position.set(.38, 1.25, 0); box(.16, .62, .18, black, 0, -.3, 0, armL); snob.add(armL);
const hand = new THREE.Mesh(new THREE.DodecahedronGeometry(.1, 0), skin); hand.position.set(0, -.64, 0); armL.add(hand);
const head = new THREE.Group(); head.position.y = 1.45; snob.add(head);
box(.44, .48, .42, skin, 0, .25, 0, head);
const beret = new THREE.Mesh(new THREE.CylinderGeometry(.3, .27, .12, 10), flat(0x8b1e2d)); beret.position.set(-.04, .53, 0); beret.rotation.z = .18; head.add(beret);
box(.04, .06, .04, flat(0x8b1e2d), -.04, .62, 0, head);
const lensMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x99bbff, emissiveIntensity: 0, roughness: .2 });
for (const s of [-1, 1]) {
  const r = new THREE.Mesh(new THREE.TorusGeometry(.075, .015, 4, 12), flat(0x111111)); r.position.set(s * .1, .3, .23); head.add(r);
  const l = new THREE.Mesh(new THREE.CircleGeometry(.065, 12), lensMat); l.position.set(s * .1, .3, .225); head.add(l);
}
const brows = [-1, 1].map(s => box(.12, .025, .02, flat(0x3a2a20), s * .1, .41, .225, head));
box(.1, .1, .04, flat(0x3a2a20), 0, .04, .22, head);  // goatee
const mouth = box(.12, .03, .02, flat(0x5a2a2a), 0, .13, .225, head);
// cup of fancy coffee
const cup = new THREE.Mesh(new THREE.CylinderGeometry(.06, .05, .16, 8), flat(0xffffff)); cup.position.set(0, -.74, .06); armL.add(cup);
// my popcorn (lives) in the foreground
const pop = new THREE.Group(); pop.position.set(.75, .62, 1.2); scene.add(pop);
{
  const bucket = new THREE.Mesh(new THREE.CylinderGeometry(.2, .15, .36, 8, 1, true), new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, flatShading: true }));
  pop.add(bucket);
  for (let i = 0; i < 4; i++) { const st = box(.03, .37, .01, flat(0xe03131), 0, 0, 0, pop); const a = i / 4 * Math.PI * 2; st.position.set(Math.cos(a) * .18, 0, Math.sin(a) * .18); st.rotation.y = -a; }
}
const kernels = [];
for (let i = 0; i < 26; i++) { const k = new THREE.Mesh(new THREE.DodecahedronGeometry(.045, 0), flat(0xfff3bf)); k.position.set((Math.random() - .5) * .3, .2 + Math.random() * .1, (Math.random() - .5) * .3); pop.add(k); kernels.push(k); }
const flying = [];
function spillPopcorn() {
  for (let i = 0; i < 10; i++) {
    const k = new THREE.Mesh(new THREE.DodecahedronGeometry(.045, 0), flat(0xfff3bf));
    k.position.copy(pop.position).add(new THREE.Vector3(0, .25, 0)); scene.add(k);
    flying.push({ m: k, v: new THREE.Vector3((Math.random() - .5) * 2, 1.5 + Math.random() * 1.5, (Math.random() - .3) * 1.5), t: 0 });
  }
  pop.rotation.z = -.5;
}

const camBase = () => camera.aspect < 1 ? new THREE.Vector3(.7, 1.75, 3.1) : new THREE.Vector3(1.2, 1.75, 2.9);
function placeCamera() {
  camera.aspect = innerWidth / innerHeight;
  const portrait = camera.aspect < 1;
  camera.fov = portrait ? 66 : 50; camera.updateProjectionMatrix();
  camera.position.copy(camBase());
  camera.lookAt(portrait ? -.62 : -.75, portrait ? 1.25 : 1.3, -2.5);
}
placeCamera();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); placeCamera(); });
faceLight.position.set(-.3, 2, 1.2);

// ---------- state ----------
const LIVES = 3;
let state = 'ready', score = 0, lives = LIVES, combo = 0, maxCombo = 0, order = [], qi = 0, q = null, tLeft = 0, tMax = 1, overAt = 0, typed = 0, react = null;
let best = 0; try { best = +localStorage.getItem('cine-best') || 0; } catch {}
const $score = $('score'), $lives = $('lives'), $combo = $('combo'), $txt = $('txt'), $choices = $('choices'), $tfill = $('tfill'), $tbar = $('tbar'), $say = $('say'), $center = $('center'), $qn = $('qn');
const showScreen = html => { $center.innerHTML = html; $center.style.display = ''; };
const showIntro = () => showScreen(Arcade.titleScreen({ emoji: '🎬', title: '씨네필 통역기', how: [
  ['🎩', '옆자리 영화 고인물이 <b>어려운 말</b>로 속삭여요'],
  ['💡', '무슨 뜻인지 <b>쉬운 말 보기</b>를 빨리 고르기 (1~4 키)'],
  ['⏱️', '갈수록 말이 빨라져요. 시간 초과도 오답'],
  ['🍿', '틀리면 팝콘이 쏟아져요. 3번이면 퇴장'],
] }));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = a => a[(Math.random() * a.length) | 0];
const fmt = s => s.replace(/\*(.+?)\*/g, '<em>$1</em>');
function updateHud() {
  $score.innerHTML = `${score}<small>개</small>`;
  $lives.textContent = '🍿'.repeat(lives) + '▫️'.repeat(LIVES - lives);
  $combo.style.display = combo >= 3 ? '' : 'none'; $combo.textContent = `🔥 ${combo}연속`;
}
function reset() {
  score = 0; lives = LIVES; combo = 0; maxCombo = 0; order = shuffle(QS.map((_, i) => i)); qi = 0; q = null; react = null;
  kernels.forEach(k => k.visible = true); pop.rotation.z = 0; beret.visible = true;
  $txt.innerHTML = ''; $choices.innerHTML = ''; updateHud();
}
function nextQ() {
  if (state !== 'playing') return;
  if (qi >= order.length) { order = shuffle(order); qi = 0; }
  const [say, ans, w1, w2] = QS[order[qi++]];
  const opts = [{ t: ans, ok: true }, { t: w1 }, { t: w2 }];
  if (score >= 6) opts.push({ t: rnd(GENERIC) });
  q = { say, opts: shuffle(opts), answered: false };
  typed = 0; react = null;
  tMax = Math.max(4.2, 9 - score * .22); tLeft = tMax;
  $say.classList.remove('react'); $qn.textContent = `#${score + 1}`;
  $choices.classList.remove('lock');
  $choices.innerHTML = q.opts.map((o, i) => `<button class="ch" data-i="${i}"><span class="k">${i + 1}</span><span>${o.t}</span></button>`).join('');
  Arcade.sfx.tap();
}
function answer(i) {
  if (state !== 'playing' || !q || q.answered) return;
  q.answered = true; $choices.classList.add('lock');
  const btns = [...$choices.children];
  const okIdx = q.opts.findIndex(o => o.ok);
  btns.forEach((b, j) => b.classList.add(j === okIdx ? 'ok' : j === i ? 'no' : 'dim'));
  const right = i === okIdx;
  if (right) {
    const fast = tLeft / tMax > .6;
    score++; combo++; maxCombo = Math.max(maxCombo, combo);
    react = { kind: 'ok', t: 0 };
    say(fast && combo >= 3 ? `${rnd(OK_LINES)} (빠른데?)` : rnd(OK_LINES));
    Arcade.sfx.perfect(Math.min(combo, 12)); Arcade.vibrate(20);
    if (combo > 0 && combo % 5 === 0) { Arcade.toast(`🎩 씨네필 인정! ${combo}연속`, '#7048e8'); Arcade.confetti({ y: innerHeight * .3, count: 60, emoji: ['🎬', '🍿', '⭐'] }); Arcade.sfx.coin(); }
    $score.animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 180 });
  } else {
    lives--; combo = 0;
    react = { kind: 'no', t: 0 };
    say(i < 0 ? rnd(TIMEOUT_LINES) : rnd(NO_LINES));
    Arcade.sfx.miss(); Arcade.shake(.12); Arcade.vibrate([40, 30, 60]);
    spillPopcorn();
    kernels.filter(k => k.visible).slice(0, 9).forEach(k => k.visible = false);
  }
  updateHud();
  setTimeout(() => { if (lives <= 0) finish(); else nextQ(); }, right ? 1000 : 1700);
}
function say(line) { $say.classList.add('react'); $txt.textContent = `“${line}”`; }
function finish() {
  state = 'over'; overAt = performance.now();
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('cine-best', best); } catch {} }
  isBest && score > 0 ? Arcade.sfx.fanfare() : Arcade.sfx.fail();
  const rank = score < 3 ? '🍿 팝콘 무비 러버' : score < 8 ? '🎟️ 주말 관객' : score < 15 ? '📼 왓챠 고인물' : score < 25 ? '🎤 GV 단골' : '🏆 칸 심사위원';
  const msg = score >= 15 ? '씨네필: "…너 혹시 평론가야?"' : score >= 8 ? '씨네필이 명함을 건넵니다' : '씨네필: "다음엔 팝콘 소리 좀 줄여줘"';
  showScreen(Arcade.resultScreen({ emoji: '🎬', label: '번역 성공', score, unit: '개', msg, rows: [['등급', rank], ['최대 연속', `${maxCombo}개`]], isBest: isBest && score > 0, best }));
  Arcade.gameOver(score);
}
function start() {
  state = 'count'; $center.style.display = 'none'; $txt.innerHTML = '…(상영 시작)'; $choices.innerHTML = '';
  Arcade.countdown({ final: '상영!', onTick: n => n ? Arcade.sfx.tick() : Arcade.sfx.go(), onDone: () => { state = 'playing'; nextQ(); } });
}
function tapStart() {
  if (state === 'ready') start();
  else if (state === 'over' && performance.now() - overAt > 900 && !Arcade.inRun()) { reset(); start(); }
}

// ---------- input ----------
$choices.addEventListener('click', e => { const b = e.target.closest('.ch'); if (b) answer(+b.dataset.i); });
addEventListener('pointerdown', e => { if (!e.target.closest('.ch, .arcade-btn')) tapStart(); });
addEventListener('keydown', e => {
  const n = +e.key; if (n >= 1 && n <= 4 && q && n <= q.opts.length) { answer(n - 1); return; }
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tapStart(); }
});

// ---------- loop ----------
let last = performance.now(), blip = 0;
reset(); showIntro();
window.__cine = { get state() { return state; }, get q() { return q; }, answer, get score() { return score; }, get lives() { return lives; } };

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  drawFilm(t);
  // typing out the jargon + muttering blips
  if (state === 'playing' && q && !q.answered) {
    const plain = q.say.replace(/\*/g, '');
    const speed = 20 + score * 1.5;
    if (typed < plain.length) {
      typed = Math.min(plain.length, typed + dt * speed);
      let n = Math.floor(typed), out = '', count = 0, inEm = false;
      for (const ch of q.say) { if (ch === '*') { out += inEm ? '</em>' : '<em>'; inEm = !inEm; continue; } if (count++ >= n) break; out += ch; }
      if (inEm) out += '</em>';
      $txt.innerHTML = out;
      blip -= dt; if (blip <= 0) { blip = .09; Arcade.sfx.tap(); }
    }
    tLeft -= dt;
    if (tLeft <= 0) { tLeft = 0; answer(-1); }
  }
  $tfill.style.transform = `scaleX(${q && state === 'playing' ? tLeft / tMax : 0})`;
  $tbar.classList.toggle('low', tLeft / tMax < .3);

  // snob animation: turns to whisper at you, nods or rolls eyes
  const talking = state === 'playing' && q && !q.answered;
  const turn = talking || react;
  snob.rotation.y += ((turn ? Math.PI - .75 : Math.PI) - snob.rotation.y) * Math.min(1, dt * 5);
  head.rotation.y += ((turn ? -1.1 : 0) - head.rotation.y) * Math.min(1, dt * 6);
  let pitch = talking ? Math.sin(t * 9) * .04 : 0, roll = 0;
  if (react) {
    react.t += dt;
    if (react.kind === 'ok') { pitch = Math.sin(react.t * 14) * .18 * Math.max(0, 1 - react.t); mouth.scale.set(1.5, 1.5, 1); }
    else { roll = Math.sin(react.t * 12) * .15 * Math.max(0, 1 - react.t * .7); pitch = -.25; mouth.scale.set(.7, 1, 1); }
    brows.forEach((b, i) => b.rotation.z = react.kind === 'no' ? (i ? -.35 : .35) : 0);
  } else { mouth.scale.set(1, talking ? 1 + Math.abs(Math.sin(t * 22)) * 2 : 1, 1); brows.forEach((b, i) => b.rotation.z = talking ? (i ? .2 : -.2) : 0); }
  head.rotation.x = pitch; head.rotation.z = roll;
  armL.rotation.x = talking ? -.6 + Math.sin(t * 3) * .25 : -.35;   // gesturing with the coffee
  lensMat.emissiveIntensity = .25 + Math.sin(t * 1.3) * .15 + (react?.kind === 'ok' ? Math.max(0, 1 - react.t * 2) * 2 : 0);
  // spilled popcorn
  for (let i = flying.length - 1; i >= 0; i--) {
    const f = flying[i]; f.t += dt; f.v.y -= 9 * dt; f.m.position.addScaledVector(f.v, dt); f.m.rotation.x += dt * 8;
    if (f.t > 1.6) { scene.remove(f.m); flying.splice(i, 1); }
  }
  pop.rotation.z *= Math.exp(-dt * 3);

  camera.position.x += Math.sin(t * .4) * .0004;
  Arcade.applyShake(camera, dt);
  renderer.render(scene, camera);
  placeCameraSoft();
  requestAnimationFrame(frame);
}
function placeCameraSoft() { camera.position.lerp(camBase(), .3); }
requestAnimationFrame(frame);
</script>
