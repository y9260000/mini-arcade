    if (combo > 0 && combo % 5 === 0) { Arcade.toast(`${E.emoji} ${E.name} 인정! ${combo}연속`, E.color); Arcade.confetti({ y: innerHeight * .3, count: 60, emoji: [E.emoji, '⭐', '🎓'] }); Arcade.sfx.coin(); }
    $score.animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 180 });
  } else {
    lives--; combo = 0; react = { kind: 'no', t: 0 };
    say(i < 0 ? rnd(TIMEOUT_LINES) : rnd(E.no));
    Arcade.sfx.miss(); Arcade.shake(.12); Arcade.vibrate([40, 30, 60]);
  }
  updateHud();
  setTimeout(() => { if (lives <= 0) finish(); else nextQ(); }, right ? 1000 : 1700);
}
function say(line) { $say.classList.add('react'); $txt.textContent = `“${line}”`; }
function finish() {
  state = 'over'; overAt = performance.now(); q?.voice?.stop();
  const isBest = score > best; if (isBest) { best = score; try { localStorage.setItem('cine-best', best); } catch {} }
  isBest && score > 0 ? Arcade.sfx.fanfare() : Arcade.sfx.fail();
  const rank = score < 3 ? '🙋 일반인' : score < 8 ? '📚 귀동냥 고수' : score < 15 ? '🎙️ 만능 통역사' : score < 25 ? '🧠 걸어다니는 백과사전' : '🏆 전문가들의 전문가';
  showScreen(Arcade.resultScreen({ emoji: '🎓', label: '통역 성공', score, unit: '개', msg: `${met}명의 전문가를 만났어요`, rows: [['등급', rank], ['최대 연속', `${maxCombo}개`]], isBest: isBest && score > 0, best }));
  Arcade.gameOver(score);
}
function reset() { score = 0; lives = LIVES; combo = 0; maxCombo = 0; E = null; ei = 0; expertOrder = []; used.clear(); q = null; react = null; met = 0; $txt.innerHTML = ''; $choices.innerHTML = ''; updateHud(); }
function start() {
  reset(); state = 'count'; $center.style.display = 'none'; $txt.innerHTML = '…'; $choices.innerHTML = '';
  Arcade.countdown({ final: '통역 시작!', onTick: n => n ? Arcade.sfx.tick() : Arcade.sfx.go(), onDone: () => { state = 'playing'; nextQ(); } });
}
function tapStart() {
  if (state === 'ready') start();
  else if (state === 'over' && performance.now() - overAt > 900 && !Arcade.inRun()) start();
}
$choices.addEventListener('click', e => { const b = e.target.closest('.ch'); if (b) answer(+b.dataset.i); });
addEventListener('pointerdown', e => { if (!e.target.closest('.ch, .arcade-btn')) tapStart(); });
addEventListener('keydown', e => {
  const n = +e.key; if (n >= 1 && n <= 4 && q && n <= q.opts.length) { answer(n - 1); return; }
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tapStart(); }
});

// ---------- loop ----------
let last = performance.now();
buildExpert(EXPERTS[0]); $('whoName').innerHTML = '🎓 <b>전문가 통역기</b>'; showIntro(); updateHud();
window.__cine = { get state() { return state; }, get q() { return q; }, answer, get score() { return score; }, get lives() { return lives; }, get E() { return E; } };
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  ex.position.y += (0 - ex.position.y) * Math.min(1, dt * 7);
  if (state === 'playing' && q && !q.answered) {
    const plain = q.say.replace(/\*/g, ''), speed = 22 + score * 1.4;
    if (typed < plain.length) {
      typed = Math.min(plain.length, typed + dt * speed);
      let n = Math.floor(typed), out = '', count = 0, inEm = false;
      for (const ch of q.say) { if (ch === '*') { out += inEm ? '</em>' : '<em>'; inEm = !inEm; continue; } if (count++ >= n) break; out += ch === '\n' ? '<br>' : ch; }
      if (inEm) out += '</em>';
      $txt.innerHTML = out;
    }
    tLeft -= dt; if (tLeft <= 0) { tLeft = 0; answer(-1); }
  }
  $tfill.style.transform = `scaleX(${q && state === 'playing' ? tLeft / tMax : 0})`;
  $tbar.classList.toggle('low', tLeft / tMax < .3);
  if (exParts) {
    const { head, arms, mouth, brows } = exParts, talking = state === 'playing' && q && !q.answered && typed < q.say.length;
    let pitch = Math.sin(t * 1.3) * .03, roll = 0;
    if (react) { react.t += dt; if (react.kind === 'ok') { pitch = Math.sin(react.t * 14) * .18 * Math.max(0, 1 - react.t); mouth.scale.set(1.6, 1.6, 1); } else { roll = Math.sin(react.t * 12) * .15 * Math.max(0, 1 - react.t * .7); pitch = -.2; mouth.scale.set(.7, 1, 1); } brows.forEach((b, i) => b.rotation.z = react.kind === 'no' ? (i ? -.35 : .35) : 0); }
    else { mouth.scale.set(1, talking ? 1 + Math.abs(Math.sin(t * 22)) * 2 : 1, 1); brows.forEach((b, i) => b.rotation.z = talking ? (i ? .15 : -.15) : 0); }
    head.rotation.x = pitch; head.rotation.z = roll;
    arms[0].rotation.x = talking ? -.7 + Math.sin(t * 4) * .35 : -.2; arms[1].rotation.x = talking ? -.4 + Math.cos(t * 3.5) * .3 : -.2;
  }
  Arcade.applyShake(camera, dt);
  renderer.render(scene, camera);
  placeCamera();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
