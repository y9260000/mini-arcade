<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#3b2416;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

  #typed{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;font-size:16px;caret-color:transparent;color:transparent;background:transparent}

  #deco span.down{transform:translateY(4px);box-shadow:0 0 0 #6b6152,0 0 0 3px #1c1c24}
  #strikes{font-family:"Jua",sans-serif}

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $ = id => document.getElementById(id);
const rnd = a => a[(Math.random() * a.length) | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- crunchy typewriter audio (own little synth, tuned for ASMR clicks) ----------
let ac, master, nbuf;
function AC() {
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .9; const comp = ac.createDynamicsCompressor(); master.connect(comp).connect(ac.destination);
    nbuf = ac.createBuffer(1, ac.sampleRate * .5, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  if (ac.state === 'suspended') ac.resume(); return ac;
}
addEventListener('pointerdown', AC, { capture: true }); addEventListener('keydown', AC, { capture: true });
function burst(when, dur, f, q, vol, type = 'bandpass') { const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = nbuf; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(.0005, when + dur); s.connect(fl).connect(g).connect(master); s.start(when, Math.random() * .3); s.stop(when + dur + .02); }
function thump(when, f, dur, vol) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(f, when); o.frequency.exponentialRampToValueAtTime(f * .5, when + dur); g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(.0005, when + dur); o.connect(g).connect(master); o.start(when); o.stop(when + dur + .02); }
const SND = {
  key(delay = 0) { if (!AC()) return; const t = ac.currentTime + delay, p = .85 + Math.random() * .3;   // the strike: crisp click + type-bar slap + platen thunk
    burst(t, .018, 3800 * p, 2.5, .55, 'highpass'); burst(t + .004, .05, 1800 * p, 6, .35); thump(t + .006, 160 * p, .07, .45); burst(t + .03, .03, 900 * p, 3, .12); },
  space() { if (!AC()) return; const t = ac.currentTime; thump(t, 110, .1, .5); burst(t, .06, 600, 2, .25); },
  wrong() { if (!AC()) return; const t = ac.currentTime; for (let i = 0; i < 3; i++) { burst(t + i * .035, .03, 2600, 3, .4); thump(t + i * .035, 140, .05, .35); } thump(t + .12, 70, .25, .5); },
  carriage() { if (!AC()) return; const t = ac.currentTime; for (let i = 0; i < 14; i++) burst(t + i * .022, .012, 5000, 8, .25 - i * .01, 'highpass');   // ratchet zip
    burst(t, .35, 700, .8, .18); const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = 2400; g.gain.setValueAtTime(.3, t + .32); g.gain.exponentialRampToValueAtTime(.0005, t + 1.4); o.connect(g).connect(master); o.start(t + .32); o.stop(t + 1.45);
    const o2 = ac.createOscillator(), g2 = ac.createGain(); o2.frequency.value = 4810; g2.gain.setValueAtTime(.08, t + .32); g2.gain.exponentialRampToValueAtTime(.0005, t + .9); o2.connect(g2).connect(master); o2.start(t + .32); o2.stop(t + .95); },
  gavel() { if (!AC()) return; const t = ac.currentTime; for (let i = 0; i < 2; i++) { thump(t + i * .18, 220, .16, .8); burst(t + i * .18, .06, 1500, 2, .5); } },
  blip(pitch) { if (!AC()) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = pitch; g.gain.setValueAtTime(.04, t); g.gain.exponentialRampToValueAtTime(.0005, t + .06); o.connect(g).connect(master); o.start(t); o.stop(t + .07); },
};

// ---------- courtroom (3D backdrop) ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

document.body.appendChild(renderer.domElement);

scene.background = new THREE.Color(0x3b2416);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 100);
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3b2416, 1.2));
const lamp = new THREE.DirectionalLight(0xfff4e0, 1.4); lamp.position.set(2, 8, 6); lamp.castShadow = true; scene.add(lamp);
const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, flatShading: true, ...extra });
const box = (w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof mat === 'number' ? flat(mat) : mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; };
{
  box(20, .2, 12, 0x8d5a3b, 0, -.1, 0);
  box(20, 7, .3, 0x6b4226, 0, 3.4, -3.5);
  for (let x = -8; x <= 8; x += 2) box(.12, 7, .1, 0x553219, x, 3.4, -3.3);
  box(5, 1.6, 1.2, 0x5c3a21, 0, .8, -2.2); box(5.2, .12, 1.4, 0x7a4a2a, 0, 1.62, -2.2);   // judge's bench
  box(1.8, .1, .6, 0x3b2416, 0, 2.3, -3.2);                                             // emblem plate
  const scale = new THREE.Mesh(new THREE.TorusGeometry(.35, .04, 6, 20), flat(0xfab005, { metalness: .6 })); scale.position.set(0, 3.4, -3.3); scene.add(scale);
  box(1.6, 1.1, 1, 0x5c3a21, -3.6, .55, -.4); box(1.6, 1.1, 1, 0x5c3a21, 3.6, .55, -.4);   // counsel tables / witness box
  box(.06, 2.2, .06, 0x868e96, -6.5, 1.1, -2.6); const flag = box(1, .7, .02, 0xffffff, -6, 1.9, -2.6); const tg = new THREE.Mesh(new THREE.CircleGeometry(.16, 16), flat(0xe03131)); tg.position.set(-6, 1.9, -2.58); scene.add(tg);
}
function makePerson({ robe = 0x212529, hair = 0x2b2b2b, skin = 0xffd2a8, tie = 0xe03131, wig = false }) {
  const root = new THREE.Group();
  box(.7, .9, .4, flat(robe), 0, 1.2, 0, root);
  box(.12, .5, .02, flat(tie), 0, 1.35, .21, root);
  const arms = [-1, 1].map(s => { const p = new THREE.Group(); p.position.set(s * .43, 1.55, 0); box(.18, .65, .2, flat(robe), 0, -.32, 0, p); const h = new THREE.Mesh(new THREE.DodecahedronGeometry(.1, 0), flat(skin)); h.position.y = -.68; p.add(h); root.add(p); return p; });
  const head = new THREE.Group(); head.position.y = 1.68; root.add(head);
  box(.44, .48, .42, flat(skin), 0, .24, 0, head);
  for (const s of [-1, 1]) box(.06, .07, .02, flat(0x222222), s * .1, .28, .215, head);
  const mouth = box(.12, .04, .02, flat(0x7a2a2a), 0, .13, .215, head);
  if (wig) { box(.54, .3, .48, flat(0xf1f3f5), 0, .48, -.02, head); for (const s of [-1, 1]) box(.12, .4, .3, flat(0xf1f3f5), s * .28, .2, -.05, head); }
  else box(.48, .16, .46, flat(hair), 0, .5, -.02, head);

const CAST = {
  판사: Object.assign(makePerson({ robe: 0x1c1c24, wig: true, tie: 0xffffff }), { pos: [0, .9, -2.4], tail: '50%' }),
  검사: Object.assign(makePerson({ robe: 0x343a40, hair: 0x111111, tie: 0x1971c2 }), { pos: [-3.6, 0, .2], tail: '18%' }),
  변호사: Object.assign(makePerson({ robe: 0x495057, hair: 0x3b2a1a, tie: 0xe03131 }), { pos: [3.6, 0, .2], tail: '82%' }),
  증인: Object.assign(makePerson({ robe: 0xfab005, hair: 0x6b4f3a, tie: 0x2f9e44 }), { pos: [5.6, 0, -1.2], tail: '92%' }),
  피고인: Object.assign(makePerson({ robe: 0x868e96, hair: 0x2b2b2b, tie: 0x495057 }), { pos: [-5.6, 0, -1.2], tail: '8%' }),
};
for (const c of Object.values(CAST)) { c.root.position.set(...c.pos); c.root.lookAt(0, c.pos[1], 4); }
const gavel = new THREE.Group(); gavel.position.set(.8, 1.75, -1.8); scene.add(gavel);
// the stenographer (you), seen from behind at the front desk
const steno = makePerson({ robe: 0x5f3dc4, hair: 0x3b2316, tie: 0xffffff });
steno.root.position.set(-1.6, -.25, 2.4); steno.root.rotation.y = Math.PI; steno.root.scale.setScalar(1.05);
box(1.6, .7, .8, 0x6b4226, -1.6, .35, 1.75); box(.9, .18, .5, 0x26262e, -1.6, .8, 1.75);   // desk + tiny typewriter
const sweat = [];
// judge's party sunglasses (hidden until things get hot)
const shades = new THREE.Group(); CAST.판사.head.add(shades); shades.visible = false;
for (const sx of [-1, 1]) box(.17, .1, .03, 0x111111, sx * .11, .29, .23, shades); box(.08, .02, .03, 0x111111, 0, .3, .23, shades);
// gallery on both sides
const crowd = [];
for (const side of [-1, 1]) for (let r = 0; r < 2; r++) for (let i = 0; i < 4; i++) {
  const p = makePerson({ robe: rnd([0xff8787, 0x74c0fc, 0xffd43b, 0x8ce99a, 0xb197fc, 0xffa94d]), hair: rnd([0x2b2b2b, 0x6b4f3a, 0xdee2e6]), tie: 0xffffff });

}
// mirror ball + coloured spots
const disco = new THREE.Group(); disco.position.set(2.6, 9, .4); scene.add(disco);
const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(.6, 1), new THREE.MeshStandardMaterial({ color: 0xdee2e6, metalness: 1, roughness: .15, flatShading: true, emissive: 0x444444 })); disco.add(ball);
box(.03, 3, .03, 0xadb5bd, 0, 1.8, 0, disco);
const spots = [0xff3bd4, 0x3bc9ff, 0xfff23b].map((c, i) => { const l = new THREE.PointLight(c, 0, 9, 1.4); scene.add(l); return l; });
box(.07, .07, .5, 0x8d5a3b, 0, 0, .1, gavel); box(.18, .16, .16, 0x5c3a21, 0, 0, -.18, gavel);

// ---------- cases ----------
const CASES = [
  { name: '🍗 치킨 도둑 사건', lines: [
    ['판사', '지금부터 재판을 시작하겠습니다'], ['검사', '피고인은 그날 밤 치킨집에 있었습니까'], ['피고인', '저는 그냥 콜라만 사러 갔습니다'],

  { name: '🍫 민트초코 테러 사건', lines: [

];

// ---------- state ----------
const STRIKES = 3;
let state = 'ready', chars = 0, strikes = 0, caseNo = 0, lineNo = 0, target = '', speaker = '판사', timeLeft = 10, timeMax = 10, overAt = 0, lines = 0, perfectLines = 0, lineErrors = 0, prevText = '';
let secPerChar = .62, baseTime = 3.2, keyCount = 0, lineStart = 0, strokes = [], tpm = 0, topTpm = 0, hype = 0, hypeStage = 0, beatT = 0, clapT = 0;

const $score = $('score'), $center = $('center'), $txt = $('txt'), $line = $('line'), $typed = $('typed'), $paper = $('paper');
const showScreen = html => { $center.innerHTML = html; $center.style.display = ''; };

const norm = s => s.replace(/\s+/g, ' ');
function render() {
