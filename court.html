<style>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------- crunchy typewriter audio (own little synth, tuned for ASMR clicks) ----------
let ac, master, nbuf;
function AC() {
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .9; const comp = ac.createDynamicsCompressor(); master.connect(comp).connect(ac.destination);
    nbuf = ac.createBuffer(1, ac.sampleRate * .5, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

function burst(when, dur, f, q, vol, type = 'bandpass') { const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = nbuf; fl.type = type; fl.frequency.value = f; fl.Q.value = q;

const SND = {
  key(delay = 0) { if (!AC()) return; const t = ac.currentTime + delay, p = .85 + Math.random() * .3;   // the strike: crisp click + type-bar slap + platen thunk
    burst(t, .018, 3800 * p, 2.5, .55, 'highpass'); burst(t + .004, .05, 1800 * p, 6, .35); thump(t + .006, 160 * p, .07, .45); burst(t + .03, .03, 900 * p, 3, .12); },

  wrong() { if (!AC()) return; const t = ac.currentTime; for (let i = 0; i < 3; i++) { burst(t + i * .035, .03, 2600, 3, .4); thump(t + i * .035, 140, .05, .35); } thump(t + .12, 70, .25, .5); },
  carriage() { if (!AC()) return; const t = ac.currentTime; for (let i = 0; i < 14; i++) burst(t + i * .022, .012, 5000, 8, .25 - i * .01, 'highpass');   // ratchet zip

{
  box(20, .2, 12, 0x8d5a3b, 0, -.1, 0);

  box(.06, 2.2, .06, 0x868e96, -6.5, 1.1, -2.6); const flag = box(1, .7, .02, 0xffffff, -6, 1.9, -2.6); const tg = new THREE.Mesh(new THREE.CircleGeometry(.16, 16), flat(0xe03131)); tg.position.set(-6, 1.9, -2.58); scene.add(tg);

const CAST = {

  검사: Object.assign(makePerson({ robe: 0x343a40, hair: 0x111111, tie: 0x1971c2 }), { pos: [-3.6, 0, .2], tail: '18%' }),
  변호사: Object.assign(makePerson({ robe: 0x495057, hair: 0x3b2a1a, tie: 0xe03131 }), { pos: [3.6, 0, .2], tail: '82%' }),

  피고인: Object.assign(makePerson({ robe: 0x868e96, hair: 0x2b2b2b, tie: 0x495057 }), { pos: [-5.6, 0, -1.2], tail: '8%' }),

box(.07, .07, .5, 0x8d5a3b, 0, 0, .1, gavel); box(.18, .16, .16, 0x5c3a21, 0, 0, -.18, gavel);

// ---------- cases ----------
const CASES = [
  { name: '🍗 치킨 도둑 사건', lines: [
    ['판사', '지금부터 재판을 시작하겠습니다'], ['검사', '피고인은 그날 밤 치킨집에 있었습니까'], ['피고인', '저는 그냥 콜라만 사러 갔습니다'],
    ['검사', '그런데 왜 손에 양념이 묻어 있었죠'], ['변호사', '이의 있습니다 유도 신문입니다'], ['판사', '이의를 받아들입니다'],

  { name: '🍫 민트초코 테러 사건', lines: [
    ['판사', '정숙해 주시기 바랍니다'], ['검사', '피고인은 회사 냉장고를 열었습니까'], ['피고인', '배가 너무 고파서 그랬습니다'],

// plausible typos: tweak one vowel of one syllable, or swap a particle
function typo(w) {
  const sw = [['을', '를'], ['는', '은'], ['이', '가'], ['다', '댜'], ['니', '나']];

// ---------- state ----------
const LIVES = 3;
let state = 'ready', score = 0, lives = LIVES, caseNo = 0, lineNo = 0, words = [], spoken = 0, typed = 0, speakT = 0, wps = 1.1, speaker = '판사', overAt = 0, typing = Promise.resolve(), paperLines = [], curLine = '';

  ['👨‍⚖️', '법정에서 하는 말을 <b>한 단어씩</b> 받아 적어요'],

function updateHud() {

}
function renderSay() {

}

}
let gavelT = 0;
function typeOut(text, bad) {   // characters hit the paper one by one, each with its own clack
  typing = typing.then(() => new Promise(res => {
    const chars = [...text]; let i = 0;
    const step = () => {
      if (i < chars.length) { curLine += bad ? `<span class="bad">${chars[i]}</span>` : chars[i]; i++; SND.key(); renderPaper(); setTimeout(step, 38 + Math.random() * 22); }
      else { curLine += ' '; SND.space(); renderPaper(); res(); }
    };
    step();
  }));
}
function carriageReturn() {
  typing = typing.then(() => new Promise(res => {
    SND.carriage(); $paper.style.transform = 'translateX(-14px)';
    setTimeout(() => { paperLines.push(curLine.trim()); curLine = ''; $paper.style.transform = ''; renderPaper(); res(); }, 360);
  }));
}
function pick(w) {
  if (state !== 'playing' || typed >= spoken) return;
  const right = w === words[typed];
  const btn = [...$keys.children].find(b => b.dataset.w === w);
  if (right) {
    typeOut(w, false); typed++; score++; updateHud(); Arcade.vibrate(8);
    if (btn) { btn.classList.add('down'); setTimeout(() => btn.classList.remove('down'), 90); }
  } else {
    typeOut(w, true); lives--; updateHud(); SND.wrong(); Arcade.shake(.12); Arcade.vibrate([40, 30, 60]);
    if (btn) btn.classList.add('wrong');
    Arcade.toast(rnd(['✏️ 오타! 판사님이 째려봐요', '🙀 속기록 오류!', '😤 "다시 적으세요"']), '#e03131');
    typed++;   // the wrong word stays crossed out; move on
    if (lives <= 0) { setTimeout(finish, 600); return; }
  }
  renderSay();
  if (typed >= words.length) { carriageReturn(); setTimeout(() => state === 'playing' && nextLine(), 650); }
  else renderKeys();
}
$keys.addEventListener('pointerdown', e => { const b = e.target.closest('.key'); if (b) { e.preventDefault(); pick(b.dataset.w); } });
function finish() {
  if (state === 'over') return;
  state = 'over'; overAt = performance.now();
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('court-best', best); } catch {} }
  isBest && score > 0 ? Arcade.sfx.fanfare() : Arcade.sfx.fail();
  SND.gavel();
  const msg = score >= 80 ? '대법원에서 스카우트하러 왔어요' : score >= 40 ? '베테랑 속기사 인정' : score >= 15 ? '수습 딱지는 뗐어요' : '판사님: "속기사 바꿔주세요"';
  showScreen(Arcade.resultScreen({ emoji: '⌨️', label: '받아 적은 단어', score, unit: '단어', msg, rows: [['처리한 사건', `${caseNo}건`], ['말 속도', `${wps.toFixed(1)}단어/초`]], isBest: isBest && score > 0, best }));
  Arcade.gameOver(score);
}
function reset() { score = 0; lives = LIVES; caseNo = 0; lineNo = 0; wps = 1.1; paperLines = []; curLine = ''; words = []; spoken = typed = 0; renderPaper(); $keys.innerHTML = ''; $txt.innerHTML = ''; updateHud(); }
function start() {
  state = 'count'; $center.style.display = 'none';
  Arcade.countdown({ final: '개정!', onTick: n => n ? SND.key() : SND.gavel(), onDone: () => { state = 'playing'; nextLine(); } });
}
function tapStart() {
  if (state === 'ready') start();
  else if (state === 'over' && performance.now() - overAt > 1200 && !Arcade.inRun()) { reset(); start(); }
}
addEventListener('pointerdown', e => { if (e.target.closest?.('.key, .arcade-btn')) return; if (state !== 'playing') tapStart(); });
addEventListener('keydown', e => {
  const n = +e.key; if (n >= 1 && n <= 6 && state === 'playing') { const b = $keys.children[n - 1]; if (b) pick(b.dataset.w); return; }
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tapStart(); }
});

function placeCamera() {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 66 : 42; camera.updateProjectionMatrix();
  camera.position.set(0, 2.6, camera.aspect < 1 ? 11 : 9); camera.lookAt(0, .6, -1);
}
placeCamera();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); placeCamera(); });

// ---------- loop ----------
let last = performance.now();
reset(); showIntro();
window.__court = { get state() { return state; }, get words() { return words; }, get spoken() { return spoken; }, get typed() { return typed; }, pick, get score() { return score; }, get lives() { return lives; } };

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (state === 'playing' && words.length && spoken < words.length) {
    speakT -= dt;
    if (speakT <= 0) {
      spoken++; speakT = 1 / wps * (.8 + Math.random() * .4);
      SND.blip(speaker === '판사' ? 180 : speaker === '증인' ? 420 : 300); renderSay();
      if (typed < spoken && $keys.classList.contains('wait')) $keys.classList.remove('wait');
      if (spoken - typed >= 5) {   // fell too far behind: those words are lost
        lives--; updateHud(); SND.wrong(); Arcade.shake(.15);
        Arcade.toast('📜 속기 누락! "(…청취 불가…)"', '#e03131');
        typeOut('(누락)', true); typed = spoken; renderSay(); renderKeys();
        if (lives <= 0) setTimeout(finish, 600);
        else if (typed >= words.length) { carriageReturn(); setTimeout(() => state === 'playing' && nextLine(), 650); }
      }
    }
  }
  // speaker animation
  for (const [name, c] of Object.entries(CAST)) {
    const talking = state === 'playing' && name === speaker && spoken < words.length;
    c.mouth.scale.y = talking ? 1 + Math.abs(Math.sin(t * 18)) * 2.5 : 1;
    c.arms[1].rotation.x = talking ? -1 + Math.sin(t * 5) * .4 : -.1;
    c.head.rotation.z = talking ? Math.sin(t * 4) * .06 : 0;
  }
  gavelT = Math.max(0, gavelT - dt); gavel.rotation.x = -Math.abs(Math.sin(gavelT * 18)) * .9 * (gavelT > 0 ? 1 : 0);
  camera.position.x = Math.sin(t * .2) * .2;
  Arcade.applyShake(camera, dt); camera.lookAt(0, .6, -1);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
