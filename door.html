<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>밀당 도어</title>
<script src="common.js?v=14"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f3e9dc;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #timer{width:min(280px,64vw);height:16px;border-radius:999px;background:rgba(43,36,56,.28);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.25),0 0 0 3px #fff}
  #timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b6b,#ffd43b 35%,#51cf66 70%);transform-origin:left;border-radius:999px}
  #timer.low{animation:lowT .35s ease-in-out infinite}
  @keyframes lowT{50%{box-shadow:inset 0 2px 4px rgba(0,0,0,.25),0 0 0 3px #ff6b6b}}
  #pad{position:fixed;left:0;right:0;bottom:max(64px,calc(env(safe-area-inset-bottom) + 58px));display:flex;justify-content:center;gap:14px;
    padding:0 16px;pointer-events:none;z-index:3}
  .pb{flex:1;max-width:190px;font-family:"Jua",sans-serif;font-size:32px;color:#fff;text-align:center;padding:16px 0 12px;border-radius:22px;transition:transform .05s}
  .pb small{display:block;font:700 12px "Noto Sans KR",sans-serif;opacity:.85;margin-top:2px}
  #bpull{background:#ff6b6b;box-shadow:0 6px 0 #c92a2a,0 12px 24px rgba(0,0,0,.18)}
  #bpush{background:#4dabf7;box-shadow:0 6px 0 #1864ab,0 12px 24px rgba(0,0,0,.18)}
  .pb.on{transform:translateY(5px)} #bpull.on{box-shadow:0 1px 0 #c92a2a} #bpush.on{box-shadow:0 1px 0 #1864ab}
</style>
</head>
<body>
<div class="hud">
  <div id="score" class="hud-score">0<small>개</small></div>
  <div class="hud-row"><div id="timer"><i id="tfill"></i></div></div>
</div>
<div id="pad" class="hud-ctl">
  <div class="pb" id="bpull">⬅ 당기기<small>← / A · 왼쪽 탭</small></div>
  <div class="pb" id="bpush">밀기 ➡<small>→ / D · 오른쪽 탭</small></div>
</div>
<div class="screen" id="center"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $ = id => document.getElementById(id);
try { await Promise.race([document.fonts.load('64px Jua'), new Promise(r => setTimeout(r, 1500))]); } catch {}

// ---------- three ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const BG = 0xf3e9dc;
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 14, 34);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, .1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9c7b0, 1.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
scene.add(sun, sun.target);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, flatShading: true, ...extra });

// corridor floor + side walls (very long, static)
{
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#e9dccb'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#d8c6ae'; g.fillRect(0, 0, 32, 32); g.fillRect(32, 32, 32, 32);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 1500); t.magFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 3000), new THREE.MeshStandardMaterial({ map: t, roughness: .9 }));
  floor.rotation.x = -Math.PI / 2; floor.position.z = -1490; floor.receiveShadow = true; scene.add(floor);
  for (const s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(.4, 3.6, 3000), flat(0xfff4e6)); w.position.set(s * 4.3, 1.8, -1490); scene.add(w);
    const skirt = new THREE.Mesh(new THREE.BoxGeometry(.45, .25, 3000), flat(0x9c7a5b)); skirt.position.set(s * 4.3, .12, -1490); scene.add(skirt);
  }
}

// ---------- doors ----------
const SP = 5, STAND = 1.8, ME_X = .9;   // worker stands off-centre so his head never hides the sign   // spacing between doors, where the worker waits in front of a door
const WALLS = [0xffd8a8, 0xb2f2bb, 0xa5d8ff, 0xfcc2d7, 0xd0bfff, 0xffec99, 0x96f2d7];
const PANELS = [0x8d5a3b, 0xf8f9fa, 0x495057, 0xe8590c, 0x1c7ed6, 'glass', 0x5c940d];
const INKS = ['#e03131', '#1971c2', '#2b8a3e', '#212529', '#e8590c', '#7048e8'];
// [text, correct action, tier]
const SIGNS = [
  ['당기세요', 'pull', 0], ['미세요', 'push', 0],
  ['PULL', 'pull', 1], ['PUSH', 'push', 1], ['당기시오', 'pull', 1], ['미시오', 'push', 1], ['당겨', 'pull', 1], ['밀어', 'push', 1],
  ['당기지 마세요', 'push', 2], ['밀지 마세요', 'pull', 2], ['PUSH 아님', 'pull', 2], ['PULL 아님', 'push', 2],
  ['밀면 혼남', 'pull', 3], ['당기면 큰일', 'push', 3], ['미세요 (뻥)', 'pull', 3], ['당기세요 (진심)', 'pull', 3],
  ['절대 당기지 마', 'push', 3], ['안 밀면 안 열림', 'push', 3], ['밀지 말고 당겨', 'pull', 3], ['당기지 말고 밀어', 'push', 3],
];
const tierOf = n => n < 8 ? 0 : n < 20 ? 1 : n < 34 ? 2 : 3;
const MIRROR_FROM = 45;
const rnd = a => a[(Math.random() * a.length) | 0];
function pickSign(i) {
  const tier = tierOf(i), pool = SIGNS.filter(s => s[2] <= tier);
  const s = tier > 0 && Math.random() < .5 ? rnd(pool.filter(s => s[2] === tier)) : rnd(pool);
  let action = s[1], mirror = false;
  // mirrored lettering = this sign is meant for the other side → do the opposite
  if (i >= MIRROR_FROM && Math.random() < .22) { mirror = true; action = action === 'pull' ? 'push' : 'pull'; }
  return { text: s[0], action, mirror };
}
function signTexture(text, ink, mirror) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.beginPath(); g.roundRect(8, 8, 496, 240, 34); g.fill();
  g.lineWidth = 10; g.strokeStyle = ink; g.beginPath(); g.roundRect(22, 22, 468, 212, 26); g.stroke();
  let fs = 140; g.font = `${fs}px Jua, sans-serif`;
  while (g.measureText(text).width > 420 && fs > 40) { fs -= 6; g.font = `${fs}px Jua, sans-serif`; }
  g.fillStyle = ink; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (mirror) { g.translate(512, 0); g.scale(-1, 1); }
  g.fillText(text, 256, 136);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const doors = new Map();
function makeDoor(i) {
  const g = new THREE.Group(); g.position.z = -i * SP; scene.add(g);
  const wall = flat(WALLS[i % WALLS.length]), trim = flat(0x6b4f3a);
  for (const s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(3.05, 3.6, .3), wall); w.position.set(s * 2.6, 1.8, 0); w.receiveShadow = true; g.add(w);
    const post = new THREE.Mesh(new THREE.BoxGeometry(.16, 2.75, .4), trim); post.position.set(s * 1.1, 1.375, 0); g.add(post);
  }
  const top = new THREE.Mesh(new THREE.BoxGeometry(2.2, .85, .3), wall); top.position.y = 3.17; g.add(top);
  const lintel = new THREE.Mesh(new THREE.BoxGeometry(2.36, .16, .4), trim); lintel.position.y = 2.75; g.add(lintel);
  // room number plate for flavour
  if (i % 3 === 0) {
    const plant = new THREE.Group();
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(.28, .2, .45, 7), flat(0xd9480f)); pot.position.y = .22;
    const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(.45, 0), flat(0x40c057)); leaf.position.y = .75;
    plant.add(pot, leaf); plant.position.set((i % 2 ? 1 : -1) * 3.4, 0, .6); g.add(plant);
  }
  const pivot = new THREE.Group(); pivot.position.set(-1.02, 0, 0); g.add(pivot);
  const pc = PANELS[i % PANELS.length];
  const panelMat = pc === 'glass' ? new THREE.MeshStandardMaterial({ color: 0xa5d8ff, transparent: true, opacity: .45, roughness: .1, metalness: .2 }) : flat(pc);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(2.04, 2.66, .1), panelMat); panel.position.set(1.02, 1.36, 0); panel.castShadow = true; pivot.add(panel);
  const info = pickSign(i);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.7, .85), new THREE.MeshBasicMaterial({ map: signTexture(info.text, rnd(INKS), info.mirror), transparent: true }));
  sign.position.set(1.02, 2.0, .06); pivot.add(sign);
  // random handle style (Norman doors: never trust the handle, trust the sign)
  const metal = flat(0xced4da, { metalness: .6, roughness: .3 });
  if (Math.random() < .5) {
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, .7, 6), metal); bar.position.set(1.78, 1.15, .2); pivot.add(bar);
    for (const y of [.85, 1.45]) { const st = new THREE.Mesh(new THREE.BoxGeometry(.05, .05, .16), metal); st.position.set(1.78, y, .12); pivot.add(st); }
  } else {
    const plate = new THREE.Mesh(new THREE.BoxGeometry(.24, .5, .03), metal); plate.position.set(1.78, 1.15, .07); pivot.add(plate);
  }
  const d = { i, g, pivot, ...info, target: 0, rattle: 0 };
  doors.set(i, d); return d;
}
function disposeTree(o) { o.traverse(m => { if (m.isMesh) { m.geometry.dispose(); const mt = m.material; if (mt.map) mt.map.dispose(); mt.dispose(); } }); scene.remove(o); }
function ensureDoors() {
  for (let i = Math.max(0, cur - 2); i <= cur + 8; i++) if (!doors.has(i)) makeDoor(i);
  for (const [i, d] of doors) if (i < cur - 2) { disposeTree(d.g); doors.delete(i); }
}

// ---------- the office worker ----------
function makePerson({ suit = 0x364fc7, skin = 0xffd2a8, hair = 0x2b2b2b } = {}) {
  const root = new THREE.Group();
  const S = flat(suit), K = flat(skin), H = flat(hair), D = flat(0x222222);
  const legs = [-1, 1].map(s => {
    const p = new THREE.Group(); p.position.set(s * .16, .9, 0);
    const m = new THREE.Mesh(new THREE.BoxGeometry(.24, .9, .26), flat(0x2b2f3a)); m.position.y = -.45;
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(.26, .12, .36), D); shoe.position.set(0, -.88, .05);
    p.add(m, shoe); root.add(p); return p;
  });
  const body = new THREE.Mesh(new THREE.BoxGeometry(.7, .85, .4), S); body.position.y = 1.32; root.add(body);
  const shirt = new THREE.Mesh(new THREE.BoxGeometry(.22, .6, .02), flat(0xffffff)); shirt.position.set(0, 1.42, -.205); root.add(shirt);
  const tie = new THREE.Mesh(new THREE.BoxGeometry(.09, .5, .02), flat(0xe03131)); tie.position.set(0, 1.38, -.215); root.add(tie);
  const arms = [-1, 1].map(s => {
    const p = new THREE.Group(); p.position.set(s * .44, 1.68, 0);
    const m = new THREE.Mesh(new THREE.BoxGeometry(.18, .75, .2), S); m.position.y = -.37;
    const h = new THREE.Mesh(new THREE.DodecahedronGeometry(.11, 0), K); h.position.y = -.78;
    p.add(m, h); root.add(p); return p;
  });
  const bag = new THREE.Mesh(new THREE.BoxGeometry(.12, .4, .55), flat(0x6b4f3a)); bag.position.set(0, -.95, 0); arms[1].add(bag);
  const head = new THREE.Group(); head.position.y = 1.75; root.add(head);
  const hm = new THREE.Mesh(new THREE.BoxGeometry(.46, .5, .44), K); hm.position.y = .27; head.add(hm);
  const hairTop = new THREE.Mesh(new THREE.BoxGeometry(.5, .16, .48), H); hairTop.position.y = .56; head.add(hairTop);
  const hairBack = new THREE.Mesh(new THREE.BoxGeometry(.5, .34, .14), H); hairBack.position.set(0, .4, .2); head.add(hairBack);
  root.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { root, legs, arms, head };
}
const me = makePerson();
me.root.rotation.y = 0; // faces -z (into the corridor); shirt/tie are on the -z side
scene.add(me.root);
// dizzy stars
const stars = new THREE.Group();
for (let k = 0; k < 4; k++) { const s = new THREE.Mesh(new THREE.OctahedronGeometry(.1, 0), new THREE.MeshBasicMaterial({ color: 0xffd43b })); s.position.set(Math.cos(k * 1.57) * .4, 0, Math.sin(k * 1.57) * .4); stars.add(s); }
stars.visible = false; scene.add(stars);

// ---------- state ----------
let state = 'ready', cur = 0, tm = 1, charZ = STAND, move = null, overAt = 0, fail = null, streakT = 0;
let best = 0; try { best = +localStorage.getItem('door-best') || 0; } catch {}
const $score = $('score'), $tfill = $('tfill'), $timer = $('timer'), $center = $('center');
const showScreen = html => { $center.innerHTML = html; $center.style.display = ''; };
const showIntro = () => showScreen(Arcade.titleScreen({ emoji: '🚪', title: '밀당 도어', how: [
  ['⬅', '<b>당기세요</b> → 왼쪽 탭 / ← 키'],
  ['➡', '<b>미세요</b> → 오른쪽 탭 / → 키'],
  ['⏰', '시간 바가 다 닳으면 <b>지각</b>! 빨리빨리'],
  ['🤔', '<b>"당기지 마세요"</b> 같은 함정 사인 주의. 손잡이 말고 글씨를 믿기'],
] }));
const TIER_MSG = { 8: ['🔤 PULL / PUSH 등장!', '#1971c2'], 20: ['⚠️ 함정 사인 주의!', '#e8590c'], 34: ['🤯 말장난 사인 등장', '#7048e8'], [MIRROR_FROM]: ['🪞 거울 글씨 = 반대쪽 안내 → 반대로!', '#2b2438'] };

function reset() {
  for (const d of doors.values()) disposeTree(d.g);
  doors.clear(); cur = 0; tm = 1; charZ = STAND; move = null; fail = null;
  me.root.rotation.set(0, 0, 0); me.root.position.set(ME_X, 0, charZ); me.head.rotation.set(0, 0, 0);
  me.legs.forEach(l => l.rotation.x = 0); me.arms.forEach(a => a.rotation.set(0, 0, 0));
  stars.visible = false;
  ensureDoors(); updateHud();
}
function updateHud() { $score.innerHTML = `${cur}<small>개</small>`; }
function start() {
  state = 'count'; $center.style.display = 'none';
  Arcade.countdown({ final: '출근!', onTick: n => n ? Arcade.sfx.tick() : (Arcade.sfx.go(), Arcade.shake(.25)), onDone: () => { state = 'playing'; } });
}
function finishMove() { if (move) { charZ = move.to; move = null; } }
function press(action) {
  const b = $(action === 'pull' ? 'bpull' : 'bpush');
  b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 90);
  if (state !== 'playing') return;
  finishMove();
  const d = doors.get(cur);
  if (action !== d.action) return doFail(action === 'push' ? 'push' : 'pull', d);
  d.target = action === 'pull' ? -1.8 : 1.8;
  cur++; streakT = 0;
  tm = Math.min(1, tm + .1 + Math.max(0, .05 - cur * .001));
  move = { from: charZ, to: -cur * SP + STAND, t: 0 };
  ensureDoors(); updateHud();
  Arcade.sfx.pop(1 + Math.min(cur, 30) * .025);
  Arcade.vibrate(12);
  $score.animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 160 });
  if (TIER_MSG[cur]) Arcade.toast(...TIER_MSG[cur]);
  if (cur % 10 === 0) {
    Arcade.sfx.perfect(cur / 10); Arcade.confetti({ y: innerHeight * .35, count: 60 });
    if (!TIER_MSG[cur]) Arcade.toast(`🔥 ${cur}개 돌파!`, '#e8590c');
  }
}
function doFail(kind, d) {
  state = 'over'; fail = { kind, d, t: 0, z: charZ }; overAt = performance.now();
  if (kind === 'push') { Arcade.sfx.crash(); Arcade.shake(.6); Arcade.toast('쿵!! 당기는 문이었다', '#e03131'); d.rattle = .05; }
  else if (kind === 'pull') { Arcade.sfx.thud(); Arcade.sfx.boing(); Arcade.shake(.45); Arcade.toast('덜컹! 미는 문이었다', '#1971c2'); d.rattle = .12; }
  else { Arcade.sfx.miss(); Arcade.shake(.3); Arcade.toast('⏰ 지각!', '#2b2438'); }
  Arcade.vibrate([60, 40, 120]);
  setTimeout(showResult, 1300);
}
function showResult() {
  const isBest = cur > best;
  if (isBest) { best = cur; try { localStorage.setItem('door-best', best); } catch {} }
  isBest && cur > 0 ? Arcade.sfx.fanfare() : Arcade.sfx.fail();
  const { kind, d } = fail;
  const msg = kind === 'late' ? '부장님이 시계를 보고 있어요…' : kind === 'push' ? '얼굴로 문을 밀었습니다. 코가 아파요' : '아무리 당겨도 안 열리는 문';
  const rows = kind === 'late' ? [['통과한 문', `${cur}개`]] : [['마지막 사인', `"${d.text}"${d.mirror ? ' 🪞' : ''}`], ['정답', d.action === 'pull' ? '⬅ 당기기' : '밀기 ➡']];
  showScreen(Arcade.resultScreen({ emoji: kind === 'late' ? '⏰' : '🤕', label: '통과한 문', score: cur, unit: '개', msg, rows, isBest: isBest && cur > 0, best }));
  Arcade.gameOver(cur);
}
function tapAction() {
  if (state === 'ready') start();
  else if (state === 'over' && performance.now() - overAt > 1800 && !Arcade.inRun()) { reset(); start(); }
}

// ---------- input ----------
addEventListener('pointerdown', e => {
  if (state === 'playing') press(e.clientX < innerWidth / 2 ? 'pull' : 'push');
  else tapAction();
});
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (['ArrowLeft', 'KeyA', 'KeyJ'].includes(e.code)) { e.preventDefault(); state === 'playing' ? press('pull') : null; }
  else if (['ArrowRight', 'KeyD', 'KeyL'].includes(e.code)) { e.preventDefault(); state === 'playing' ? press('push') : null; }
  else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tapAction(); }
});

// ---------- loop ----------
const camPos = new THREE.Vector3(0, 3.4, STAND + 5.5), camLook = new THREE.Vector3(0, 1.3, -3);
let last = performance.now();
reset(); showIntro();
window.__door = { get state() { return state; }, get cur() { return cur; }, get tm() { return tm; }, doors, press, get answer() { return doors.get(cur)?.action; } };

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'playing') {
    streakT += dt;
    tm -= dt * (.14 + Math.min(.5, cur * .0075));
    if (tm <= 0) { tm = 0; doFail('late', doors.get(cur)); }
  }
  $tfill.style.transform = `scaleX(${tm})`;
  $timer.classList.toggle('low', state === 'playing' && tm < .3);

  // walking between doors
  let walk = 0;
  if (move) {
    move.t += dt / .2;
    const k = Math.min(1, move.t), e = 1 - (1 - k) * (1 - k);
    charZ = move.from + (move.to - move.from) * e; walk = Math.sin(k * Math.PI * 2);
    if (k >= 1) finishMove();
  }
  me.legs[0].rotation.x = walk * .7; me.legs[1].rotation.x = -walk * .7;
  me.arms[0].rotation.x = -walk * .5; me.arms[1].rotation.x = walk * .5;
  let z = charZ;
  if (fail) {
    fail.t += dt; const t = fail.t;
    if (fail.kind === 'push') {          // face-plants into a pull door, bounces back and tips over
      z = fail.z - (t < .1 ? t / .1 * .9 : Math.max(-.3, .9 - (t - .1) * 4));
      me.root.rotation.x = t < .12 ? -.3 : Math.min(1.45, (t - .12) * 6);
      me.arms.forEach(a => a.rotation.x = -1.2);
    } else if (fail.kind === 'pull') {   // yanks a push door, it won't budge, falls on the butt
      z = fail.z + Math.min(.4, t * 3);
      me.root.rotation.x = t < .25 ? 0 : Math.min(1.45, (t - .25) * 5);
      me.arms.forEach(a => a.rotation.x = -1.4);
    } else {                              // late: slump
      me.root.rotation.x = -Math.min(.35, t * 1.5); me.head.rotation.x = Math.min(.6, t * 2);
    }
    if (fail.kind !== 'late' && t > .25) {
      stars.visible = true; stars.position.set(ME_X, .3 + Math.cos(me.root.rotation.x) * 2.4, z + Math.sin(me.root.rotation.x) * 2.2); stars.rotation.y += dt * 6;
    }
  } else if (!move) {
    me.root.position.y = Math.abs(Math.sin(now / 260)) * .02;
  }
  me.root.position.z = z; me.root.position.x = ME_X;

  for (const d of doors.values()) {
    d.g.visible = d.i >= cur || (!!move && d.i === cur - 1 && move.t < .7);   // passed doors would block the chase camera
    d.pivot.rotation.y += (d.target - d.pivot.rotation.y) * Math.min(1, dt * 16);
    if (d.rattle > .002) { d.pivot.rotation.y = d.target + Math.sin(now * .09) * d.rattle; d.rattle *= Math.exp(-dt * 4); }
  }

  const cz = (fail ? fail.z : charZ);
  const wide = innerWidth / innerHeight < .8;   // portrait phones: pull the camera back a bit
  const cp = new THREE.Vector3(-.35, wide ? 4.2 : 3.4, cz + (wide ? 7.2 : 5.5));
  if (state === 'ready') cp.x = Math.sin(now / 1800) * 1.2;
  const k = Math.min(1, dt * 8);
  camPos.lerp(cp, k); camLook.lerp(new THREE.Vector3(0, 1.5, cz - 4), k);
  camera.position.copy(camPos); Arcade.applyShake(camera, dt); camera.lookAt(camLook);
  sun.position.set(3, 9, cz + 4); sun.target.position.set(0, 0, cz - 2);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
