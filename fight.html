<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>커맨드 파이터</title>
<script src="common.js?v=17"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b1d3a;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  .hud{display:none!important}
  #bars{position:fixed;left:0;right:0;top:max(12px,env(safe-area-inset-top));z-index:3;display:flex;gap:10px;align-items:center;padding:0 max(12px,env(safe-area-inset-left));pointer-events:none}
  .hp{flex:1;position:relative} .hp .nm{font:16px "Jua",sans-serif;color:#fff;text-shadow:0 2px 0 #000;margin-bottom:3px}
  .hp .bar{height:18px;border-radius:4px;background:#2b2438;border:3px solid #fff;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.4)}
  .hp .bar i{display:block;height:100%;background:linear-gradient(#ffe066,#f59f00);transform-origin:left;transition:transform .25s}
  #hpP .bar{display:flex;gap:3px;background:#fff;padding:0}
  #hpP .bar i{flex:1;transform:none;transition:background .2s,opacity .2s}
  #hpP .bar i.gone{background:#2b2438;animation:seg .4s}
  @keyframes seg{0%{background:#fff}50%{background:#e03131}}
  #hpE .bar i{background:linear-gradient(#ff8787,#e03131);transform-origin:right} #hpE{text-align:right}
  #ko{font:28px "Jua",sans-serif;color:#ffd43b;text-shadow:0 3px 0 #e03131;min-width:58px;text-align:center}
  #atk{position:fixed;left:50%;top:max(66px,calc(env(safe-area-inset-top) + 60px));transform:translateX(-50%);width:min(340px,70vw);z-index:3;pointer-events:none;text-align:center}
  #atk .lb{font:700 12px "Noto Sans KR",sans-serif;color:#ffc9c9}
  #atk .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:3px}
  #atk .bar i{display:block;height:100%;width:100%;background:#ff6b6b;transform-origin:left}
  #atk.danger .bar i{animation:dg .2s infinite} @keyframes dg{50%{background:#fff}}
  #cmd{position:fixed;left:50%;transform:translateX(-50%);top:max(104px,calc(env(safe-area-inset-top) + 96px));z-index:3;pointer-events:none;text-align:center;width:min(640px,calc(100% - 24px))}
  #cmd .nm{font:clamp(22px,5.5vw,32px) "Jua",sans-serif;color:#fff;text-shadow:0 3px 0 #5f3dc4}
  #cmd .lv{font:700 12px "Noto Sans KR",sans-serif;color:#d0bfff;margin-bottom:2px}
  #cmd .seq{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  #cmd .seq span{width:clamp(36px,9vw,52px);height:clamp(36px,9vw,52px);border-radius:12px;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.5);color:#fff;display:flex;align-items:center;justify-content:center;font:clamp(24px,6vw,34px) "Jua",sans-serif;transition:background .06s,transform .06s}
  #cmd .seq span.cur{border-color:#ffd43b;background:rgba(255,212,59,.25);transform:scale(1.12);animation:cu .5s infinite}
  @keyframes cu{50%{transform:scale(1.02)}}
  #cmd .seq span.hit{background:#ffd43b;border-color:#ffd43b;color:#2b2438;transform:scale(.92)}
  #cmd.bad .seq span{background:#e03131;border-color:#e03131;animation:bd .25s}
  @keyframes bd{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #cmd.go .seq span{background:#fff;color:#e8590c}
  #pad{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));z-index:4;display:flex;justify-content:center;gap:10px;padding:0 max(16px,env(safe-area-inset-left))}
  .b{border:0;border-radius:18px;width:min(84px,21vw);height:min(84px,21vw);background:rgba(255,255,255,.92);font:clamp(30px,8vw,40px) "Jua",sans-serif;color:#2b2438;box-shadow:0 6px 0 rgba(0,0,0,.45);cursor:pointer;touch-action:none}
  .b:active,.b.on{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.45);background:#ffd43b}
  #shout{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;font:clamp(34px,9vw,64px) "Jua",sans-serif;color:#fff;text-shadow:0 5px 0 #e03131,0 0 30px #ff922b;white-space:nowrap;opacity:0}
  #shout.show{animation:sh .9s ease-out}
  @keyframes sh{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2) rotate(-6deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
  .toast{top:36%}
  #flash{position:fixed;inset:0;z-index:6;pointer-events:none;background:#fff;opacity:0}
  .dn{position:fixed;z-index:6;pointer-events:none;font:clamp(36px,8vw,60px) "Jua",sans-serif;color:#ffd43b;-webkit-text-stroke:2px #2b1d3a;text-shadow:0 5px 0 #e03131;animation:dn .8s ease-out forwards}
  .dn.me{color:#ff6b6b;text-shadow:0 5px 0 #2b1d3a}
  @keyframes dn{0%{transform:translate(-50%,0) scale(2.4)}15%{transform:translate(-50%,0) scale(1)}100%{transform:translate(-50%,-90px) scale(.9);opacity:0}}
  #combo{position:fixed;left:max(16px,env(safe-area-inset-left));top:40%;z-index:3;pointer-events:none;font:30px "Jua",sans-serif;color:#ffd43b;text-shadow:0 3px 0 #e03131;opacity:0;transition:opacity .2s}
  #combo b{display:block;font-size:56px;line-height:1}
</style>
</head>
<body>
<div id="bars" class="hud-ctl"><div class="hp" id="hpP"><div class="nm">🥋 나</div><div class="bar"><i></i><i></i><i></i></div></div><div id="ko">R1</div><div class="hp" id="hpE"><div class="nm" id="enm">상대</div><div class="bar"><i id="hpEf"></i></div></div></div>
<div id="atk" class="hud-ctl"><div class="lb" id="atkl">상대 공격까지</div><div class="bar"><i id="atkf"></i></div></div>
<div id="cmd" class="hud-ctl"></div>
<div id="pad" class="hud-ctl"><button class="b" data-k="L">←</button><button class="b" data-k="D">↓</button><button class="b" data-k="U">↑</button><button class="b" data-k="R">→</button></div>
<div id="shout" class="hud-ctl"></div>
<div id="flash"></div><div id="combo" class="hud-ctl"><b>0</b>HIT COMBO</div>
<div class="screen" id="center"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $ = id => document.getElementById(id);
const rnd = a => a[(Math.random() * a.length) | 0];
const ICON = { U: '↑', D: '↓', L: '←', R: '→' };

// ---------- original moves; the command itself is random every time ----------
const MOVES = [
  { name: '🔥 열혈 장풍', fx: 'ball', min: 3 },
  { name: '🌀 회오리 돌려차기', fx: 'spin', min: 3 },
  { name: '⚡ 천둥 어퍼', fx: 'upper', min: 3 },
  { name: '🐉 용꼬리 콤보', fx: 'tail', min: 4 },
  { name: '💥 백만 주먹', fx: 'mill', min: 5 },
  { name: '🍜 라면 대폭발', fx: 'ramen', min: 6 },
  { name: '🌪️ 필살 폭풍난무', fx: 'storm', min: 7 },
];
const FOES = [
  { name: '🥋 동네 관장님', hp: 50, col: 0xffffff, belt: 0x212529 },
  { name: '🛵 번개 배달부', hp: 90, col: 0xe03131, belt: 0xffd43b },
  { name: '🏋️ 헬스장 터줏대감', hp: 150, col: 0x212529, belt: 0x868e96 },
  { name: '🤖 폭주 로봇청소기 맨', hp: 220, col: 0xadb5bd, belt: 0x3bc9db },
  { name: '👵 시장 할머니 (전설)', hp: 320, col: 0xae3ec9, belt: 0xfab005 },
];
// ---------- three: arcade stage, side view ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b1d3a);
scene.fog = new THREE.Fog(0x2b1d3a, 14, 40);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, .1, 100);
scene.add(new THREE.HemisphereLight(0xffd6f0, 0x2b1d3a, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(3, 8, 6); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); scene.add(key);
const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, flatShading: true, ...extra });
const crowd = [];
const box = (w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof mat === 'number' ? flat(mat) : mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; };
{
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(40, 14), flat(0x6b4226)); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; scene.add(fl);
  for (let x = -18; x <= 18; x += 2) box(1.9, .02, 14, x % 4 ? 0x7a4a2a : 0x5c3a21, x, .01, 0);
  // neon street backdrop
  const COLS = [0x5f3dc4, 0x862e9c, 0x364fc7, 0xc2255c];
  for (let i = 0; i < 12; i++) { const h = 3 + Math.random() * 6; const b = box(2.4, h, 1.5, COLS[i % 4], -14 + i * 2.6, h / 2, -5); }
  for (let i = 0; i < 6; i++) { const n = new THREE.Mesh(new THREE.BoxGeometry(1.6, .3, .05), new THREE.MeshBasicMaterial({ color: [0xff6bcb, 0x3bc9db, 0xffd43b][i % 3] })); n.position.set(-10 + i * 4, 3 + Math.random() * 2, -4.2); scene.add(n); }
  for (let i = 0; i < 14; i++) { const p = new THREE.Group(); const c = rnd([0xff8787, 0x74c0fc, 0xffd43b, 0x8ce99a]); box(.4, .6, .3, c, 0, .6, 0, p); box(.3, .3, .3, 0xffd2a8, 0, 1.05, 0, p); p.position.set(-9 + i * 1.4, 0, -3); p.userData.ph = Math.random() * 6; scene.add(p); crowd.push(p); }
}
function makeFighter(col, belt, hair, flip) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const gi = flat(col), skin = flat(0xffd2a8);
  const legs = [-1, 1].map(s => { const p = new THREE.Group(); p.position.set(0, .95, s * .17); box(.3, .95, .28, gi, 0, -.47, 0, p); box(.36, .12, .3, flat(0x222222), .06, -.95, 0, p); body.add(p); return p; });
  box(.5, .9, .75, gi, 0, 1.4, 0, body); box(.52, .12, .77, flat(belt), 0, 1.0, 0, body);
  const arms = [-1, 1].map(s => { const p = new THREE.Group(); p.position.set(0, 1.78, s * .46); box(.22, .7, .22, gi, 0, -.33, 0, p); const fist = new THREE.Mesh(new THREE.DodecahedronGeometry(.15, 0), skin); fist.position.y = -.72; p.add(fist); body.add(p); return p; });
  const head = new THREE.Group(); head.position.y = 1.88; body.add(head);
  box(.46, .5, .46, skin, 0, .25, 0, head); box(.5, .16, .5, flat(hair), -.02, .52, 0, head);
  box(.02, .08, .07, flat(0x222222), .24, .3, .1, head); box(.02, .08, .07, flat(0x222222), .24, .3, -.1, head);
  const band = box(.52, .08, .52, flat(0xe03131), 0, .42, 0, head);
  root.traverse(o => { if (o.isMesh) o.castShadow = true; });
  root.rotation.y = flip ? Math.PI : 0;   // fighters face +x by default
  scene.add(root);
  return { root, body, legs, arms, head, pose: 'idle', poseT: 0, hurtT: 0 };
}
const me = makeFighter(0x4dabf7, 0x212529, 0x2b2b2b, false); me.root.position.set(-2.2, 0, 0);
let foe = null;
const fxs = [];
function spark(pos, color, n = 14, power = 4) {
  for (let i = 0; i < n; i++) { const m = new THREE.Mesh(new THREE.OctahedronGeometry(.08 + Math.random() * .08, 0), new THREE.MeshBasicMaterial({ color })); m.position.copy(pos); scene.add(m); fxs.push({ m, v: new THREE.Vector3((Math.random() - .5) * power, Math.random() * power, (Math.random() - .5) * power), t: 0, life: .5 }); }
}

// ---------- juice: own impact synth, hit-stop, flash, damage numbers ----------
let AC = null;
const ac = () => { if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} if (AC && AC.state === 'suspended') AC.resume(); return AC; };
function thump(power = 1, pitch = 1) {   // low body hit + crunchy noise crack
  const c = ac(); if (!c) return; const t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(170 * pitch, t); o.frequency.exponentialRampToValueAtTime(38, t + .18 + power * .08);
  g.gain.setValueAtTime(.9 * Math.min(1.3, power), t); g.gain.exponentialRampToValueAtTime(.001, t + .25 + power * .1);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + .5);
  const n = c.createBufferSource(), len = c.sampleRate * .16, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  n.buffer = buf; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800 * pitch; f.Q.value = .7;
  const ng = c.createGain(); ng.gain.value = .7 * Math.min(1.3, power); n.connect(f).connect(ng).connect(c.destination); n.start(t);
}
function blip(step) {   // crisp input click, rises with each correct step
  const c = ac(); if (!c) return; const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = 'square'; o.frequency.value = step < 0 ? 140 : 440 * Math.pow(1.19, step);
  g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .07); o.connect(g).connect(c.destination); o.start(t); o.stop(t + .08);
}
let atkMax0 = 3, hitstop = 0, zoomKick = 0, stunT = 0;
function flash(a = .7) { const f = $('flash'); f.style.transition = 'none'; f.style.opacity = a; requestAnimationFrame(() => { f.style.transition = 'opacity .18s'; f.style.opacity = 0; }); }
function dmgNum(n, worldPos, mine) {
  const v = worldPos.clone().project(camera), el = document.createElement('div');
  el.className = 'dn' + (mine ? ' me' : ''); el.textContent = n;
  el.style.left = (v.x * .5 + .5) * innerWidth + 'px'; el.style.top = (-v.y * .5 + .5) * innerHeight - 40 + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 850);
}
function showCombo() { const el = $('combo'); el.querySelector('b').textContent = combo; el.style.opacity = combo >= 2 ? 1 : 0; }

// ---------- state ----------
let lv = 0, cur = null, gap = 0;
let state = 'ready', round = 0, hpP = 3, hpE = 60, atkT = 3, atkMax = 3, buffer = [], score = 0, overAt = 0, combo = 0, projectiles = [], slowmo = 0;
let best = 0; try { best = +localStorage.getItem('fight-best') || 0; } catch {}
const $center = $('center'), $cmd = $('cmd');
const showScreen = html => { $center.innerHTML = html; $center.style.display = ''; };
const showIntro = () => showScreen(Arcade.titleScreen({ emoji: '🥋', title: '커맨드 파이터', how: [
  ['🎴', '기술이 뜨면 <b>랜덤 커맨드</b>를 방향키로 그대로 입력!'],
  ['🕹️', '처음엔 3개, 점점 길어져요. 길수록 데미지 큼'],
  ['⏳', '빨간 <b>공격 게이지</b>가 다 닳거나 <b>틀리면</b> 반격! 체력 3칸'],
  ['🏆', '상대를 쓰러뜨릴수록 시간이 촉박해져요. 5연승 도전!'],
] }));
const ARR = ['U', 'D', 'L', 'R'];
function cmdLen() { return Math.min(9, 3 + Math.floor(lv / 3)); }           // 3,3,3,4,4,4,5…
function newCommand() {
  const len = cmdLen(), seq = [];
  for (let i = 0; i < len; i++) { let a; do a = rnd(ARR); while (i >= 2 && a === seq[i - 1] && a === seq[i - 2]); seq.push(a); }
  const pool = MOVES.filter(m => m.min <= len), move = pool[pool.length - 1 - ((Math.random() * Math.min(3, pool.length)) | 0)];
  cur = { move, seq, idx: 0 };
  const perKey = Math.max(.26, .8 - lv * .022 - round * .03);              // seconds per arrow, shrinking
  atkMax = .5 + len * perKey; atkT = atkMax;
  renderCmd();
}
function renderCmd(cls = '') {
  if (!cur) { $cmd.innerHTML = ''; return; }
  $cmd.className = 'hud-ctl ' + cls;
  $cmd.innerHTML = `<div class="lv">커맨드 ${cur.seq.length}개 · 데미지 ${dmgOf(cur.seq.length)}</div><div class="nm">${cur.move.name}</div><div class="seq">${cur.seq.map((a, i) => `<span class="${i < cur.idx ? 'hit' : i === cur.idx ? 'cur' : ''}">${ICON[a]}</span>`).join('')}</div>`;
}
const dmgOf = len => Math.round(len * len * 1.1 + len * 2);   // 3→16, 5→38, 7→68
function updateBars() {
  document.querySelectorAll('#hpP .bar i').forEach((el, i) => el.classList.toggle('gone', i >= hpP));
  $('hpEf').style.transform = `scaleX(${Math.max(0, hpE) / FOES[Math.min(round, FOES.length - 1)].hp})`;
  $('ko').textContent = `R${round + 1}`;
}
function shout(text) { const el = $('shout'); el.textContent = text; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function setupRound() {
  const F = FOES[Math.min(round, FOES.length - 1)];
  if (foe) scene.remove(foe.root);
  foe = makeFighter(F.col, F.belt, rnd([0x2b2b2b, 0xdee2e6, 0x6b4f3a]), true); foe.root.position.set(2.2, 0, 0);
  if (round === 4) foe.root.scale.setScalar(.9);
  hpE = F.hp; cur = null; gap = .8;
  $('enm').textContent = F.name; updateBars(); renderCmd();
}
function input(k) {
  if (state !== 'playing' || stunT > 0 || !cur) return;
  const btn = document.querySelector(`[data-k="${k}"]`); if (btn) { btn.classList.add('on'); setTimeout(() => btn.classList.remove('on'), 90); }
  Arcade.vibrate(8);
  if (k !== cur.seq[cur.idx]) { blip(-1); Arcade.sfx.miss(); renderCmd('bad'); failCmd('틀렸다'); return; }
  blip(cur.idx); cur.idx++;
  me.pose = cur.idx % 2 ? 'jab' : 'flick'; me.poseT = 0;
  if (cur.idx >= cur.seq.length) fire(); else renderCmd();
}
function failCmd(why) { enemyAttack(why); cur = null; gap = .8; setTimeout(() => { if (!cur) renderCmd(); }, 320); }
function fire() {
  const m = cur.move, len = cur.seq.length; renderCmd('go'); cur = null; gap = .55; lv++; combo++;
  setTimeout(() => { if (!cur) renderCmd(); }, 380);
  me.pose = m.fx; me.poseT = 0;
  shout(m.name.replace(/^\S+\s/, '') + '!!');
  Arcade.sfx.whoosh(true); Arcade.vibrate([20, 30, 40]);
  const dmg = Math.round(dmgOf(len) * (1 + Math.min(.5, combo * .05)));
  if (m.fx === 'ball' || m.fx === 'ramen' || m.fx === 'storm') {
    const color = m.fx === 'ramen' ? 0xffd8a8 : m.fx === 'storm' ? 0x74c0fc : 0xff922b;
    const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(m.fx === 'storm' ? .6 : .38, 1), new THREE.MeshBasicMaterial({ color }));
    const glow = new THREE.Mesh(new THREE.IcosahedronGeometry(m.fx === 'storm' ? 1 : .65, 1), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .35 })); ball.add(glow);
    ball.position.set(me.root.position.x + .7, 1.6, 0); scene.add(ball); projectiles.push({ m: ball, dmg, move: m });
  } else setTimeout(() => hit(dmg, m), 220);
}
function hit(dmg, m) {
  if (state !== 'playing' || !foe) return;
  hpE -= dmg; score += dmg; updateBars();
  const big = dmg >= 38, hp0 = foe.root.position.clone().setY(1.7);
  foe.hurtT = .4; foe.kb = (foe.kb || 0) + .6 + dmg / 25;
  spark(new THREE.Vector3(foe.root.position.x - .3, 1.6, 0), 0xffffff, 10, 9); spark(new THREE.Vector3(foe.root.position.x - .3, 1.6, 0), rnd([0xffd43b, 0xff922b]), big ? 34 : 18, big ? 10 : 6);
  thump(.6 + dmg / 30, big ? .8 : 1); if (big) setTimeout(() => thump(1.2, .6), 90);
  hitstop = big ? .16 : .08; zoomKick = big ? 1 : .5; flash(big ? .85 : .45);
  Arcade.shake(.2 + dmg / 90); slowmo = big ? .45 : 0; dmgNum(dmg, hp0, false); showCombo();
  Arcade.toast(`${m.name} -${dmg}${combo >= 3 ? ` · ${combo}콤보!` : ''}`, '#e8590c');
  if (hpE <= 0) ko();
}
function ko() {
  state = 'ko'; shout('K.O.!!'); hitstop = .35; slowmo = 1.2; zoomKick = 1.6; flash(1); thump(1.4, .5); setTimeout(() => thump(1.2, .4), 140); Arcade.sfx.fanfare(); Arcade.confetti({ y: innerHeight * .4, count: 100, emoji: ['🥋', '💥', '⭐'] }); Arcade.vibrate([50, 40, 100]);
  foe.pose = 'down'; foe.poseT = 0; score += 100 + hpP * 30;
  setTimeout(() => {
    round++;
    if (round >= FOES.length) { shout('🏆 전설 등극!'); setTimeout(finish, 1200); return; }
    hpP = Math.min(3, hpP + 1); setupRound(); state = 'playing'; Arcade.toast(`🔔 ROUND ${round + 1} · ${FOES[round].name}`, '#5f3dc4'); Arcade.sfx.go();
  }, 1800);
}
function enemyAttack(why = '시간 초과') {
  if (state !== 'playing') return;
  stunT = .45;
  foe.pose = rnd(['punchE', 'kickE']); foe.poseT = 0; combo = 0; showCombo();
  setTimeout(() => {
    if (state !== 'playing') return;
    hpP -= 1; updateBars(); me.hurtT = .45; me.kb = -1.1; thump(1, .7); hitstop = .1; flash(.35); showCombo();
    dmgNum('-1', me.root.position.clone().setY(1.7), true); document.body.animate([{ boxShadow: 'inset 0 0 120px #e03131' }, { boxShadow: 'inset 0 0 0 transparent' }], 400);
    spark(new THREE.Vector3(me.root.position.x + .3, 1.6, 0), 0xff6b6b, 14, 5);
    Arcade.sfx.thud(); Arcade.shake(.35); Arcade.vibrate([60, 40, 80]); Arcade.toast(`😵 ${why}! 반격 맞음 (남은 체력 ${Math.max(0, hpP)}/3)`, '#e03131');
    if (hpP <= 0) { state = 'over-anim'; me.pose = 'down'; me.poseT = 0; shout('YOU LOSE…'); Arcade.sfx.fail(); setTimeout(finish, 1500); }
  }, 180);
  atkT = atkMax;
}
function finish() {
  state = 'over'; overAt = performance.now();
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('fight-best', best); } catch {} }
  if (isBest && score > 0) Arcade.sfx.fanfare();
  const msg = round >= 5 ? '시장 할머니까지 쓰러뜨렸다! 전설의 파이터' : round >= 3 ? '동네 최강자 등극' : round >= 1 ? '첫 승은 거뒀다!' : '관장님께 한 수 배워야겠어요';
  showScreen(Arcade.resultScreen({ emoji: '🥋', label: '파이트 점수', score, unit: '점', msg, rows: [['이긴 라운드', `${round}승`]], isBest: isBest && score > 0, best }));
  Arcade.gameOver(score);
}
function reset() { round = 0; lv = 0; hpP = 3; score = 0; combo = 0; me.pose = 'idle'; setupRound(); }
function start() {
  state = 'count'; $center.style.display = 'none';
  Arcade.countdown({ final: 'FIGHT!', onTick: n => n ? Arcade.sfx.tick() : (Arcade.sfx.go(), Arcade.shake(.2)), onDone: () => { state = 'playing'; gap = .2; } });
}
function tapStart() {
  if (state === 'ready') start();
  else if (state === 'over' && performance.now() - overAt > 1200 && !Arcade.inRun()) { reset(); start(); }
}

// ---------- input ----------
document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); input(b.dataset.k); }));
addEventListener('pointerdown', e => { if (e.target.closest?.('.b, .arcade-btn')) return; if (state === 'ready' || state === 'over') tapStart(); });
const KEYS = { ArrowUp: 'U', KeyW: 'U', ArrowDown: 'D', KeyS: 'D', ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R' };
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (KEYS[e.code]) { e.preventDefault(); input(KEYS[e.code]); }
  else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tapStart(); }
});

function placeCamera() {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 60 : 38; camera.updateProjectionMatrix();
}
placeCamera();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); placeCamera(); });

// ---------- poses ----------
function animate(f, t, dt, dir) {
  f.poseT += dt; const k = f.poseT;
  const b = f.body, A = f.arms, L = f.legs;
  b.rotation.set(0, 0, 0); b.position.set(0, 0, 0);
  A[0].rotation.set(0, 0, 0); A[1].rotation.set(0, 0, 0); L[0].rotation.set(0, 0, 0); L[1].rotation.set(0, 0, 0);
  // guard stance bounce
  b.position.y = Math.abs(Math.sin(t * 6)) * .05; A[0].rotation.z = 1.6; A[1].rotation.z = 1.3; L[0].rotation.z = .25; L[1].rotation.z = -.2;
  const pose = f.pose;
  if (pose === 'ball' || pose === 'ramen' || pose === 'storm') { if (k < .5) { A[0].rotation.z = A[1].rotation.z = Math.PI / 2; b.rotation.z = -.15; b.position.x = .15; } }
  else if (pose === 'spin') { if (k < .5) { b.rotation.y = k * 4 * Math.PI; L[0].rotation.z = 1.5; b.position.y = .3; } }
  else if (pose === 'upper') { if (k < .55) { b.position.y = Math.sin(k / .55 * Math.PI) * 1.4; A[0].rotation.z = Math.PI; b.rotation.z = .1; } }
  else if (pose === 'tail') { if (k < .6) { b.rotation.y = Math.sin(k * 25) * .6; L[k * 25 % 2 < 1 ? 0 : 1].rotation.z = 1.6; b.position.x = .3; } }
  else if (pose === 'mill') { if (k < .6) { A[0].rotation.z = Math.PI / 2 + Math.sin(k * 60) * .4; A[1].rotation.z = Math.PI / 2 - Math.sin(k * 60) * .4; b.position.x = .3; } }
  else if (pose === 'jab') { if (k < .12) { A[0].rotation.z = Math.PI / 2; b.position.x = .12; } }
  else if (pose === 'flick') { if (k < .14) { L[0].rotation.z = 1.2; } }
  else if (pose === 'punchE') { if (k < .35) { A[0].rotation.z = Math.PI / 2; b.position.x = .5; } }
  else if (pose === 'kickE') { if (k < .35) { L[0].rotation.z = 1.6; b.rotation.z = -.2; b.position.x = .3; } }
  else if (pose === 'down') { b.rotation.z = -Math.min(1.5, k * 4); b.position.y = Math.max(-.2, -k); }
  if (f.pose !== 'idle' && f.pose !== 'down' && k > ((f.pose === 'jab' || f.pose === 'flick') ? .15 : .7)) f.pose = 'idle';
  if (f.hurtT > 0) { f.hurtT -= dt; b.position.x -= .25 * Math.sin(f.hurtT * 20); b.rotation.z += .2; }
}

// ---------- loop ----------
let last = performance.now();
reset(); showIntro();
window.__fight = { get state() { return state; }, input, get hpE() { return hpE; }, get hpP() { return hpP; }, get round() { return round; }, get atkT() { return atkT; }, get cur() { return cur; }, get lv() { return lv; }, MOVES };

function frame(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  const realDt = dt;
  if (hitstop > 0) { hitstop -= realDt; dt = 0; }
  else if (slowmo > 0) { slowmo -= dt; dt *= .35; }
  zoomKick = Math.max(0, zoomKick - realDt * 3);
  for (const f of [me, foe]) if (f) { const home = f === me ? -2.2 : 2.2, dir = f === me ? -1 : 1; f.kb = (f.kb || 0) * Math.pow(.02, dt); f.root.position.x = home + dir * Math.abs(f.kb) * .6; }
  stunT -= realDt;
  if (state === 'playing') {
    if (cur) { atkT -= dt; if (atkT <= 0) failCmd('시간 초과'); }
    else if (gap > 0) { gap -= dt; if (gap <= 0) newCommand(); }
  }
  $('atkf').style.transform = `scaleX(${Math.max(0, Math.min(1, atkT / atkMax))})`;
  $('atk').classList.toggle('danger', state === 'playing' && !!cur && atkT < atkMax * .3);
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i]; p.m.position.x += dt * 9; p.m.rotation.x += dt * 8; p.m.rotation.y += dt * 6;
    if (Math.random() < .5) spark(p.m.position.clone(), p.m.material.color.getHex(), 1, 1.5);
    if (foe && p.m.position.x >= foe.root.position.x - .4) { scene.remove(p.m); projectiles.splice(i, 1); hit(p.dmg, p.move); }
  }
  for (let i = fxs.length - 1; i >= 0; i--) { const f = fxs[i]; f.t += dt; f.v.y -= 9 * dt; f.m.position.addScaledVector(f.v, dt); f.m.scale.setScalar(Math.max(.01, 1 - f.t / f.life)); if (f.t > f.life) { scene.remove(f.m); fxs.splice(i, 1); } }
  animate(me, t, dt); if (foe) animate(foe, t + 1.3, dt);
  for (const c of crowd) c.position.y = Math.abs(Math.sin(t * (state === 'ko' ? 14 : 4) + c.userData.ph)) * (state === 'ko' ? .4 : .08);
  const portrait = innerWidth < innerHeight;
  camera.position.set(0, portrait ? 2.8 : 2.5, (portrait ? 12.5 : 10.5) - zoomKick * 1.4); Arcade.applyShake(camera, dt); camera.lookAt(0, portrait ? 1.9 : 1.75, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
