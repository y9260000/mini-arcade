<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>임장 매의 눈</title>
<script src="common.js?v=17"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e2d6;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  .hud-score{font-size:40px}
  #room{font-family:"Jua",sans-serif}
  #timer{width:min(260px,60vw);height:12px;border-radius:999px;background:rgba(43,36,56,.2);overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.2)}
  #timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b6b,#ffd43b 40%,#51cf66);transform-origin:left;border-radius:999px}
  #timer.low{animation:lowT .3s ease-in-out infinite}
  @keyframes lowT{50%{box-shadow:0 0 0 3px #ff6b6b}}
  #found{font-family:"Jua",sans-serif}
  .mark{position:fixed;z-index:4;pointer-events:none;transform:translate(-50%,-50%);width:50px;height:50px;border:4px solid #e03131;border-radius:50%;box-shadow:0 0 0 3px #fff;animation:mk .3s cubic-bezier(.2,1.6,.4,1)}
  .mark.missed{border-color:#fab005;border-style:dashed;animation:blink .5s infinite}
  @keyframes mk{from{transform:translate(-50%,-50%) scale(2);opacity:0}}
  @keyframes blink{50%{opacity:.3}}
  .lbl{position:fixed;z-index:4;pointer-events:none;transform:translate(-50%,-150%);white-space:nowrap;font-family:"Jua",sans-serif;font-size:15px;color:#fff;background:#e03131;border-radius:999px;padding:3px 10px}
  .lbl.missed{background:#e8590c}
  .xmark{position:fixed;z-index:4;pointer-events:none;transform:translate(-50%,-50%);font-family:"Jua",sans-serif;font-size:28px;color:#e03131;text-shadow:0 2px 0 #fff;animation:xm .6s forwards}
  @keyframes xm{to{opacity:0;transform:translate(-50%,-90%)}}
  #hint{position:fixed;bottom:max(12vh,76px);left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
  #hint .pill{font-size:15px;padding:10px 18px}
  .toast{top:30%}
</style>
</head>
<body>
<div class="hud">
  <div id="score" class="hud-score">0<small>만원</small></div>
  <div class="hud-row"><span class="pill" id="lives"></span><span class="pill dark" id="room">원룸</span><span class="pill" id="found">🔍 0/0</span></div>
  <div class="hud-row"><div id="timer"><i id="tfill"></i></div></div>
</div>
<div id="hint" class="hud-ctl"><span class="pill">👆 하자를 찾아 탭! 헛클릭은 -3초</span></div>
<div class="screen" id="center"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $ = id => document.getElementById(id);
const rnd = a => a[(Math.random() * a.length) | 0];
const rr = (a, b) => a + Math.random() * (b - a);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- three: dollhouse cut-away (two walls) ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e2d6);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, .1, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0xcab89a, 1.5));
{ const fill = new THREE.DirectionalLight(0xffffff, 1.1); fill.position.set(6, 5, 9); scene.add(fill); }   // lights the two back walls from the open side
const key = new THREE.DirectionalLight(0xfff4e0, 1.5); key.position.set(4, 9, 6); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 }); scene.add(key);
const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .85, flatShading: true, ...extra });
const box = (w, h, d, mat, x = 0, y = 0, z = 0, parent) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof mat === 'number' ? flat(mat) : mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; (parent || room).add(m); return m; };
const WALL_H = 2.3;
let room = new THREE.Group(); scene.add(room);
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(0, .7, 0);
let W = 6, D = 5, occupied = [], defects = [], hits = [], marks = [], movers = [];

// ---------- textures ----------
function texOf(draw, rep) { const c = document.createElement('canvas'); c.width = c.height = 128; draw(c.getContext('2d')); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.colorSpace = THREE.SRGBColorSpace; return t; }
const woodTex = (c1, c2) => texOf(g => { g.fillStyle = c1; g.fillRect(0, 0, 128, 128); g.fillStyle = c2; for (let i = 0; i < 128; i += 32) g.fillRect(0, i, 128, 2); for (let i = 0; i < 4; i++) g.fillRect((i * 37) % 128, i * 32, 2, 32); }, [W / 2, D / 2]);
const tileTex = (c1, c2, n = 4) => texOf(g => { g.fillStyle = c1; g.fillRect(0, 0, 128, 128); g.fillStyle = c2; const s = 128 / n; for (let i = 0; i <= n; i++) { g.fillRect(i * s - 1, 0, 2, 128); g.fillRect(0, i * s - 1, 128, 2); } }, [W, D]);
const checkTex = (c1, c2) => texOf(g => { g.fillStyle = c1; g.fillRect(0, 0, 128, 128); g.fillStyle = c2; g.fillRect(0, 0, 64, 64); g.fillRect(64, 64, 64, 64); }, [W, D]);
const concreteTex = c1 => texOf(g => { g.fillStyle = c1; g.fillRect(0, 0, 128, 128); for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * .08})`; g.fillRect(Math.random() * 128, Math.random() * 128, 3, 3); } }, [W / 2, D / 2]);

// ---------- placement helpers ----------
const free = (x, z, w, d) => Math.abs(x) + w / 2 < W / 2 - .05 && Math.abs(z) + d / 2 < D / 2 - .05 && !occupied.some(o => Math.abs(o.x - x) < (o.w + w) / 2 + .1 && Math.abs(o.z - z) < (o.d + d) / 2 + .1);
function spot(w, d, where = 'any', h = 1) {   // find a free floor rectangle: against the back wall, the left wall, or anywhere
  for (let i = 0; i < 60; i++) {
    let x = rr(-W / 2 + w / 2 + .1, W / 2 - w / 2 - .1), z = rr(-D / 2 + d / 2 + .1, D / 2 - d / 2 - .1);
    if (where === 'back') z = -D / 2 + d / 2 + .08; if (where === 'left') x = -W / 2 + w / 2 + .08;
    if (free(x, z, w, d)) { occupied.push({ x, z, w, d, h }); return { x, z }; }
  }
  return null;
}
function hiddenOnWall(ws) {   // is this wall point behind furniture (as seen from the open corner)?
  const back = ws.rotY === 0, { x, y, z } = ws.p;
  return occupied.some(o => (o.h ?? 1) + .3 > y && (back
    ? o.z - o.d / 2 < -D / 2 + 1.3 && Math.abs(o.x - x) < o.w / 2 + .35
    : o.x - o.w / 2 < -W / 2 + 1.3 && Math.abs(o.z - z) < o.d / 2 + .35));
}
function wallSpot(yMin = .4, yMax = 2) {   // a visible point on one of the two walls, with its facing
  let ws;
  for (let i = 0; i < 40; i++) {
    const back = Math.random() < W / (W + D);
    ws = back ? { p: new THREE.Vector3(rr(-W / 2 + .4, W / 2 - .4), rr(yMin, yMax), -D / 2 + .09), rotY: 0 } : { p: new THREE.Vector3(-W / 2 + .09, rr(yMin, yMax), rr(-D / 2 + .4, D / 2 - .4)), rotY: Math.PI / 2 };
    if (!hiddenOnWall(ws)) return ws;
  }
  return ws;
}
const onWall = (obj, ws) => { obj.position.copy(ws.p); obj.rotation.y = ws.rotY; room.add(obj); return obj; };
function blot(color, size, opacity, n = 5) {
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) { const d = new THREE.Mesh(new THREE.CircleGeometry(size * rr(.35, .8), 9), new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 })); d.renderOrder = 2; d.position.set(rr(-.5, .5) * size, rr(-.5, .5) * size, i * .002); g.add(d); }
  return g;
}
function crackLines(len = 6, color = 0x343a40, op = .9) {
  const g = new THREE.Group(); let x = 0, y = 0;
  for (let i = 0; i < len; i++) { const s = new THREE.Mesh(new THREE.PlaneGeometry(.026, .2), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op, polygonOffset: true, polygonOffsetFactor: -4 })); s.renderOrder = 2; s.position.set(x, y, .003); s.rotation.z = rr(-.6, .6); g.add(s); x += rr(-.07, .07); y -= .17; }
  return g;
}
const floorDecal = (obj, x, z) => { obj.rotation.x = -Math.PI / 2; obj.position.set(x, .012, z); room.add(obj); return obj; };
function outlet(ws, burnt) {
  const g = new THREE.Group(); box(.16, .22, .03, 0xffffff, 0, 0, 0, g);
  for (const s of [-1, 1]) box(.025, .025, .01, 0x495057, s * .035, 0, .02, g);
  if (burnt) { const b = blot(0x212529, .09, .9, 4); b.position.z = .02; g.add(b); }
  return onWall(g, ws);
}
function windowOn(ws, w = 1.3, h = 1) {
  const g = new THREE.Group();
  box(w, h, .04, new THREE.MeshStandardMaterial({ color: 0xbfe3ff, transparent: true, opacity: .6, roughness: .05 }), 0, 0, 0, g);
  for (const [x, y, ww, hh] of [[0, h / 2, w + .1, .07], [0, -h / 2, w + .1, .07], [-w / 2, 0, .07, h], [w / 2, 0, .07, h], [0, 0, .05, h]]) box(ww, hh, .07, 0xffffff, x, y, .02, g);
  return onWall(g, ws);
}

// ---------- room types ----------
const PALETTE = { wall: [0xfff4e6, 0xf3f0ff, 0xe7f5ff, 0xfff0f6, 0xebfbee, 0xf8f9fa, 0xfff9db], wood: [['#d9a066', '#c48a50'], ['#b08968', '#9c7656'], ['#e3c9a3', '#cfb085'], ['#8d6e63', '#7a5c52']] };
const ROOM_TYPES = {
  oneroom: {
    name: '🛏️ 원룸', floor: () => woodTex(...rnd(PALETTE.wood)), wall: () => rnd(PALETTE.wall),
    furnish() {
      const b = spot(1.1, 2, rnd(['back', 'left']), .55); if (b) { box(1.1, .35, 2, rnd([0x748ffc, 0xf783ac, 0x69db7c, 0xffd43b]), b.x, .18, b.z); box(1.05, .12, .5, 0xffffff, b.x, .41, b.z - .65); }
      const ds = spot(1.1, .55, 'back', 1.1); if (ds) { box(1.1, .05, .55, 0xdeb887, ds.x, .75, ds.z); for (const [dx, dz] of [[-.5, -.22], [.5, -.22], [-.5, .22], [.5, .22]]) box(.05, .75, .05, 0x8d5a3b, ds.x + dx, .375, ds.z + dz); box(.35, .25, .03, 0x212529, ds.x, .92, ds.z - .1); }
      const wr = spot(.9, .55, rnd(['back', 'left']), 1.9); if (wr) box(.9, 1.8, .55, rnd([0xc69c6d, 0xf8f9fa, 0x868e96]), wr.x, .9, wr.z);
      const rug = spot(1.3, 1, 'any'); if (rug) { const r = new THREE.Mesh(new THREE.CircleGeometry(.6, 20), flat(rnd([0xffc9c9, 0xd0ebff, 0xd3f9d8]))); floorDecal(r, rug.x, rug.z); occupied.pop(); }
      const pl = spot(.4, .4, 'any', .85); if (pl) plant(pl.x, pl.z);
      windowOn(wallSpot(1.3, 1.6), rr(1, 1.5)); decoys(2);
    },
    pool: ['mold', 'crack', 'stain', 'socket', 'roach', 'bulge', 'windowCrack', 'puddle', 'frame'],
  },
  bath: {
    name: '🛁 욕실', floor: () => tileTex(rnd(['#e7f5ff', '#f8f9fa', '#fff0f6']), '#adb5bd', 6), wall: () => rnd([0xffffff, 0xe7f5ff, 0xf1f3f5]),
    furnish() {
      const tb = spot(1.6, .8, 'back', .6); if (tb) { box(1.6, .55, .8, 0xffffff, tb.x, .28, tb.z); box(1.4, .05, .6, new THREE.MeshStandardMaterial({ color: 0x9ad1ff, transparent: true, opacity: .6 }), tb.x, .5, tb.z); env.tub = tb; }
      const tl = spot(.45, .65, rnd(['back', 'left']), .75); if (tl) { box(.4, .4, .5, 0xffffff, tl.x, .2, tl.z); box(.4, .5, .15, 0xffffff, tl.x, .45, tl.z - .25); }
      const sk = spot(.6, .45, rnd(['back', 'left']), 1.8); if (sk) { box(.6, .8, .45, 0xffffff, sk.x, .4, sk.z); env.sink = sk; const mir = new THREE.Mesh(new THREE.PlaneGeometry(.5, .6), new THREE.MeshStandardMaterial({ color: 0xdbe4ff, metalness: .8, roughness: .1 }));
        const atBack = Math.abs(sk.z + D / 2) < .6; onWall(mir, atBack ? { p: new THREE.Vector3(sk.x, 1.45, -D / 2 + .09), rotY: 0 } : { p: new THREE.Vector3(-W / 2 + .09, 1.45, sk.z), rotY: Math.PI / 2 }); env.mirror = mir; }
      for (const [w, rot, x, z] of [[W, 0, 0, -D / 2 + .065], [D, Math.PI / 2, -W / 2 + .065, 0]]) { const t = new THREE.Mesh(new THREE.PlaneGeometry(w, 1.2), new THREE.MeshStandardMaterial({ map: tileTex('#ffffff', '#ced4da', 8), roughness: .3 })); t.material.map.repeat.set(w / 1.2, 1); t.position.set(x, .6, z); t.rotation.y = rot; room.add(t); }
      decoys(1);
    },
    pool: ['groutMold', 'tubRing', 'tileCrack', 'mirrorCrack', 'puddle', 'drip', 'roach', 'mold'],
  },
  kitchen: {
    name: '🍳 주방', floor: () => checkTex(rnd(['#f8f9fa', '#fff4e6']), rnd(['#ced4da', '#e9c46a', '#a5d8ff'])), wall: () => rnd(PALETTE.wall),
    furnish() {
      const run = rr(2.4, Math.min(3.6, W - 1)); const cx = rr(-W / 2 + run / 2 + .1, W / 2 - run / 2 - .1); occupied.push({ x: cx, z: -D / 2 + .38, w: run, d: .7, h: 2.05 });
      const col = rnd([0xffffff, 0x495057, 0x96f2d7, 0xffc9c9]);
      box(run, .85, .65, col, cx, .425, -D / 2 + .38); box(run, .05, .68, 0xdee2e6, cx, .87, -D / 2 + .38);
      const sinkX = cx - run / 4, stoveX = cx + run / 4; env.sinkX = sinkX; env.stoveX = stoveX;
      box(.5, .04, .4, 0xadb5bd, sinkX, .89, -D / 2 + .38); box(.05, .25, .05, 0xced4da, sinkX, 1.0, -D / 2 + .15);
      box(.6, .04, .5, 0x212529, stoveX, .9, -D / 2 + .38); for (const [dx, dz] of [[-.15, -.1], [.15, -.1], [-.15, .12], [.15, .12]]) { const r = new THREE.Mesh(new THREE.TorusGeometry(.06, .015, 4, 12), flat(0x868e96)); r.rotation.x = Math.PI / 2; r.position.set(stoveX + dx, .93, -D / 2 + .38 + dz); room.add(r); }
      env.cabinets = []; for (let i = 0; i < Math.floor(run / .6); i++) { const c = box(.55, .5, .35, col, cx - run / 2 + .3 + i * .6, 1.75, -D / 2 + .2); env.cabinets.push(c); }
      const fr = spot(.7, .65, rnd(['back', 'left']), 1.9); if (fr) { env.fridge = box(.7, 1.8, .65, rnd([0xf8f9fa, 0xced4da, 0xb2f2bb]), fr.x, .9, fr.z); box(.05, .5, .05, 0x868e96, fr.x + .28, 1.1, fr.z + .34); }
      const tb = spot(1, .7, 'any', .8); if (tb) { box(1, .05, .7, 0xdeb887, tb.x, .72, tb.z); for (const [dx, dz] of [[-.45, -.3], [.45, -.3], [-.45, .3], [.45, .3]]) box(.05, .72, .05, 0x8d5a3b, tb.x + dx, .36, tb.z + dz); }
      decoys(2);
    },
    pool: ['grease', 'cabinetTilt', 'rust', 'puddle', 'roach', 'socket', 'drip', 'roach2'],
  },
  veranda: {
    name: '🪴 베란다', floor: () => concreteTex(rnd(['#ced4da', '#dee2e6', '#e9ecef'])), wall: () => rnd([0xf8f9fa, 0xe9ecef]),
    furnish() {
      env.windows = [];
      for (let i = 0; i < Math.max(2, Math.floor(W / 1.6)); i++) env.windows.push(windowOn({ p: new THREE.Vector3(-W / 2 + .9 + i * 1.6, 1.35, -D / 2 + .09), rotY: 0 }, 1.4, 1.3));
      const wm = spot(.7, .7, 'left', .95); if (wm) { box(.7, .9, .7, 0xf8f9fa, wm.x, .45, wm.z); const door = new THREE.Mesh(new THREE.CircleGeometry(.22, 16), flat(0x74c0fc)); door.position.set(wm.x + .36, .5, wm.z); door.rotation.y = Math.PI / 2; room.add(door); }
      const rk = spot(1.4, .5, 'any', 1.2); if (rk) { env.rack = rk; for (const s of [-1, 1]) box(.04, 1.1, .04, 0xadb5bd, rk.x + s * .7, .55, rk.z); box(1.44, .04, .04, 0xadb5bd, rk.x, 1.1, rk.z); for (let i = 0; i < 3; i++) box(.3, .4, .02, rnd([0xff8787, 0x74c0fc, 0xffd43b, 0xffffff]), rk.x - .45 + i * .45, .85, rk.z); }
      for (let i = 0; i < 3; i++) { const p = spot(.4, .4, rnd(['back', 'any']), .85); if (p) plant(p.x, p.z); }
      for (let x = -W / 2 + .2; x < W / 2; x += .4) box(.04, .7, .04, 0x868e96, x, .35, D / 2 - .1);
      env.rail = box(W, .05, .06, 0x868e96, 0, .72, D / 2 - .1);
    },
    pool: ['condensation', 'mold', 'windowCrack', 'rust', 'pigeon', 'puddle', 'crack'],
  },
  basement: {
    name: '🏚️ 반지하', floor: () => concreteTex(rnd(['#adb5bd', '#868e96'])), wall: () => rnd([0xdee2e6, 0xced4da, 0xe9ecef]),
    furnish() {
      windowOn({ p: new THREE.Vector3(rr(-W / 2 + 1, W / 2 - 1), 2.0, -D / 2 + .09), rotY: 0 }, 1.1, .45);
      const mt = spot(1.1, 1.9, rnd(['back', 'left']), .25); if (mt) box(1.1, .2, 1.9, 0xf1f3f5, mt.x, .1, mt.z);
      for (let i = 0; i < 3; i++) { const b = spot(.5, .4, 'any', .8); if (b) { box(.5, .4, .4, 0xc69c6d, b.x, .2, b.z); if (Math.random() < .5) box(.45, .35, .35, 0xd9a066, b.x, .58, b.z); } }
      const dh = spot(.35, .3, 'any', .65); if (dh) { box(.35, .6, .3, 0xffffff, dh.x, .3, dh.z); box(.2, .05, .02, 0x51cf66, dh.x, .5, dh.z + .16); }
      decoys(1);
    },
    pool: ['mold', 'mold', 'damp', 'puddle', 'crack', 'mouse', 'roach', 'socket'],
  },
};
let env = {};
function plant(x, z) { box(.28, .32, .28, rnd([0xd9480f, 0xffffff, 0x868e96]), x, .16, z); const l = new THREE.Mesh(new THREE.IcosahedronGeometry(.25, 0), flat(rnd([0x40c057, 0x2f9e44, 0x69db7c]))); l.position.set(x, .55, z); l.castShadow = true; room.add(l); }
function decoys(n) {   // normal outlets and picture frames, to tempt careless taps
  for (let i = 0; i < n; i++) outlet(wallSpot(.35, .5), false);
  if (Math.random() < .7) { const g = new THREE.Group(); box(.5, .4, .03, 0x6b4f3a, 0, 0, 0, g); box(.42, .32, .01, rnd([0x74c0fc, 0xffd43b, 0x8ce99a, 0xffa8a8]), 0, 0, .02, g); onWall(g, wallSpot(1.4, 1.8)); }
}

// ---------- defects ----------
const DEF = {
  mold: { name: '곰팡이', cost: 300, make: s => { const ws = Math.random() < .6 ? { p: new THREE.Vector3(-W / 2 + .09, rr(1.3, 1.85), -D / 2 + rr(.3, .7)), rotY: Math.PI / 2 } : wallSpot(1.1, 1.85); return [onWall(blot(0x2b8a3e, rr(.18, .28), .8 - s), ws), ws.p]; } },
  crack: { name: '벽 균열', cost: 400, make: s => { const ws = wallSpot(1.4, 1.9); const o = onWall(crackLines(rr(4, 7) | 0, 0x343a40, .9 - s), ws); return [o, ws.p.clone().add(new THREE.Vector3(0, -.4, 0))]; } },
  stain: { name: '벽지 얼룩', cost: 150, make: s => { const ws = wallSpot(.8, 1.9); return [onWall(blot(0xe9c46a, .2, .55 - s * .8), ws), ws.p]; } },
  socket: { name: '그을린 콘센트', cost: 250, make: () => { const ws = wallSpot(.35, .5); return [outlet(ws, true), ws.p]; } },
  roach: { name: '바퀴벌레', cost: 150, make: () => critter(0x3b2416, .07, 1) },
  roach2: { name: '바퀴벌레 2', cost: 150, make: () => critter(0x3b2416, .06, 1.3) },
  mouse: { name: '쥐', cost: 400, make: () => critter(0x868e96, .11, 1.8, true) },
  bulge: { name: '들뜬 장판', cost: 300, make: s => { const p = spot(.8, .6, 'any'); if (!p) return null; occupied.pop(); const o = box(.8, .07, .6, new THREE.MeshStandardMaterial({ color: 0xc69c6d, roughness: .7 }), p.x, .03 + (.03 - s * .04), p.z); o.rotation.z = .07 - s * .06; return [o, o.position]; } },
  windowCrack: { name: '깨진 창문', cost: 200, make: () => { const w = env.windows ? rnd(env.windows) : windowOn(wallSpot(1.3, 1.6), 1.1); const g = new THREE.Group(); for (let i = 0; i < 5; i++) { const l = new THREE.Mesh(new THREE.PlaneGeometry(.018, .4), new THREE.MeshBasicMaterial({ color: 0xffffff })); l.rotation.z = i * 1.25; g.add(l); } g.position.set(rr(-.25, .25), rr(-.15, .15), .05); w.add(g); w.updateMatrixWorld(); return [g, room.worldToLocal(w.localToWorld(g.position.clone()))]; } },
  puddle: { name: '물 고임', cost: 250, make: s => { const p = spot(.7, .6, 'any'); if (!p) return null; occupied.pop(); const o = floorDecal(blot(0x74c0fc, .3, .6 - s * .5), p.x, p.z); return [o, o.position]; } },
  drip: { name: '물 새는 수도', cost: 200, make: () => { const x = env.sinkX ?? env.sink?.x ?? 0, z = env.sinkX !== undefined ? -D / 2 + .2 : (env.sink?.z ?? 0); const o = new THREE.Mesh(new THREE.SphereGeometry(.03, 8, 6), new THREE.MeshStandardMaterial({ color: 0x4dabf7 })); o.position.set(x, 1.0, z + .05); o.userData.drip = 1.0; room.add(o); return [o, new THREE.Vector3(x, .95, z + .05)]; } },
  frame: { name: '기울어진 액자 (벽 휨)', cost: 200, make: s => { const g = new THREE.Group(); box(.5, .4, .03, 0x6b4f3a, 0, 0, 0, g); box(.42, .32, .01, 0xffd43b, 0, 0, .02, g); const ws = wallSpot(1.2, 1.6); onWall(g, ws); g.rotation.z = .2 - s * .15; return [g, ws.p]; } },
  groutMold: { name: '줄눈 곰팡이', cost: 250, make: s => { const p = spot(.6, .6, 'any'); if (!p) return null; occupied.pop(); const g = new THREE.Group(); for (let i = 0; i < 9; i++) { const d = new THREE.Mesh(new THREE.CircleGeometry(.025, 6), new THREE.MeshBasicMaterial({ color: 0x212529, transparent: true, opacity: .85 - s })); d.position.set(rr(-.25, .25), rr(-.25, .25), 0); g.add(d); } return [floorDecal(g, p.x, p.z), new THREE.Vector3(p.x, .02, p.z)]; } },
  tubRing: { name: '욕조 물때', cost: 200, make: s => { if (!env.tub) return null; const r = new THREE.Mesh(new THREE.TorusGeometry(.5, .03, 4, 20), new THREE.MeshBasicMaterial({ color: 0xd9480f, transparent: true, opacity: .8 - s })); r.rotation.x = Math.PI / 2; r.scale.set(1.35, .6, 1); r.position.set(env.tub.x, .52, env.tub.z); room.add(r); return [r, r.position]; } },
  tileCrack: { name: '깨진 타일', cost: 300, make: s => { const ws = wallSpot(.35, 1); const o = onWall(crackLines(4, 0x495057, .9 - s), ws); return [o, ws.p.clone().add(new THREE.Vector3(0, -.25, 0))]; } },
  mirrorCrack: { name: '금 간 거울', cost: 150, make: () => { if (!env.mirror) return null; const g = crackLines(3, 0xffffff, .95); g.position.set(.08, .15, .01); env.mirror.add(g); env.mirror.updateMatrixWorld(); return [g, room.worldToLocal(env.mirror.localToWorld(new THREE.Vector3(.08, -.1, 0)))]; } },
  grease: { name: '기름때', cost: 200, make: s => { const ws = { p: new THREE.Vector3(env.stoveX ?? 0, 1.2, -D / 2 + .09), rotY: 0 }; return [onWall(blot(0x8d6e40, .25, .7 - s), ws), ws.p]; } },
  cabinetTilt: { name: '처진 찬장 문', cost: 250, make: s => { if (!env.cabinets?.length) return null; const c = rnd(env.cabinets); c.rotation.z = .12 - s * .09; c.position.y -= .04; return [c, c.position]; } },
  rust: { name: '녹', cost: 200, make: s => { const host = env.fridge || env.rail; if (!host) return null; const b = blot(0xd9480f, .14, .85 - s); const p = env.fridge ? new THREE.Vector3(host.position.x + .2, .35, host.position.z + .33) : new THREE.Vector3(rr(-W / 3, W / 3), .72, D / 2 - .06); b.position.copy(p); room.add(b); return [b, p]; } },
  condensation: { name: '결로', cost: 250, make: s => { const w = env.windows ? rnd(env.windows) : null; if (!w) return null; const g = new THREE.Group(); for (let i = 0; i < 14; i++) { const d = new THREE.Mesh(new THREE.CircleGeometry(rr(.015, .035), 6), new THREE.MeshBasicMaterial({ color: 0x1971c2, transparent: true, opacity: .7 - s * .6 })); d.position.set(rr(-.5, .5), rr(-.55, -.2), .05); g.add(d); } w.add(g); w.updateMatrixWorld(); return [g, room.worldToLocal(w.localToWorld(new THREE.Vector3(0, -.38, .05)))]; } },
  pigeon: { name: '비둘기 둥지', cost: 300, make: () => { const at = env.rack ? new THREE.Vector3(env.rack.x + .5, 1.15, env.rack.z) : new THREE.Vector3(0, .75, D / 2 - .1); const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.SphereGeometry(.1, 8, 6), flat(0x868e96)); b.scale.set(1.3, 1, 1); g.add(b); const h = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 6), flat(0x5c7cfa)); h.position.set(.11, .07, 0); g.add(h); g.position.copy(at).add(new THREE.Vector3(0, .1, 0)); g.userData.pigeon = h; room.add(g); return [g, g.position]; } },
  damp: { name: '습기 얼룩', cost: 350, make: s => { const ws = { p: new THREE.Vector3(-W / 2 + .09, .55, rr(-D / 2 + .6, D / 2 - .6)), rotY: Math.PI / 2 }; return [onWall(blot(0x495057, .45, .45 - s * .5, 7), ws), ws.p]; } },
};
function critter(color, size, speed, tail) {
  const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.SphereGeometry(size, 8, 6), flat(color)); b.scale.set(1, .55, 1.6); g.add(b);
  if (tail) { const t = new THREE.Mesh(new THREE.BoxGeometry(.01, .01, size * 2.2), flat(0xffa8a8)); t.position.z = -size * 2.2; g.add(t); }
  let px = 0, pz = 0; for (let i = 0; i < 40; i++) { px = rr(-W / 2 + .4, W / 2 - .4); pz = rr(-D / 2 + .4, D / 2 - .4); if (free(px, pz, .3, .3)) break; }
  g.position.set(px, size * .55, pz); room.add(g);
  movers.push({ g, speed, dir: Math.random() * Math.PI * 2, turnT: 0 });
  return [g, g.position];
}

function buildRoom(typeKey, level) {
  scene.remove(room); room = new THREE.Group(); scene.add(room);
  occupied = []; defects = []; hits = []; movers = []; env = {};
  W = rr(4.6, 6.8); D = rr(3.8, 5.6);
  const T = ROOM_TYPES[typeKey];
  const floorTex = T.floor(); const wallCol = T.wall();
  const floor = new THREE.Mesh(new THREE.BoxGeometry(W, .12, D), new THREE.MeshStandardMaterial({ map: floorTex, roughness: .8 })); floor.position.y = -.06; floor.receiveShadow = true; room.add(floor);
  const wallM = flat(wallCol);
  box(W + .12, WALL_H, .12, wallM, 0, WALL_H / 2, -D / 2);
  box(.12, WALL_H, D, wallM, -W / 2, WALL_H / 2, 0);
  box(W, .1, .04, 0xffffff, 0, .05, -D / 2 + .07); box(.04, .1, D, 0xffffff, -W / 2 + .07, .05, 0);   // skirting
  T.furnish();
  placeCamera(); camera.position.copy(camPos); camera.lookAt(camLook); camera.updateMatrixWorld();
  const solids = []; room.traverse(o => { if (o.isMesh && !o.material.transparent && o.geometry.type === 'BoxGeometry') solids.push(o); });
  const rc = new THREE.Raycaster();
  const blocked = (obj, at) => { const p = at.clone(); room.updateMatrixWorld(true); room.localToWorld(p); const dir = p.clone().sub(camera.position), dist = dir.length(); rc.set(camera.position, dir.normalize());
    return rc.intersectObjects(solids, false).some(x => x.distance < dist - .12 && x.object !== obj && !obj?.getObjectById?.(x.object.id)); };
  const n = Math.min(T.pool.length, 4 + Math.floor(level / 2));
  const subtle = Math.min(.22, level * .03);
  let made = 0;
  for (const k of shuffle(T.pool.slice())) {
    if (made >= n) break;
    const def = DEF[k]; let res = null;
    for (let tries = 0; tries < 4; tries++) {   // re-roll any defect the camera can't actually see
      res = def.make(subtle); if (!res) break;
      if (['roach', 'roach2', 'mouse'].includes(k) || !blocked(res[0], res[1])) break;
      res[0].parent?.remove(res[0]); const mi = movers.findIndex(m => m.g === res[0]); if (mi >= 0) movers.splice(mi, 1); res = null;
    }
    if (!res) continue;
    const [obj, at] = res;
    const hit = new THREE.Mesh(new THREE.SphereGeometry(Math.max(.26, .38 - level * .012), 8, 6), new THREE.MeshBasicMaterial({ visible: false }));
    hit.position.copy(at); room.add(hit);
    const rec = { key: k, name: def.name, cost: def.cost, obj, at, hit, found: false }; hit.userData.def = rec; defects.push(rec); hits.push(hit); made++;
  }
  room.rotation.y = rr(-.12, .12);   // a little tilt so rooms never sit identically
  room.updateMatrixWorld(true);
}

// ---------- state ----------
const LIVES = 3;
let state = 'ready', score = 0, lives = LIVES, roomNo = 0, timeLeft = 15, timeMax = 15, overAt = 0, bag = [], typeKey = 'oneroom';
let best = 0; try { best = +localStorage.getItem('inspect-best') || 0; } catch {}
const $score = $('score'), $lives = $('lives'), $center = $('center'), $hint = $('hint');
const showScreen = html => { $center.innerHTML = html; $center.style.display = ''; };
const showIntro = () => showScreen(Arcade.titleScreen({ emoji: '🔍', title: '임장 매의 눈', how: [
  ['🏠', '원룸·욕실·주방·베란다·반지하… <b>매번 다른 집</b>'],
  ['🔍', '숨은 <b>하자</b>를 찾아 탭! 멀쩡한 콘센트·액자는 함정'],
  ['💰', '찾은 하자만큼 <b>집값을 깎아요</b>'],
  ['⏱️', '시간 빠듯! 헛클릭 -3초, 60% 못 찾으면 계약 후회 (-1❤️)'],
] }));
function updateHud() {
  $score.innerHTML = `${score.toLocaleString('ko-KR')}<small>만원</small>`;
  $lives.textContent = '❤️'.repeat(lives) + '🤍'.repeat(LIVES - lives);
  $('room').textContent = `${roomNo + 1}번째 · ${ROOM_TYPES[typeKey].name}`;
  $('found').textContent = `🔍 ${defects.filter(d => d.found).length}/${defects.length}`;
}
function clearMarks() { for (const m of marks) m.el.remove(); marks = []; }
function nextRoom() {
  clearMarks();
  if (!bag.length) bag = shuffle(Object.keys(ROOM_TYPES));
  typeKey = bag.pop();
  buildRoom(typeKey, roomNo);
  timeMax = Math.max(8, 4 + defects.length * 1.9 - roomNo * .35); timeLeft = timeMax;
  state = 'playing'; updateHud(); placeCamera();
  Arcade.toast(`🔑 ${ROOM_TYPES[typeKey].name} · 하자 ${defects.length}개!`, '#2b2438');
}
function reset() { score = 0; lives = LIVES; roomNo = 0; bag = []; typeKey = 'oneroom'; buildRoom('oneroom', 0); updateHud(); placeCamera(); }
function start() {
  state = 'count'; $center.style.display = 'none'; $hint.style.display = '';
  Arcade.countdown({ final: '임장!', onTick: n => n ? Arcade.sfx.tick() : Arcade.sfx.go(), onDone: () => nextRoom() });
}
const tmpV = new THREE.Vector3();
function screenOf(v) { tmpV.copy(v); room.localToWorld(tmpV); tmpV.project(camera); return [(tmpV.x * .5 + .5) * innerWidth, (-tmpV.y * .5 + .5) * innerHeight]; }
function addMark(rec, missed) {
  const el = document.createElement('div'); el.className = 'mark' + (missed ? ' missed' : '');
  const lb = document.createElement('div'); lb.className = 'lbl' + (missed ? ' missed' : ''); lb.textContent = missed ? `놓침: ${rec.name}` : `${rec.name} -${rec.cost}만`;
  document.body.append(el, lb); marks.push({ el, rec }, { el: lb, rec });
}
function endRoom() {
  state = 'summary';
  const found = defects.filter(d => d.found), missed = defects.filter(d => !d.found);
  missed.forEach(d => addMark(d, true));
  const saved = found.reduce((a, d) => a + d.cost, 0);
  const ok = found.length >= Math.ceil(defects.length * .6);
  if (!ok) { lives--; Arcade.sfx.fail(); Arcade.shake(.2); Arcade.toast(`😭 계약 후회… 놓친 하자 ${missed.length}개`, '#e03131'); }
  else if (!missed.length) { const bonus = 300 + Math.round(timeLeft * 40); score += bonus; Arcade.sfx.fanfare(); Arcade.confetti({ y: innerHeight * .35, count: 80, emoji: ['🔍', '💰', '🏠'] }); Arcade.toast(`🦅 완벽 임장! 남은 시간 보너스 +${bonus}만`, '#2b8a3e'); }
  else { Arcade.sfx.coin(); Arcade.toast(`🤝 ${saved.toLocaleString()}만원 깎았어요 (놓침 ${missed.length})`, '#1971c2'); }
  updateHud();
  setTimeout(() => { if (lives <= 0) finish(); else { roomNo++; nextRoom(); } }, 2200);
}
function finish() {
  state = 'over'; overAt = performance.now(); clearMarks();
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('inspect-best', best); } catch {} }
  isBest && score > 0 ? Arcade.sfx.fanfare() : Arcade.sfx.fail();
  showScreen(Arcade.resultScreen({ emoji: '🔍', label: '깎은 집값', score, unit: '만원', msg: score >= 8000 ? '공인중개사가 당신을 두려워합니다' : score >= 3000 ? '임장 고수 인정' : '다음엔 손전등을 챙기세요',
    rows: [['임장한 집', `${roomNo}곳`]], isBest: isBest && score > 0, best }));
  Arcade.gameOver(score);
}
function tapStart() {
  if (state === 'ready') start();
  else if (state === 'over' && performance.now() - overAt > 1200 && !Arcade.inRun()) { reset(); start(); }
}

// ---------- input ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
addEventListener('pointerdown', e => {
  if (e.target.closest?.('.arcade-btn')) return;
  if (state !== 'playing') { tapStart(); return; }
  $hint.style.display = 'none';
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(hits.filter(h => !h.userData.def.found), false)[0];
  if (hit) {
    const rec = hit.object.userData.def; rec.found = true;
    score += rec.cost; addMark(rec, false); updateHud();
    Arcade.sfx.perfect(defects.filter(d => d.found).length); Arcade.vibrate(25);
    if (defects.every(d => d.found)) endRoom();
  } else {
    timeLeft = Math.max(0, timeLeft - 3);
    const x = document.createElement('div'); x.className = 'xmark'; x.textContent = '✕ -3초'; x.style.left = e.clientX + 'px'; x.style.top = e.clientY + 'px'; document.body.appendChild(x); setTimeout(() => x.remove(), 650);
    Arcade.sfx.miss(); Arcade.vibrate(40); Arcade.shake(.05);
  }
});
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tapStart(); } });

// dollhouse camera from the open front-right corner, fitted to the room size
function placeCamera() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const portrait = camera.aspect < 1;
  const span = Math.max(W, D) * (portrait ? 1.35 : 1) + 1.2;
  const half = THREE.MathUtils.degToRad(camera.fov / 2);
  const dist = Math.max(span / 2 / Math.tan(half) / Math.min(1, camera.aspect * 1.25), 8);
  const dir = new THREE.Vector3(.75, .95, 1).normalize();
  camPos.copy(dir.multiplyScalar(dist)).add(new THREE.Vector3(0, .4, 0));
  camLook.set(-.15, 1.4, -.2);   // aim a bit high so the room sits below the HUD
}
placeCamera();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); placeCamera(); });

// ---------- loop ----------
let last = performance.now();
reset(); showIntro();
window.__insp = { occluded() {   // test hook: defects whose spot is blocked from the camera by solid furniture/walls
    const out = [], rc = new THREE.Raycaster(), solids = []; room.traverse(o => { if (o.isMesh && o.material && !o.material.transparent && o.material.visible !== false && o.geometry.type === 'BoxGeometry') solids.push(o); });
    for (const d of defects) { const p = (['roach', 'roach2', 'mouse'].includes(d.key) ? d.obj.position : d.at).clone(); room.localToWorld(p); const dir = p.clone().sub(camera.position); const dist = dir.length(); rc.set(camera.position, dir.normalize());
      const h = rc.intersectObjects(solids, false).find(x => x.distance < dist - .12 && !d.obj?.getObjectById?.(x.object.id) && x.object !== d.obj); if (h) out.push(d.name); }
    return out; }, get state() { return state; }, get defects() { return defects; }, get score() { return score; }, get lives() { return lives; }, screenOf, get timeLeft() { return timeLeft; },
  build(k) { typeKey = k; buildRoom(k, 8); placeCamera(); updateHud(); } };

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (state === 'playing') { timeLeft -= dt; if (timeLeft <= 0) { timeLeft = 0; endRoom(); } }
  $('tfill').style.transform = `scaleX(${timeLeft / timeMax})`;
  $('timer').classList.toggle('low', state === 'playing' && timeLeft < 4);
  for (const m of movers) {   // critters scurry around, bouncing off walls and furniture
    m.turnT -= dt; if (m.turnT <= 0) { m.dir += rr(-1.8, 1.8); m.turnT = rr(.4, 1.4); }
    const nx = m.g.position.x + Math.sin(m.dir) * m.speed * dt, nz = m.g.position.z + Math.cos(m.dir) * m.speed * dt;
    if (Math.abs(nx) > W / 2 - .25 || Math.abs(nz) > D / 2 - .25 || occupied.some(o => Math.abs(o.x - nx) < o.w / 2 && Math.abs(o.z - nz) < o.d / 2)) m.dir += Math.PI * rr(.6, 1.4);
    else { m.g.position.x = nx; m.g.position.z = nz; }
    m.g.rotation.y = m.dir;
  }
  for (const d of defects) {
    if (d.obj?.userData.drip) { const k = (t * 1.3) % 1; d.obj.position.y = d.obj.userData.drip - k * k * .2; d.obj.scale.setScalar(k < .9 ? 1 : 0); }
    if (d.obj?.userData.pigeon) d.obj.userData.pigeon.position.y = .07 + Math.abs(Math.sin(t * 6)) * .04;
    if (d.obj && movers.some(m => m.g === d.obj)) d.hit.position.copy(d.obj.position);
  }
  for (const m of marks) { const [x, y] = screenOf(movers.some(v => v.g === m.rec.obj) ? m.rec.obj.position : m.rec.at); m.el.style.left = x + 'px'; m.el.style.top = y + 'px'; }
  camera.position.copy(camPos); Arcade.applyShake(camera, dt); camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
