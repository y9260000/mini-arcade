<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>전리품 가방</title>
<script src="common.js?v=16"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#211c22;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #ffde92;outline-offset:3px}.hud{gap:9px}.hud-score{font-size:64px}.hud-score small{font-size:25px}.pill{font-size:12px;padding:6px 12px}#timer{width:min(280px,64vw);height:12px;border-radius:999px;background:#0005;overflow:hidden;box-shadow:inset 0 2px 4px #0005,0 0 0 3px #fff}#timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b6b,#ffd43b 35%,#51cf66 70%);transform-origin:left;border-radius:999px}#timer.low{animation:low .4s ease-in-out infinite}@keyframes low{50%{box-shadow:0 0 0 3px #ff6b6b,0 0 25px #f3383877}}#playfield{position:fixed;inset:0;z-index:2;pointer-events:none}#board{position:absolute;display:grid;pointer-events:auto;touch-action:none}#board button{background:transparent;border:0;padding:0;min-width:0;touch-action:none}#board button:disabled{visibility:hidden}#tray{position:absolute;display:grid;pointer-events:auto;gap:5px}#tray button{position:relative;background:transparent;border:0;padding:0;touch-action:none;border-radius:12px}#tray button.placed{pointer-events:none}#tray button.placed:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:28px;color:#c8e6ac66}#tray button small{position:absolute;bottom:-1px;left:0;right:0;text-align:center;color:#f3e4cf;font-size:10px;text-shadow:0 2px 4px #000}#tray button.placed small{opacity:.3}#tray-label{position:absolute;text-align:center;color:#d9bea0;font-size:11px;font-weight:700;letter-spacing:1px}#hint{position:fixed;left:0;right:0;text-align:center;z-index:3;pointer-events:none;font-size:12px;font-weight:700;color:#fff;text-shadow:0 2px 5px #000;padding:0 16px}#controls{position:fixed;bottom:max(64px,calc(env(safe-area-inset-bottom) + 56px));left:50%;transform:translateX(-50%);width:min(410px,calc(100% - 32px));display:flex;gap:12px;z-index:3}#controls button{flex:1;border:0;border-radius:18px;padding:12px 4px;color:#fff;font-family:'Jua',sans-serif;font-size:21px;background:#be8847;box-shadow:0 5px #76512d,0 10px 20px #0004}#controls button:last-child{background:#77677e;box-shadow:0 5px #45374b,0 10px 20px #0004}#controls button:active{transform:translateY(4px);box-shadow:0 1px #45374b}#controls button:disabled{filter:saturate(.3);opacity:.5;cursor:default}body:has(.screen:not([style*="none"])) :is(#playfield,#controls,#hint){visibility:hidden}#center .t-title{font-size:clamp(40px,10vw,60px)}#center .t-cta{pointer-events:auto;border:0;cursor:pointer}#center{padding-top:max(7vh,45px)}@media(max-height:650px){.hud-score{font-size:44px}.hud-score small{font-size:20px}.hud{gap:6px;top:8px}#timer{height:8px}#controls{bottom:53px}#controls button{padding:9px 3px;font-size:18px}#center{padding-top:26px}#center .t-emoji{font-size:42px}#center .t-title{font-size:36px;margin:5px 0 12px}#center .t-how{padding:8px 14px}#center .t-how li{font-size:13px;margin:5px 0}#center .t-cta{bottom:70px;font-size:23px}}
</style>
</head>
<body>
<div class="hud"><div class="hud-score" id="score">0<small>/ 0개</small></div><div class="hud-row"><span class="pill dark" id="time">⏳ 60초</span><span class="pill" id="progress">모든 장비를 딱 맞게!</span></div><div id="timer"><i id="tfill"></i></div></div>
<div id="playfield"><div id="board" role="group" aria-label="장비를 모두 넣으면 정확히 채워지는 인벤토리"></div><div id="tray-label">⚔️ 이번에 챙길 전리품 · 전부 담으세요</div><div id="tray" role="group" aria-label="처음부터 주어진 전리품"></div></div>
<div id="hint" role="status" aria-live="polite">장비 선택 → 빈칸 터치 · 드래그도 가능</div>
<div id="controls" class="hud-ctl"><button id="rotate" disabled>↻ 회전 <small>R</small></button><button id="remove" disabled>↓ 다시 꺼내기</button></div>
<div class="screen" id="center"></div>
<script type="module" src="inventory.js?v=3"></script>
</body></html>
