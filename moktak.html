<style>

  @keyframes feverPulse{to{filter:brightness(1.35)}}

    font-family:"Jua",sans-serif;font-size:clamp(26px,7.2vw,44px);line-height:1.25;color:rgba(255,255,255,.42);
    text-shadow:0 3px 10px rgba(0,0,0,.75);white-space:nowrap;overflow:hidden;
    background:linear-gradient(90deg,transparent,rgba(30,12,4,.5) 18%,rgba(30,12,4,.5) 82%,transparent)}
  #sutra:empty{display:none}
  #sutra span{transition:color .15s,transform .15s;display:inline-block;margin:0 .18em}
  #sutra span.done{color:#fff}
  #sutra span.now{color:#ffe066;transform:scale(1.3);text-shadow:0 0 18px rgba(255,200,40,.95),0 3px 6px rgba(0,0,0,.7)}
  body:has(.screen:not([style*="none"])) #sutra{visibility:hidden}
  .word{position:fixed;left:0;top:0;pointer-events:none;z-index:4;font-family:"Jua",sans-serif;font-size:26px;color:#ffe066;white-space:nowrap;
    text-shadow:0 0 12px rgba(255,190,40,.9),0 3px 0 rgba(90,40,0,.6);animation:word 1.1s ease-out forwards}
  .word.roll{font-size:20px;color:#fff;animation-duration:.6s}
  @keyframes word{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}
  #heavenflash{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(circle at 50% 30%,#fffef5 0%,rgba(255,244,200,.85) 45%,rgba(255,230,150,.4) 100%);transition:opacity 1.2s}
  #heavenflash.on{opacity:1}
  .glare{position:fixed;left:0;top:0;font-size:34px;transform:translate(-50%,-100%);pointer-events:none;z-index:2;opacity:0;transition:opacity .15s}
</style>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const ROLL_STEP = .075, FEVER_AT = 16;
const PERFECT = .045, GOOD = .1, MISS_AFTER = .12, BONNOE_MAX = 108;
const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, flatShading: true, ...extra });

// ---------- three ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });

const fill = new THREE.DirectionalLight(0xfff0d0, .9); fill.position.set(-4, 8, 8); scene.add(fill);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); sizeLane(); });

// ---------- temple ----------
{
  const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d');
  for (let i = 0; i < 8; i++) { g.fillStyle = ['#8a5a3b', '#7d5034', '#94623f', '#83553a'][i % 4]; g.fillRect(0, i * 32, 64, 31); g.fillStyle = '#5c3a26'; g.fillRect(0, i * 32 + 31, 64, 1); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 4); t.colorSpace = THREE.SRGBColorSpace;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.MeshStandardMaterial({ map: t, roughness: .9 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const red = flat(0xa61e1e), gold = flat(0xf2b134, { metalness: .5, roughness: .35, emissive: 0x3a2400 });
  for (const x of [-9, -5, 5, 9]) for (const z of [-8, 2]) { const p = new THREE.Mesh(new THREE.CylinderGeometry(.45, .5, 10, 8), red); p.position.set(x, 5, z); p.castShadow = true; scene.add(p); }
  const wall = new THREE.Mesh(new THREE.BoxGeometry(40, 14, .5), flat(0x5a2a1d)); wall.position.set(0, 7, -14); scene.add(wall);
  // golden statue (low-poly, seated silhouette)
  const s = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 3, 1.2, 8), flat(0x8c2f1c)); base.position.y = .6;
  const lotus = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.2, .7, 10), gold); lotus.position.y = 1.55;
  const body = new THREE.Mesh(new THREE.ConeGeometry(2.3, 3.8, 8), gold); body.position.y = 3.6;
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(.9, 1), gold); head.position.y = 5.9;
  const top = new THREE.Mesh(new THREE.IcosahedronGeometry(.4, 0), gold); top.position.y = 6.85;
  const halo = new THREE.Mesh(new THREE.TorusGeometry(2.1, .12, 4, 24), gold); halo.position.set(0, 5.6, -.6);
  s.add(base, lotus, body, head, top, halo); s.position.set(0, 0, -11); s.scale.setScalar(1.25); scene.add(s);
  // lanterns
  for (const x of [-7, 7]) {
    const l = new THREE.Mesh(new THREE.CylinderGeometry(.6, .6, 1.3, 8), new THREE.MeshStandardMaterial({ color: 0xff6b3d, emissive: 0xff5a1f, emissiveIntensity: .8, flatShading: true }));
    l.position.set(x, 7.5, -4); scene.add(l);
    const pl = new THREE.PointLight(0xff8a3d, 15, 12); pl.position.copy(l.position); scene.add(pl);
  }
  // incense smoke columns
  for (const x of [-2.6, 2.6]) {
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(.35, .28, .5, 8), gold); pot.position.set(x, .25, -7.5); scene.add(pot);
  }
}

// ---------- monks ----------
const skin = flat(0xf1c9a0), wood = flat(0x9c4f1d), woodDark = flat(0x5c2d10);
function makeMonk({ robe = 0x868e96, sash = 0xd9480f, size = 1 } = {}) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(1.15, 2.3, 7), flat(robe)); body.position.y = 1.15; body.castShadow = true;
  const sashM = new THREE.Mesh(new THREE.BoxGeometry(.32, 2.1, .2), flat(sash)); sashM.position.set(.1, 1.4, .5); sashM.rotation.set(.38, 0, .55);
  const lap = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.35, .4, 7), flat(robe)); lap.position.y = .2;
  const head = new THREE.Group(); head.position.y = 2.65;
  const skull = new THREE.Mesh(new THREE.IcosahedronGeometry(.56, 1), skin); skull.castShadow = true;
  const eyeL = new THREE.Mesh(new THREE.BoxGeometry(.17, .035, .05), flat(0x222222)); eyeL.position.set(-.19, .02, .52);
  const eyeR = eyeL.clone(); eyeR.position.x = .19;
  const earL = new THREE.Mesh(new THREE.IcosahedronGeometry(.14, 0), skin); earL.position.set(-.56, 0, 0); const earR = earL.clone(); earR.position.x = .56;
  const brow = new THREE.Mesh(new THREE.BoxGeometry(.6, .04, .05), flat(0x222222)); brow.position.set(0, .2, .52); brow.visible = false;
  head.add(skull, eyeL, eyeR, earL, earR, brow);
  // stick arm (pivot at the right shoulder)
  const arm = new THREE.Group(); arm.position.set(.55, 1.95, .25);
  const sleeve = new THREE.Mesh(new THREE.BoxGeometry(.32, .32, 1), flat(robe)); sleeve.position.z = .45;
  const hand = new THREE.Mesh(new THREE.IcosahedronGeometry(.17, 0), skin); hand.position.z = .98;
  const stick = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .9, 5), woodDark); stick.rotation.x = Math.PI / 2; stick.position.set(0, -.05, 1.4);
  const knob = new THREE.Mesh(new THREE.IcosahedronGeometry(.11, 0), woodDark); knob.position.set(0, -.05, 1.85);
  arm.add(sleeve, hand, stick, knob); arm.rotation.set(-.2, -.3, 0);
  // moktak (wooden fish) on the floor in front
  const mok = new THREE.Group(); mok.position.set(.45, .38, 1.55);
  const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(.42, 1), wood); shell.scale.set(1.25, .85, 1); shell.castShadow = true;
  const slit = new THREE.Mesh(new THREE.BoxGeometry(.6, .05, .1), woodDark); slit.position.set(0, -.05, .4);
  const handle = new THREE.Mesh(new THREE.TorusGeometry(.14, .05, 4, 8), wood); handle.position.set(-.5, .1, 0); handle.rotation.y = Math.PI / 2;
  mok.add(shell, slit, handle);
  const cushion = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, .15, 8), flat(0x7b1e3a)); cushion.position.y = .02;
  g.add(cushion, lap, body, sashM, head, arm, mok);
  const halo = new THREE.Mesh(new THREE.TorusGeometry(.5, .06, 4, 16), new THREE.MeshBasicMaterial({ color: 0xffd43b }));
  halo.rotation.x = Math.PI / 2; halo.position.y = 3.45; halo.visible = false; g.add(halo);
  g.scale.setScalar(size);
  return { group: g, arm, mok, head, halo, brow, eyes: [eyeL, eyeR], hitT: 9, glareT: 0, phase: Math.random() * 6 };
}
const monks = [];
const ring = [[-6, -2.6], [-3.2, -4.4], [3.2, -4.4], [6, -2.6]];
for (const [x, z] of ring) {
  const m = makeMonk(); m.group.position.set(x, 0, z);
  m.group.rotation.y = Math.atan2(0 - x, 4 - z); scene.add(m.group); monks.push(m);
}
const abbot = makeMonk({ robe: 0x7a5c3e, sash: 0xc92a2a, size: 1.25 }); // 주지스님
abbot.group.position.set(0, 0, -5.4); scene.add(abbot.group); monks.push(abbot);
const me = makeMonk({ robe: 0x9aa3ad, sash: 0xf08c00 }); me.group.position.set(0, 0, 3.2); me.group.rotation.y = Math.PI; scene.add(me.group);
const BASE_BG = new THREE.Color(0x2a1712), FEVER_BG = new THREE.Color(0x5a2a0a);
const petals = new THREE.Group(); petals.visible = false; petals.userData.fade = 0; scene.add(petals);
{
  const geo = new THREE.CircleGeometry(.18, 5), mats = [0xffa8c5, 0xffd43b, 0xffffff].map(c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
  for (let i = 0; i < 70; i++) { const m = new THREE.Mesh(geo, mats[i % 3]); m.position.set((Math.random() - .5) * 18, Math.random() * 10, -8 + Math.random() * 13); m.userData = { v: .6 + Math.random() * 1.2, ph: Math.random() * 6 }; petals.add(m); }
}
// ---------- 번뇌 = hair: misses grow an afro on my bald head, perfects shave it ----------
const hair = new THREE.Group(); me.head.add(hair);
{
  const hm = flat(0x2b1d14), blob = new THREE.IcosahedronGeometry(.2, 0);
  for (let i = 0; i < 26; i++) { // blobs on the upper hemisphere, just inside the skull → they push out as the group scales
    const u = Math.random(), v = Math.random() * .55, th = u * Math.PI * 2, ph = Math.acos(1 - v * 1.2);
    const b = new THREE.Mesh(blob, hm); b.position.set(Math.sin(ph) * Math.cos(th) * .5, Math.cos(ph) * .5 + .02, Math.sin(ph) * Math.sin(th) * .5 - .04);
    b.scale.setScalar(.8 + Math.random() * .6); hair.add(b);
  }
  for (let i = 0; i < 5; i++) { // a few silly strands
    const st = new THREE.Mesh(new THREE.BoxGeometry(.04, .5, .04), hm); st.position.set((Math.random() - .5) * .4, .62, (Math.random() - .5) * .3 - .05);
    st.rotation.set((Math.random() - .5) * .8, 0, (Math.random() - .5) * .8); hair.add(st);
  }
}
let hairS = 0, hairStage = 0;
const HAIR_LINES = [[24, '😳 머리카락이 자라기 시작했다…'], [54, '주지스님: "머리 좀 깎고 와라"'], [84, '🦁 거의 속세 사람 됨']];
function updateHair(dt) {
  const k = bonnoe / BONNOE_MAX, target = k <= 0 ? 0 : 1.02 + k * 1.15;
  hairS += (target - hairS) * Math.min(1, dt * 5);
  hair.visible = hairS > .9; hair.scale.set(hairS, hairS * (1 + k * .25), hairS);
  const stage = HAIR_LINES.filter(([b]) => bonnoe >= b).length;
  if (stage > hairStage && state === 'play') { Arcade.toast(HAIR_LINES[stage - 1][1], '#5c3a26'); Arcade.sfx.boing(); }
  hairStage = stage;
}

const glares = monks.map(() => { const d = document.createElement('div'); d.className = 'glare'; d.textContent = '😒'; document.body.appendChild(d); return d; });

// ---------- audio: pre-rendered wood/bell samples + temple-hall reverb ----------
let ac, t0 = 0, master, wet, ambience;
let SR = 44100; const bank = {};
// damped-sine "modal" synthesis: hollow wood has a few inharmonic resonances + a short noise click
function renderWood(f0, { body = 1, dull = 0 } = {}) {
  const len = Math.floor(SR * .45), b = ac.createBuffer(1, len, SR), d = b.getChannelData(0);
  const modes = dull
    ? [[1, 1, .045], [2.3, .25, .02]]
    : [[1, 1, .085], [1.52, .28, .05], [2.68, .42, .032], [4.13, .16, .016], [6.2, .06, .009]];
  let lp = 0;
  for (let n = 0; n < len; n++) {
    const t = n / SR, bend = 1 + .06 * Math.exp(-t / .006); // tiny pitch drop at the strike
    let v = 0;
    for (const [r, a, tau] of modes) v += a * Math.sin(2 * Math.PI * f0 * r * bend * t + r) * Math.exp(-t / tau);
    v += body * .35 * Math.sin(2 * Math.PI * f0 * .42 * t) * Math.exp(-t / .03);     // cavity "thock"
    const noise = (Math.random() * 2 - 1) * Math.exp(-t / .0018); lp += (noise - lp) * .35; v += lp * .9; // stick click
    d[n] = v * Math.min(1, t / .0006) * .5;
  }
  return b;
}
function renderBell(f0, dur, partials) {
  const len = Math.floor(SR * dur), b = ac.createBuffer(1, len, SR), d = b.getChannelData(0);
  for (let n = 0; n < len; n++) {
    const t = n / SR; let v = 0;
    for (const [r, a, tau, beat] of partials) v += a * Math.sin(2 * Math.PI * f0 * r * t) * (1 - .25 * Math.cos(2 * Math.PI * beat * t)) * Math.exp(-t / tau);
    d[n] = v * Math.min(1, t / .004) * .35;
  }
  return b;
}
function hallImpulse(sec = 2.6) {
  const len = Math.floor(SR * sec), b = ac.createBuffer(2, len, SR);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let n = 0; n < len; n++) { const t = n / len; d[n] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.2) * (n < SR * .012 ? .3 : 1); } }
  return b;
}
function ensureAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)(); SR = ac.sampleRate;
      if (window.MOKTAK_WAV_B64) { // real recorded moktak strike (sounds/moktak.wav), embedded so it also works from file://
        const bin = atob(window.MOKTAK_WAV_B64), u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        ac.decodeAudioData(u8.buffer).then(b => { bank.sample = b; }).catch(e => console.warn('moktak sample decode failed', e));
      }
      master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
      const verb = ac.createConvolver(); verb.buffer = hallImpulse();
      wet = ac.createGain(); wet.gain.value = .32; wet.connect(verb).connect(master);
      // per-monk wood voices (slightly different sizes) + the player's own moktak
      bank.monks = [470, 505, 540, 580, 430].map(f => renderWood(f));
      bank.me = renderWood(615, { body: 1.2 });
      bank.thud = renderWood(240, { dull: 1, body: .6 });
      bank.bowl = renderBell(392, 4, [[1, 1, 2.6, 1.3], [2.71, .45, 1.6, 2.1], [5.15, .2, .9, 0], [8.4, .08, .5, 0]]);
      bank.bell = renderBell(98, 7, [[1, 1, 5, .7], [2.0, .6, 3.5, .9], [2.92, .35, 2.4, 0], [4.2, .2, 1.4, 0], [5.4, .1, 1, 0]]);
      // faint room tone so silence feels like a hall, not a void
      const nb = ac.createBuffer(1, SR * 3, SR), nd = nb.getChannelData(0); let br = 0;
      for (let n = 0; n < nd.length; n++) { br = (br + (Math.random() * 2 - 1) * .02) * .995; nd[n] = br; }
      ambience = ac.createBufferSource(); ambience.buffer = nb; ambience.loop = true;
      const ag = ac.createGain(); ag.gain.value = .25; ambience.connect(ag).connect(master); ambience.start();
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { console.warn('audio init failed', e); }
}
function play(buf, when, vol = 1, rate = 1, wetAmt = 1, dur = 0) {
  if (!ac || !buf) return;
  const src = ac.createBufferSource(), g = ac.createGain(), t = Math.max(when, ac.currentTime);
  src.buffer = buf; src.playbackRate.value = rate; g.gain.value = vol;
  src.connect(g); g.connect(master);
  const w = ac.createGain(); w.gain.value = wetAmt; g.connect(w).connect(wet);
  src.start(t);
  if (dur) { g.gain.setValueAtTime(vol, t + dur * .5); g.gain.linearRampToValueAtTime(0, t + dur); src.stop(t + dur + .02); } // short strikes for rolls
}
const MONK_RATES = [.92, .96, 1.0, 1.04, .86]; // index 4 = 주지스님 (bigger, lower moktak)
// the ensemble: every monk strikes, slightly humanised in time / loudness / pitch
function ensembleTok(when) {
  if (bank.sample) return MONK_RATES.forEach((r, i) => play(bank.sample, when + (Math.random() - .5) * .012 + (i === 4 ? 0 : .004), (i === 4 ? .42 : .22) * (.85 + Math.random() * .3), r * (.99 + Math.random() * .02), .8));
  bank.monks.forEach((b, i) => play(b, when + (Math.random() - .5) * .012 + (i === 4 ? 0 : .004), (i === 4 ? .5 : .3) * (.85 + Math.random() * .3), .98 + Math.random() * .04, .9));
}
const myTok = (short) => bank.sample
  ? play(bank.sample, ac ? ac.currentTime : 0, short ? .7 : .95, 1.07 + Math.random() * .03, .45, short ? .12 : 0)
  : play(bank.me, ac ? ac.currentTime : 0, .85, .97 + Math.random() * .06, .7);
const bowl = (rate = 1, vol = .5) => play(bank.bowl, ac ? ac.currentTime : 0, vol, rate, 1.2);
const bigBell = () => play(bank.bell, ac ? ac.currentTime : 0, .8, 1, 1.4);
function rollTok(when) { if (bank.sample) { play(bank.sample, when + (Math.random() - .5) * .006, .34, .86, .7, .11); play(bank.sample, when + .003, .18, .97 + Math.random() * .06, .7, .1); return; } play(bank.monks[4], when + (Math.random() - .5) * .006, .38, 1, .8); play(bank.monks[(Math.random() * 4) | 0], when + .003, .2, 1.02, .8); }
const thud = () => play(bank.thud, ac ? ac.currentTime : 0, .6, .9 + Math.random() * .1, .4);
const now = () => ac ? ac.currentTime - t0 : 0;

// ---------- chart ----------
const PATTERNS = [

    const g = lx.createLinearGradient(0, cy - 20, 0, cy + 20); g.addColorStop(0, '#ffe066'); g.addColorStop(1, '#f08c00');
    lx.fillStyle = g; lx.beginPath(); lx.roundRect(x0 - 22, cy - 19, Math.max(44, x1 - x0 + 44), 38, 19); lx.fill();
    if (n.holding) { lx.strokeStyle = '#fff'; lx.lineWidth = 3; lx.stroke(); }

    for (let x = x0 + 4; x < x1 - 4; x += 16) { lx.beginPath(); lx.moveTo(x, cy - 9); lx.lineTo(x + 7, cy); lx.lineTo(x, cy + 9); lx.fill(); }
    lx.fillStyle = '#5c2d10'; lx.font = '700 15px "Jua", sans-serif'; lx.textAlign = 'center'; lx.fillText(n.holding ? '다다다닥!' : '꾹!', Math.max(x0, hx + 2) + 2, cy + 5);
  }
  for (const n of notes) {
    if (n.judged || n.roll) continue;
    const x = hx + (n.t - t) * SPEED * n.sp;
    if (x < hx - 60 || x > LW + 40) continue; // per-note speeds: notes can overtake, so no early break
    lx.fillStyle = '#9c4f1d'; lx.beginPath(); lx.ellipse(x, cy + 2, 24, 18, 0, 0, Math.PI * 2); lx.fill();
    lx.fillStyle = '#c4703a'; lx.beginPath(); lx.ellipse(x, cy - 2, 24, 17, 0, 0, Math.PI * 2); lx.fill();
    lx.fillStyle = '#5c2d10'; lx.fillRect(x - 12, cy + 3, 24, 3);
  }
}

// ---------- loop ----------
const v3 = new THREE.Vector3();
let last = performance.now(), lastSong = -1;
function animMonk(m, dt, t) {
  m.hitT += dt;
  const k = m.hitT < .06 ? m.hitT / .06 : m.hitT < .25 ? 1 - (m.hitT - .06) / .19 : 0;
  m.arm.rotation.x = -.55 + k * .75;
  const sq = m.hitT < .12 ? Math.sin(m.hitT / .12 * Math.PI) * .18 : 0;
  m.mok.scale.set(1 + sq * .5, 1 - sq, 1 + sq * .5);

  m.brow.visible = glaring; m.eyes.forEach(e => e.scale.y = glaring ? 3 : 1);

}

  const t = now(), tt = nowMs / 1000;

    // NPC arm animation follows the chart
    while (npcCursor < notes.length && notes[npcCursor].t <= t) { monks.forEach(m => m.hitT = 0); npcCursor++; }
    const npcRoll = notes.find(n => n.roll && t >= n.t && t < n.end);
    if (npcRoll && Math.floor((t - npcRoll.t) / ROLL_STEP) !== npcRoll.lastTick) { npcRoll.lastTick = Math.floor((t - npcRoll.t) / ROLL_STEP); monks.forEach(m => m.hitT = 0); }
    // holding a roll → my own 다다다닥
    if (activeRoll && held) {
      rollAcc += dt;
      while (rollAcc >= ROLL_STEP) { rollAcc -= ROLL_STEP; myTok(true); me.hitT = 0; rollHits++; chantRoll(); strikeFx(0xffa94d, false); laneBurst('#ffa94d', false); Arcade.vibrate(10 + Math.min(combo, 30)); Arcade.shake(.05 + Math.min(combo, 30) * .003); }
    }

        else if (t > n.end) { n.judged = true; offBeat('놓침!'); hud(); }

      }

    }

      if (sm.sp) { Arcade.toast(sm.faster ? `⚡ 노트 빨라짐 ×${sm.sp}` : `🐢 노트 느려짐 ×${sm.sp}`, sm.faster ? '#e8590c' : '#1971c2'); Arcade.sfx.whoosh(sm.faster); }
      else Arcade.toast(sm.faster ? `🔥 템포 UP ${sm.bpm} BPM` : `🍃 템포 DOWN ${sm.bpm} BPM`, sm.faster ? '#c92a2a' : '#2b8a3e');
      Arcade.vibrate(25);

    if (state === 'play' && t > songEnd + .4) end(true);

  // glaring heads turn toward the player
  monks.forEach((m, i) => {
    const target = m.glareT > 0 ? .5 : 0; m.head.rotation.y += ((m.group.position.x > 0 ? target : -target) - m.head.rotation.y) * Math.min(1, dt * 10);
    m.head.getWorldPosition(v3); v3.y += 1; v3.project(camera);
    glares[i].style.left = `${(v3.x + 1) / 2 * innerWidth}px`; glares[i].style.top = `${(1 - v3.y) / 2 * innerHeight}px`;
    glares[i].style.opacity = m.glareT > 0 ? 1 : 0;
  });
  // camera over the player's shoulder
  const camLift = Math.min(lift, 6) * .55;
  camera.position.set(Math.sin(tt * .3) * .3, 7.6 + camLift * .5, 11.5);
  Arcade.applyShake(camera, dt);
  camera.lookAt(0, .6 + camLift, -3.2 + camLift * .4);

  lamp.color.setHex(fever ? 0xffd34d : 0xffb347);

  petals.visible = fever || petals.userData.fade > 0;
  petals.userData.fade = Math.max(0, petals.userData.fade + (fever ? dt : -dt));
