<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>명절 잔소리 대작전</title>

<style>

  canvas{display:block}

    background:#fff;color:var(--ink);border-radius:20px;padding:12px 16px 12px;box-shadow:0 12px 30px rgba(80,40,0,.3);border:3px solid #e8590c}
  #card .top{display:flex;align-items:center;gap:12px}
  #card .av{width:52px;height:52px;border-radius:16px;background:#fff4e6;display:flex;align-items:center;justify-content:center;font-size:34px;flex:none}
  #card .nm{font:22px "Jua",sans-serif} #card .rel{font:700 13px "Noto Sans KR",sans-serif;color:#868e96}
  #card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  #card .tags span{font:700 13px "Noto Sans KR",sans-serif;background:#f1f3f5;border-radius:999px;padding:4px 10px}
  #card .tags span.hot{background:#fff4e6;color:#d9480f}
  #card.blur .tags span:not(.hot){filter:blur(3px)}
  #tbar{height:6px;border-radius:3px;background:#f1f3f5;margin-top:10px;overflow:hidden}
  #tbar i{display:block;height:100%;background:#e8590c;transform-origin:left}
  #tbar.low i{background:#fa5252}
  #choices{position:fixed;left:50%;bottom:max(60px,calc(env(safe-area-inset-bottom) + 54px));transform:translateX(-50%);width:min(440px,calc(100% - 32px));display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:3}

  .ch:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(120,60,0,.35)}
  .ch.ok{background:#51cf66;color:#fff} .ch.no{background:#ff6b6b;color:#fff} .ch.dim{opacity:.4}
  #choices.lock .ch{pointer-events:none}
  @media (min-aspect-ratio: 6/5) {   /* wide: relative on the left, profile + answers on the right */
    #card{left:auto;right:max(24px,4vw);transform:none;width:min(440px,44vw);top:max(110px,15vh)}
    #choices{left:auto;right:max(24px,4vw);transform:none;width:min(440px,44vw)}
    #reply{left:30%}
  }
  #reply{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;background:#fff;border-radius:18px;padding:10px 16px;font:20px "Jua",sans-serif;color:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.3);opacity:0;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}

  @keyframes rp{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}

</head>
<body>
<div class="hud">

<div class="screen" id="center"></div>

<script type="module">

plate(.8, .2, (x, z) => { for (let i = 0; i < 3; i++) { const a = new THREE.Mesh(new THREE.SphereGeometry(.07, 8, 6), flat(i ? 0xff6b6b : 0xffd43b)); a.position.set(x + (i - 1) * .12, .7, z); scene.add(a); } });   // 과일

// ---------- game ----------

    // comeback names the trait you got wrong
    let cb = '…(못 들은 척)';
    if (wrong) { const k = Object.keys(COMEBACK).find(key => wrong.ok({ ...prof, job: key, love: key, q: key, age: 30 })); cb = COMEBACK[k] || '그거 저 아닌데요?'; }
    reply(i < 0 ? '(벌써 다른 방으로 도망감)' : `${cb} 😤`);
    Arcade.sfx.miss(); Arcade.shake(.2); Arcade.vibrate([40, 30, 60]);
  }
  updateHud();
  setTimeout(() => { if (lives <= 0) finish(); else nextRelative(); }, ok ? 1100 : 1600);
}
function finish() {
  state = 'over'; overAt = performance.now();
  const isBest = score > best; if (isBest) { best = score; try { localStorage.setItem('nag-best', best); } catch {} }
  isBest && score > 0 ? Arcade.sfx.fanfare() : Arcade.sfx.fail();
  const rank = score < 4 ? '🙂 다정한 어른' : score < 10 ? '🧓 평범한 친척' : score < 18 ? '👵 잔소리 고수' : score < 28 ? '💢 명절 공포의 대상' : '👑 전설의 잔소리 대마왕';
  showScreen(Arcade.resultScreen({ emoji: '🧧', label: '잔소리 성공', score, unit: '번', msg: `${met}명의 친척을 만났어요`, rows: [['등급', rank], ['최대 콤보', `${maxCombo}번`]], isBest: isBest && score > 0, best }));
  Arcade.gameOver(score);
}
function start() {
  score = 0; lives = LIVES; combo = 0; maxCombo = 0; met = 0; updateHud();
  state = 'count'; $center.style.display = 'none'; $choices.innerHTML = '';
  Arcade.countdown({ final: '세배 받자!', onTick: n => n ? Arcade.sfx.tick() : Arcade.sfx.go(), onDone: () => { state = 'playing'; nextRelative(); } });
}
$choices.addEventListener('click', e => { const b = e.target.closest('.ch'); if (b) answer(+b.dataset.i); });
addEventListener('pointerdown', e => { if (e.target.closest?.('.ch, .arcade-btn')) return; if (state === 'ready') start(); else if (state === 'over' && performance.now() - overAt > 900 && !Arcade.inRun()) start(); });
addEventListener('keydown', e => {
  const n = +e.key; if (n >= 1 && n <= 4 && q && n <= q.opts.length) return answer(n - 1);
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (state === 'ready') start(); else if (state === 'over' && performance.now() - overAt > 900 && !Arcade.inRun()) start(); }
});
updateHud();
buildRelative(makeProfile(0)); seat.position.y = 0;
window.__nag = { get state() { return state; }, get q() { return q; }, get prof() { return prof; }, answer, get score() { return score; }, get lives() { return lives; } };

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  seat.position.y += (0 - seat.position.y) * Math.min(1, dt * 8);
  if (state === 'playing' && q && !q.done) { tLeft -= dt; if (tLeft <= 0) { tLeft = 0; answer(-1); } }
  $('tfill').style.transform = `scaleX(${state === 'playing' && q ? tLeft / tMax : 0})`; $('tbar').classList.toggle('low', tLeft / tMax < .3);
  if (rel) {
    const { g, head, arms, eyes, mouth, sweat, cloud } = rel;
    g.rotation.set(0, 0, 0); g.position.set(0, 0, 0); head.rotation.set(Math.sin(t * 1.6) * .03, 0, 0);
    arms.forEach((a, i) => a.rotation.set(0, 0, i ? -.15 : .15)); mouth.scale.set(1, 1, 1); eyes.forEach(e => e.scale.set(1, 1, 1));
    sweat.visible = cloud.visible = false;
    if (rel.react) {
      rel.t += dt; const k = rel.t;
      if (rel.react === 'hit') {   // shrinks, head down, sweat + gloomy cloud
        g.scale.setScalar((prof?.grp === 'kid' ? .78 : prof?.grp === 'teen' ? .9 : 1) * (1 - Math.min(.12, k * .3)));
        head.rotation.x = Math.min(.45, k * 1.5); sweat.visible = true; sweat.position.y = .4 - (k % .6) * .5; cloud.visible = true; cloud.rotation.y = t;
        eyes.forEach(e => e.scale.set(1, .3, 1)); mouth.scale.set(.6, 1, 1);
      } else {   // fires back: leans in, waves arms, eyes wide
        g.position.z = Math.min(.25, k * 1.2); g.rotation.z = Math.sin(k * 18) * .05 * Math.max(0, 1 - k);
        arms.forEach((a, i) => { a.rotation.x = -2.2 + Math.sin(k * 16 + i * 3) * .4; });
        eyes.forEach(e => e.scale.set(1.3, 1.5, 1)); mouth.scale.set(1.5, 3, 1);
      }
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
