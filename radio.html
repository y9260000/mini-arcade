<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우주 전파 배달</title>
<script src="common.js?v=18"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05081a;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #top{position:fixed;left:0;right:0;top:max(12px,env(safe-area-inset-top));z-index:3;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;pointer-events:none;padding:0 12px}
  .pill{background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 14px;font:17px "Jua",sans-serif;backdrop-filter:blur(4px)}
  #msg{position:fixed;left:50%;bottom:max(26px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);z-index:3;pointer-events:none;
    font:20px "Jua",sans-serif;color:#fff;background:rgba(45,111,240,.85);border-radius:999px;padding:10px 22px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #msg.go{background:rgba(47,158,68,.92);animation:mg .3s infinite alternate} @keyframes mg{to{transform:translateX(-50%) scale(1.06)}}
  #msg.wait{background:rgba(255,255,255,.14)}
</style>
</head>
<body>
<div id="top" class="hud-ctl"><span class="pill" id="score">0점</span><span class="pill" id="dest">🌕 달</span><span class="pill" id="lives">📶📶📶</span></div>
<div id="msg" class="hud-ctl">탭해서 송신!</div>
<div class="screen" id="center"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $ = id => document.getElementById(id);
const rnd = a => a[(Math.random() * a.length) | 0];

// ---------- destinations: each needs more relay hops ----------
const DEST = [
  { name: '🌕 달', r: .9, color: 0xced4da, hops: 1, who: '달 기지 대원' },
  { name: '🔴 화성', r: 1, color: 0xe8590c, hops: 2, who: '감자 키우는 우주인' },
  { name: '🪐 목성', r: 1.4, color: 0xd9a066, hops: 3, who: '유로파 기지' },
  { name: '💍 토성', r: 1.25, color: 0xf2d29b, hops: 3, ring: true, who: '토성 고리 관리소' },
  { name: '🔵 해왕성', r: 1.1, color: 0x4c6ef5, hops: 4, who: '보이저 팬클럽' },
];

// ---------- three ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05081a);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .1, 200);
scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x10142a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(-6, 10, 8); scene.add(sun);
const flat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .7, flatShading: true, ...o });
const basic = (c, op = 1) => new THREE.MeshBasicMaterial({ color: c, transparent: op < 1, opacity: op });
{ // starfield
  const g = new THREE.BufferGeometry(), p = [];
  for (let i = 0; i < 900; i++) p.push((Math.random() - .5) * 120, -8 - Math.random() * 30, (Math.random() - .5) * 120);
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: .14 })));
}
// the world lies on the XZ plane (y = 0), viewed from above at a tilt
const world = new THREE.Group(); scene.add(world);
function makeEarth() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1, 2), flat(0x339af0)));
  for (let i = 0; i < 6; i++) { const c = new THREE.Mesh(new THREE.IcosahedronGeometry(.32 + Math.random() * .2, 0), flat(0x51cf66)); const a = Math.random() * 6.28, b = Math.random() * 3; c.position.set(Math.cos(a) * Math.sin(b) * .82, Math.cos(b) * .82, Math.sin(a) * Math.sin(b) * .82); c.scale.y = .5; c.lookAt(0, 0, 0); g.add(c); }
  const dish = new THREE.Group(); dish.position.set(.9, .5, 0);
  dish.add(new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .4, 6), flat(0xdee2e6)));
  const bowl = new THREE.Mesh(new THREE.SphereGeometry(.28, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2.6), flat(0xffffff, { side: THREE.DoubleSide })); bowl.position.y = .25; bowl.rotation.z = -1.1; dish.add(bowl);
  g.add(dish); return g;
}
function makeSat() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(.4, .4, .4), flat(0xdee2e6)));
  for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(.7, .04, .32), flat(0x364fc7, { emissive: 0x0b1a5a })); p.position.x = s * .58; g.add(p); }
  const bowl = new THREE.Mesh(new THREE.SphereGeometry(.24, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2.4), flat(0xffffff, { side: THREE.DoubleSide })); bowl.position.y = .3; g.add(bowl);
  const led = new THREE.Mesh(new THREE.SphereGeometry(.07, 6, 4), basic(0xff6b6b)); led.position.set(0, .05, .22); g.add(led); g.userData.led = led;
  return g;
}
function makePlanet(D) {
  const g = new THREE.Group(), body = new THREE.Mesh(new THREE.IcosahedronGeometry(D.r, 2), flat(D.color)); g.add(body);
  if (D.ring) { const ring = new THREE.Mesh(new THREE.RingGeometry(D.r * 1.4, D.r * 2, 32), flat(0xe9d8a6, { side: THREE.DoubleSide })); ring.rotation.x = Math.PI / 2 - .35; g.add(ring); }
  if (D.name.includes('목성')) for (let i = 0; i < 3; i++) { const b = new THREE.Mesh(new THREE.TorusGeometry(D.r * (.98 - Math.abs(i - 1) * .2), .06, 4, 24), flat(0xb5702c)); b.rotation.x = Math.PI / 2; b.position.y = (i - 1) * .45; g.add(b); }
  // receiver station that spins around the planet with it
  const rx = new THREE.Group(); const st = new THREE.Mesh(new THREE.BoxGeometry(.3, .3, .3), flat(0xffd43b)); st.position.x = D.r + .1; rx.add(st);
  const bowl = new THREE.Mesh(new THREE.SphereGeometry(.24, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2.4), flat(0xffffff, { side: THREE.DoubleSide })); bowl.position.x = D.r + .32; bowl.rotation.z = -Math.PI / 2; rx.add(bowl);
  g.add(rx); g.userData.rx = rx; return g;
}

// ---------- level state ----------
// nodes: [earth, relay1..N, planet]. Each relay orbits its own centre; the planet's receiver spins around it.
let nodes = [], beamAt = 0, holderPos = new THREE.Vector3(), state = 'ready', score = 0, delivered = 0, lives = 3, overAt = 0, level = 0, cool = 0, combo = 0;
let best = 0; try { best = +localStorage.getItem('radio-best') || 0; } catch {}
const ringMeshes = [], fxList = [];
const guideGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const guide = new THREE.Line(guideGeo, new THREE.LineDashedMaterial({ color: 0x66d9e8, dashSize: .25, gapSize: .18, transparent: true, opacity: .7 }));
const holder = new THREE.Mesh(new THREE.SphereGeometry(.42, 16, 10), basic(0x66d9e8, .35));
function clearLevel() { while (world.children.length) world.remove(world.children[0]); nodes = []; ringMeshes.length = 0; }
function zoneHalf() { return Math.max(.2, .52 - level * .035); }
function buildLevel() {
  clearLevel();
  const D = DEST[level % DEST.length], lap = Math.floor(level / DEST.length), hops = Math.min(5, D.hops + lap);
  const span = 4.2 + hops * 3.4, pts = [];
  for (let i = 0; i <= hops + 1; i++) { const u = i / (hops + 1); pts.push(new THREE.Vector3(-span / 2 + u * span, 0, (i === 0 || i === hops + 1) ? 0 : (i % 2 ? -1.6 : 1.6) * (.6 + Math.random() * .5))); }
  const earth = makeEarth(); earth.position.copy(pts[0]); world.add(earth);
  nodes.push({ kind: 'earth', obj: earth, c: pts[0].clone(), pos: () => earth.position.clone().add(new THREE.Vector3(.95, .4, 0)) });
  for (let i = 1; i <= hops; i++) {
    const c = pts[i], r = 1.15 + Math.random() * .25, sp = (1.1 + level * .07 + Math.random() * .5) * (i % 2 ? 1 : -1);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, .02, 4, 64), basic(0x5c7cfa, .35)); ring.rotation.x = Math.PI / 2; ring.position.copy(c); world.add(ring);
    const zone = new THREE.Mesh(new THREE.TorusGeometry(r, .09, 6, 24, zoneHalf() * 2), basic(0x69db7c, .55)); zone.rotation.x = -Math.PI / 2; zone.position.copy(c); world.add(zone);
    const sat = makeSat(); world.add(sat);
    const n = { kind: 'sat', obj: sat, c: c.clone(), r, sp, a: Math.random() * 6.28, ring, zone, zoneAng: 0, pos: () => sat.position.clone() };
    nodes.push(n);
  }
  const planet = makePlanet(D); planet.position.copy(pts[hops + 1]); world.add(planet);
  const pn = { kind: 'planet', obj: planet, c: pts[hops + 1].clone(), r: D.r + .32, sp: (1 + level * .06) * (hops % 2 ? -1 : 1), a: Math.random() * 6.28, pos: () => world.worldToLocal(planet.userData.rx.children[1].getWorldPosition(new THREE.Vector3())) };
  const pzone = new THREE.Mesh(new THREE.TorusGeometry(D.r + .32, .09, 6, 24, zoneHalf() * 2), basic(0xffd43b, .45)); pzone.rotation.x = -Math.PI / 2; pzone.position.copy(pn.c); world.add(pzone); pn.zone = pzone;
  nodes.push(pn);
  // each zone faces the previous node's centre (that's where the signal comes from)
  for (let i = 1; i < nodes.length; i++) { const n = nodes[i], p = nodes[i - 1].c; n.zoneAng = Math.atan2(-(p.z - n.c.z), p.x - n.c.x); }
  for (let i = 1; i < nodes.length; i++) { const n = nodes[i]; n.zone.rotation.z = n.zoneAng - zoneHalf(); }
  world.add(holder); world.add(guide); beamAt = 0; $('dest').textContent = `${D.name}${lap ? ` · ${lap + 1}회차` : ''}`; frame3();
}
// angle of a relay on its orbit, in the same convention as zoneAng (x right, -z up on screen)
const angOf = n => n.a;
const inZone = n => { let d = angOf(n) - n.zoneAng; d = Math.atan2(Math.sin(d), Math.cos(d)); return Math.abs(d) < zoneHalf(); };
function placeNodes(dt) {
  for (const n of nodes) {
    if (n.kind === 'sat') { n.a += n.sp * dt; n.obj.position.set(n.c.x + Math.cos(n.a) * n.r, 0, n.c.z - Math.sin(n.a) * n.r); n.obj.rotation.y = n.a; const ok = inZone(n); n.obj.userData.led.material.color.setHex(ok ? 0x51cf66 : 0xff6b6b); n.zone.material.opacity = ok ? 1 : .55; }
    if (n.kind === 'planet') { n.a += n.sp * dt; n.obj.rotation.y = n.a; n.obj.children[0].rotation.y = 0; const ok = inZone(n); n.zone.material.opacity = ok ? 1 : .55; }
  }
}
// ---------- beam fx ----------
function beam(from, to, color, life = .35) {
  const d = to.clone().sub(from), len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, len, 8), basic(color, .95));
  m.position.copy(from).addScaledVector(d, .5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize()); world.add(m);
  const core = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, len, 6), basic(0xffffff)); core.position.copy(m.position); core.quaternion.copy(m.quaternion); world.add(core);
  m.scale.y = .01; core.scale.y = .01;
  fxList.push({ t: 0, life, f(t) { const k = Math.min(1, t / .1); m.scale.y = core.scale.y = k; m.position.copy(from).addScaledVector(d, k / 2); core.position.copy(m.position); m.material.opacity = core.material.opacity = Math.max(0, 1 - Math.max(0, t - .12) / (life - .12)); core.material.transparent = true; }, end() { world.remove(m); world.remove(core); } });
}
function burst(pos, color, n = 16) {
  for (let i = 0; i < n; i++) { const p = new THREE.Mesh(new THREE.OctahedronGeometry(.06 + Math.random() * .06, 0), basic(color)); p.position.copy(pos); world.add(p); const v = new THREE.Vector3((Math.random() - .5) * 6, (Math.random() - .2) * 4, (Math.random() - .5) * 6);
    fxList.push({ t: 0, life: .6, f(t, dt) { p.position.addScaledVector(v, dt); p.scale.setScalar(1 - t / .6); }, end() { world.remove(p); } }); }
}

// ---------- play ----------
const showScreen = html => { $('center').innerHTML = html; $('center').style.display = ''; };
showScreen(Arcade.titleScreen({ emoji: '📡', title: '우주 전파 배달', how: [
  ['🛰️', '위성들이 궤도를 빙글빙글 돌아요'],
  ['🟢', '다음 위성이 <b>초록 구역</b>에 들어온 순간 탭! 전파가 튕겨 넘어가요'],
  ['🪐', '마지막엔 행성 <b>수신기가 노란 구역</b>에 왔을 때 탭해서 배달'],
  ['📶', '빗나가면 신호 하나 잃어요. 3번 끊기면 끝!'],
] }));
function updateHud() {
  $('score').textContent = `${score}점`;
  $('lives').textContent = '📶'.repeat(Math.max(0, lives)) + '✖️'.repeat(Math.max(0, 3 - lives));
  const next = nodes[beamAt + 1];
  const m = $('msg');
  if (state !== 'playing') return;
  if (!next) { m.className = 'hud-ctl wait'; m.textContent = '배달 완료!'; return; }
  const ok = inZone(next);
  m.className = 'hud-ctl ' + (ok ? 'go' : 'wait');
  m.textContent = ok ? (next.kind === 'planet' ? '지금! 수신기로 송신!' : '지금! 탭!') : (next.kind === 'planet' ? '수신기가 노란 구역에 오면…' : '초록 구역에 들어오면…');
}
function tap() {
  if (state === 'ready') return start();
  if (state === 'over') { if (performance.now() - overAt > 1200 && !Arcade.inRun()) start(); return; }
  if (state !== 'playing' || cool > 0) return;
  const from = nodes[beamAt].pos(), next = nodes[beamAt + 1];
  cool = .25;
  if (inZone(next)) {
    const to = next.pos(); beam(from, to, next.kind === 'planet' ? 0xffd43b : 0x66d9e8); burst(to, 0x66d9e8, 10);
    beamAt++; combo++; score += 10 * Math.min(5, combo); Arcade.sfx.note?.(Math.min(7, beamAt)); Arcade.vibrate(15);
    if (next.kind === 'planet') deliver(to);
  } else {
    // signal shoots off into empty space
    const dir = next.c.clone().sub(from).normalize(), miss = from.clone().addScaledVector(dir, from.distanceTo(next.c) + 2.5);
    beam(from, miss, 0xff6b6b, .45); burst(miss, 0xff6b6b, 8);
    lives--; combo = 0; Arcade.sfx.miss(); Arcade.shake(.25); Arcade.vibrate([40, 30, 40]);
    Arcade.toast(rnd(['📵 신호 끊김!', '🌌 전파가 우주 미아로…', '😵 타이밍 놓침!']), '#e03131');
    if (lives <= 0) { state = 'over-anim'; setTimeout(finish, 900); }
  }
  updateHud();
}
function deliver(pos) {
  const D = DEST[level % DEST.length];
  delivered++; score += 50 + level * 10; Arcade.sfx.fanfare(); burst(pos, 0xffd43b, 30);
  Arcade.toast(`📨 ${D.who}에게 배달 완료!`, '#2f9e44'); Arcade.confetti({ y: innerHeight * .4, count: 50, emoji: ['📡', '✨', '📨'] });
  state = 'between'; setTimeout(() => { level++; buildLevel(); state = 'playing'; updateHud(); }, 1300);
}
function finish() {
  state = 'over'; overAt = performance.now();
  const isBest = score > best; if (isBest) { best = score; try { localStorage.setItem('radio-best', best); } catch {} }
  const msg = delivered >= 8 ? '태양계 우체국장님' : delivered >= 4 ? '토성까지 배달 성공!' : delivered >= 2 ? '화성까지는 문제없다' : '달까지는 금방이에요';
  showScreen(Arcade.resultScreen({ emoji: '📡', label: '배달 점수', score, unit: '점', msg, rows: [['배달한 행성', `${delivered}곳`]], isBest: isBest && score > 0, best }));
  Arcade.gameOver(score);
}
function start() {
  score = 0; delivered = 0; lives = 3; level = 0; combo = 0; buildLevel(); updateHud();
  state = 'count'; $('center').style.display = 'none';
  Arcade.countdown({ final: '송신!', onTick: n => n ? Arcade.sfx.tick() : Arcade.sfx.go(), onDone: () => { state = 'playing'; updateHud(); } });
}
addEventListener('pointerdown', e => { if (e.target.closest?.('.arcade-btn')) return; tap(); });
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tap(); } });

// ---------- camera framing: fit the whole route ----------
function frame3() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const xs = nodes.map(n => n.c.x), w = Math.max(...xs) - Math.min(...xs) + 4, portrait = camera.aspect < 1;
  if (portrait) { world.rotation.y = -Math.PI / 2; }   // route runs bottom -> top on phones
  else world.rotation.y = 0;
  const need = portrait ? w / 2 : w / camera.aspect / 2 + .5;
  const dist = Math.max(8, need / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05);
  camera.position.set(0, dist * .92, dist * .42); camera.lookAt(0, 0, portrait ? 0 : .3);
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); frame3(); });
buildLevel();

let last = performance.now();
window.__radio = { get state() { return state; }, get nodes() { return nodes; }, get beamAt() { return beamAt; }, inZone, tap, get lives() { return lives; }, get level() { return level; } };
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; cool -= dt;
  placeNodes(state === 'ready' || state === 'over' ? dt * .5 : dt);
  if (nodes[0]) nodes[0].obj.rotation.y += dt * .3;
  const nx = nodes[beamAt + 1];
  if (nodes[beamAt] && nx) { const a = nodes[beamAt].pos(), b = new THREE.Vector3(nx.c.x + Math.cos(nx.zoneAng) * nx.r, 0, nx.c.z - Math.sin(nx.zoneAng) * nx.r);
    guideGeo.setFromPoints([a, b]); guide.computeLineDistances(); guide.visible = state === 'playing'; guide.material.color.setHex(inZone(nx) ? 0x69db7c : 0x66d9e8); } else guide.visible = false;
  if (nodes[beamAt]) { holder.position.copy(nodes[beamAt].pos()); holder.scale.setScalar(1 + Math.sin(now / 120) * .15); holder.visible = state === 'playing' || state === 'count'; }
  for (let i = fxList.length - 1; i >= 0; i--) { const f = fxList[i]; f.t += dt; f.f(f.t, dt); if (f.t >= f.life) { f.end(); fxList.splice(i, 1); } }
  if (state === 'playing') updateHud();
  Arcade.applyShake(camera, dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
