<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우주 전파 배달</title>
<script src="common.js?v=17"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060f;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #msg{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:3;pointer-events:none;max-width:calc(100% - 170px);box-sizing:border-box;
    display:flex;gap:10px;align-items:center;background:rgba(15,20,45,.88);color:#fff;border:2px solid #4dabf7;border-radius:16px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  #msg .ic{font-size:24px} #msg .who{font:700 11px "Noto Sans KR",sans-serif;opacity:.7} #msg .txt{font-family:"Jua",sans-serif;font-size:clamp(16px,4.2vw,21px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #timer{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:4px}
  #timer i{display:block;height:100%;width:100%;background:#ffd43b;border-radius:3px;transform-origin:left}
  #send{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:4;border:0;border-radius:20px;padding:16px 22px;
    font:24px "Jua",sans-serif;color:#fff;background:#495057;box-shadow:0 6px 0 #212529;cursor:pointer}
  #send.ready{background:#2f9e44;box-shadow:0 6px 0 #1b5e20;animation:sp .7s ease-in-out infinite}
  @keyframes sp{50%{transform:scale(1.07)}}
  #send:active{transform:translateY(4px)}
  #hint{position:fixed;top:40%;left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
  #hint .pill{font-size:15px;padding:10px 18px;text-align:center;display:block;line-height:1.4}
  .toast{top:24%}
  .arcade-home{bottom:auto!important;top:max(14px,env(safe-area-inset-top))}
</style>
</head>
<body>
<div class="hud">
  <div id="score" class="hud-score">0<small>점</small></div>
  <div class="hud-row"><span class="pill" id="lives"></span><span class="pill dark" id="lvl">메시지 1</span></div>
</div>
<div id="msg" class="hud-ctl"><div class="ic" id="mic">📡</div><div style="min-width:0"><div class="who" id="route">🌕 달</div><div class="txt" id="mtxt">“김치 보내줄까?”</div><div id="timer"><i id="tfill"></i></div></div></div>
<button id="send" class="hud-ctl">📡 송신</button>
<div id="hint" class="hud-ctl"><span class="pill">🛰️ 위성을 잡고 돌려서 레이저를 꺾어요<br>목표에 닿으면 <b>송신</b>!</span></div>
<div class="screen" id="center"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $ = id => document.getElementById(id);
const rnd = a => a[(Math.random() * a.length) | 0];
const TAU = Math.PI * 2;

// ---------- stages ----------
const STAGES = [
  { key: 'moon', upto: 3, name: '🌕 달', r: 1.1, color: 0xced4da, who: ['달 기지 대원', '월면 탐사 로봇', '토끼(?)'] },
  { key: 'mars', upto: 6, name: '🔴 화성', r: 1.3, color: 0xe8590c, who: ['화성 탐사대', '감자 키우는 우주인', '화성 이주민'] },
  { key: 'jupiter', upto: 1e9, name: '🪐 목성', r: 1.9, color: 0xd9a066, who: ['유로파 기지', '목성 관측선', '보이저 팬클럽'] },
];
const MSGS = [['김치 보내줄까?', '🥬'], ['와이파이 되나요?', '📶'], ['택배 언제 와요?', '📦'], ['거기도 월요일이야?', '😩'], ['지구는 잘 있어', '🌏'], ['외계인 만났어?', '👽'], ['생일 축하해 우주인!', '🎂'], ['엄마가 밥 잘 챙겨 먹으래', '🍚'], ['로또 번호 좀…', '🎰']];
const stageOf = lv => STAGES.find(s => lv <= s.upto);
const EARTH = new THREE.Vector2(-9, -1), RE = 1.6, MIRROR_L = 1.6, SAT_GRAB = 1.6;

// ---------- three ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 300);
scene.add(new THREE.AmbientLight(0x6070a0, .8));
const sunL = new THREE.DirectionalLight(0xffffff, 2); sunL.position.set(-6, 6, 10); scene.add(sunL);
const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .85, flatShading: true, ...extra });
{
  const n = 1200, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { pos[i * 3] = (Math.random() - .5) * 160; pos[i * 3 + 1] = (Math.random() - .5) * 100; pos[i * 3 + 2] = -20 - Math.random() * 40; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: .18 })));
}
// earth
const earth = new THREE.Group(); earth.position.set(EARTH.x, EARTH.y, 0); scene.add(earth);
{
  const geo = new THREE.IcosahedronGeometry(RE, 3), col = [], p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).normalize();
    const land = Math.sin(v.x * 3.1 + 1) * Math.cos(v.y * 2.7) + Math.sin(v.z * 4.2 + v.x * 2) * .6 > .35, ice = Math.abs(v.y) > .88;
    const c = new THREE.Color(ice ? 0xf1f3f5 : land ? 0x5c940d : 0x1971c2); col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  earth.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true })));
  earth.add(new THREE.Mesh(new THREE.SphereGeometry(RE * 1.07, 24, 16), new THREE.MeshBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: .12, side: THREE.BackSide })));
}
const antenna = new THREE.Group(); scene.add(antenna);
{ const dish = new THREE.Mesh(new THREE.SphereGeometry(.32, 12, 8, 0, TAU, 0, Math.PI / 2), flat(0xdee2e6, { side: THREE.DoubleSide })); dish.rotation.z = -Math.PI / 2; antenna.add(dish);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(.07, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff6b6b })); tip.position.x = .35; antenna.add(tip); }
// target planet
const planet = new THREE.Group(); scene.add(planet);
const planetBody = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 2), new THREE.MeshStandardMaterial({ color: 0xced4da, flatShading: true })); planet.add(planetBody);
const planetRing = new THREE.Mesh(new THREE.RingGeometry(1.4, 1.9, 40), new THREE.MeshBasicMaterial({ color: 0xe9c46a, transparent: true, opacity: .55, side: THREE.DoubleSide })); planetRing.rotation.x = 1.1; planet.add(planetRing);
const planetAim = new THREE.Mesh(new THREE.RingGeometry(1.08, 1.18, 48), new THREE.MeshBasicMaterial({ color: 0x69db7c, transparent: true, opacity: .6, side: THREE.DoubleSide })); planet.add(planetAim);
// sun (an obstacle on mars+ stages)
const sun = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), new THREE.MeshBasicMaterial({ color: 0xffd43b })); scene.add(sun);
const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(1.35, 20, 14), new THREE.MeshBasicMaterial({ color: 0xff922b, transparent: true, opacity: .3 })); sun.add(sunGlow);

// laser + pulse
const LASER_MAX = 40;
const laserGeo = new THREE.BufferGeometry(); laserGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(LASER_MAX * 3), 3));
const laser = new THREE.Line(laserGeo, new THREE.LineBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: .85 })); laser.frustumCulled = false; scene.add(laser);
// thick glowing beam made of cylinders (GL lines are always 1px)
const beamMat = new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: .85, depthWrite: false });
const beamGlowMat = new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: .22, depthWrite: false });
const beamGeo = new THREE.CylinderGeometry(1, 1, 1, 8, 1, true);
const beams = Array.from({ length: 12 }, () => { const core = new THREE.Mesh(beamGeo, beamMat), glow = new THREE.Mesh(beamGeo, beamGlowMat); scene.add(core, glow); core.visible = glow.visible = false; return { core, glow }; });
const UP = new THREE.Vector3(0, 1, 0);
function drawBeam(pts) {
  beams.forEach((b, i) => {
    const A = pts[i], B = pts[i + 1];
    if (!B) { b.core.visible = b.glow.visible = false; return; }
    const a = new THREE.Vector3(A.x, A.y, .05), c = new THREE.Vector3(B.x, B.y, .05), len = a.distanceTo(c);
    for (const [m, r] of [[b.core, .06], [b.glow, .18]]) { m.visible = true; m.position.copy(a).add(c).multiplyScalar(.5); m.scale.set(r, len, r); m.quaternion.setFromUnitVectors(UP, c.clone().sub(a).normalize()); }
  });
}
const pulse = new THREE.Mesh(new THREE.SphereGeometry(.22, 12, 8), new THREE.MeshBasicMaterial({ color: 0x9ef0ff })); pulse.visible = false; scene.add(pulse);
const pulseGlow = new THREE.Mesh(new THREE.SphereGeometry(.5, 12, 8), new THREE.MeshBasicMaterial({ color: 0x4dabf7, transparent: true, opacity: .35 })); pulse.add(pulseGlow);
const rings = [];
function ripple(x, y, color, s = 1) { const r = new THREE.Mesh(new THREE.RingGeometry(.1, .2, 28), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .9, side: THREE.DoubleSide })); r.position.set(x, y, .1); r.userData.s = s; scene.add(r); rings.push({ m: r, t: 0 }); }

// ---------- state ----------
const LIVES = 3;
let state = 'ready', score = 0, lives = LIVES, level = 1, overAt = 0, stage = STAGES[0];
let emitAng = 0, emitPos = new THREE.Vector2(), target = new THREE.Vector2(), sats = [], rocks = [], path = [], connected = false, flight = null, timeLeft = 30, timeMax = 30, sel = null, msg = MSGS[0];
let best = 0; try { best = +localStorage.getItem('radio-best') || 0; } catch {}
const $score = $('score'), $lives = $('lives'), $lvl = $('lvl'), $center = $('center'), $hint = $('hint'), $send = $('send');
const showScreen = html => { $center.innerHTML = html; $center.style.display = ''; };
const showIntro = () => showScreen(Arcade.titleScreen({ emoji: '📡', title: '우주 전파 배달', how: [
  ['📡', '지구 안테나는 <b>정해진 방향</b>으로만 전파를 쏴요'],
  ['🛰️', '<b>위성을 잡고 돌려서</b> 반사판으로 레이저를 꺾어요'],
  ['🟢', '레이저가 목표 행성에 닿으면 초록! <b>송신</b> 버튼'],
  ['☄️', '날아가는 동안 <b>소행성</b>에 맞으면 실패. 타이밍 보고 송신!'],
] }));
function updateHud() {
  $score.innerHTML = `${score}<small>점</small>`;
  $lives.textContent = '📶'.repeat(lives) + '🚫'.repeat(LIVES - lives);
  $lvl.textContent = `메시지 ${level} · ${stage.name}`;
}
function makeSat(p) {
  const g = new THREE.Group(); g.position.set(p.x, p.y, 0); scene.add(g);
  const body = new THREE.Mesh(new THREE.BoxGeometry(.4, .4, .4), flat(0xced4da, { metalness: .5 })); g.add(body);
  for (const s of [-1, 1]) { const pan = new THREE.Mesh(new THREE.BoxGeometry(.06, .7, .5), flat(0x1c3d6e)); pan.position.set(0, 0, s * .45); pan.rotation.x = Math.PI / 2; g.add(pan); }
  const mirror = new THREE.Mesh(new THREE.BoxGeometry(MIRROR_L, .1, .3), new THREE.MeshStandardMaterial({ color: 0xffd43b, emissive: 0xffa94d, emissiveIntensity: .5, metalness: .7, roughness: .2 }));
  g.add(mirror);
  const ring = new THREE.Mesh(new THREE.RingGeometry(SAT_GRAB * .62, SAT_GRAB * .7, 40), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .25, side: THREE.DoubleSide })); g.add(ring);
  return { p: p.clone(), ang: Math.random() * Math.PI, g, mirror, ring };
}
function clearLevel() { for (const s of sats) scene.remove(s.g); for (const r of rocks) scene.remove(r.m); sats = []; rocks = []; }
function setupLevel() {
  clearLevel();
  const prev = stage; stage = stageOf(level);
  if (prev !== stage && level > 1) Arcade.toast(`🚀 새 목표: ${stage.name}!`, '#7048e8');
  msg = rnd(MSGS);
  const nSat = stage.key === 'moon' ? (level === 1 ? 1 : 2) : stage.key === 'mars' ? 2 + (level >= 6 ? 1 : 0) : Math.min(4, 3 + Math.floor((level - 7) / 3));
  // target to the right, emitter fires a fixed (wrong-ish) direction; satellites are laid along a solvable route
  target.set(8 + Math.random() * 2, (Math.random() - .5) * 7);
  emitAng = (Math.random() < .5 ? 1 : -1) * (.6 + Math.random() * .5);
  emitPos.set(EARTH.x + Math.cos(emitAng) * (RE + .3), EARTH.y + Math.sin(emitAng) * (RE + .3));
  antenna.position.set(emitPos.x, emitPos.y, 0); antenna.rotation.z = emitAng;
  const first = emitPos.clone().add(new THREE.Vector2(Math.cos(emitAng), Math.sin(emitAng)).multiplyScalar(3.2 + Math.random() * 1.5));
  sats.push(makeSat(first));
  for (let i = 1; i < nSat; i++) {
    const u = i / nSat;
    let p, tries = 0;
    do { p = new THREE.Vector2(first.x + (target.x - first.x) * u + (Math.random() - .5) * 2, (Math.random() < .5 ? 1 : -1) * (2.5 + Math.random() * 2.5)); tries++; }
    while (tries < 30 && sats.some(s => s.p.distanceTo(p) < 3));
    sats.push(makeSat(p));
  }
  // sun sits between, blocking the straight shot on mars+
  sun.visible = stage.key !== 'moon';
  if (sun.visible) {   // block the lazy straight line but keep the intended route clear
    const route = [emitPos, ...sats.map(q => q.p), target];
    const segDist = (P, A, B) => { const ab = B.clone().sub(A), t = Math.max(0, Math.min(1, P.clone().sub(A).dot(ab) / ab.lengthSq())); return A.clone().addScaledVector(ab, t).distanceTo(P); };
    let spot = sats[0].p.clone().lerp(target, .5);
    for (let k = 0; k < 40; k++) {
      const cand = k === 0 ? spot : new THREE.Vector2(-2 + Math.random() * 9, (Math.random() - .5) * 8);
      if (route.slice(0, -1).every((A, i) => segDist(cand, A, route[i + 1]) > 2) && cand.distanceTo(target) > 3) { spot = cand; break; }
    }
    sun.position.set(spot.x, spot.y, 0); sun.scale.setScalar(1.1);
  }
  // drifting asteroids
  const nRock = Math.max(0, level - 1) + (stage.key === 'jupiter' ? 2 : 0);
  for (let i = 0; i < Math.min(8, nRock); i++) {
    const m = new THREE.Mesh(new THREE.DodecahedronGeometry(.35 + Math.random() * .3, 0), flat(0x868e96)); scene.add(m);
    rocks.push({ m, x: -4 + Math.random() * 12, y0: (Math.random() - .5) * 9, amp: 1.5 + Math.random() * 2, sp: .35 + Math.random() * .45, ph: Math.random() * TAU, r: .5 });
  }
  planet.position.set(target.x, target.y, 0); planet.scale.setScalar(stage.r); planetBody.material.color.setHex(stage.color); planetRing.visible = stage.key === 'jupiter';
  timeMax = 25 + nSat * 8; timeLeft = timeMax; flight = null; pulse.visible = false; sel = null;
  $('mtxt').textContent = `“${msg[0]}”`; $('mic').textContent = msg[1]; $('route').textContent = `${stage.name} · ${rnd(stage.who)}에게`;
  updateHud();
}
function reset() { score = 0; lives = LIVES; level = 1; setupLevel(); }
function start() {
  state = 'count'; $center.style.display = 'none'; $hint.style.display = '';
  Arcade.countdown({ final: '송신 준비!', onTick: n => n ? Arcade.sfx.tick() : Arcade.sfx.go(), onDone: () => { state = 'playing'; } });
}
function lost(why) {
  flight = null; pulse.visible = false; lives--; updateHud();
  Arcade.sfx.crash(); Arcade.shake(.3); Arcade.vibrate([60, 40, 100]); Arcade.toast(why, '#e03131');
  state = 'pause';
  setTimeout(() => { if (lives <= 0) return finish(); timeLeft = Math.max(timeLeft, 12); state = 'playing'; }, 1300);
}
function delivered() {
  const bonus = 250 + Math.round(timeLeft * 8) + level * 20;
  score += bonus; flight = null; pulse.visible = false; updateHud();
  ripple(target.x, target.y, 0x69db7c, 3);
  Arcade.sfx.fanfare(); Arcade.confetti({ y: innerHeight * .4, count: 100, emoji: ['📡', msg[1], '✨'] }); Arcade.vibrate([30, 30, 80]);
  Arcade.toast(`${msg[1]} 수신 완료! "${rnd(['ㅋㅋㅋ 알았어', '나도!!', '헐 대박', '고마워~', 'ㅇㅋ 수신 양호'])}" +${bonus}`, '#2b8a3e');
  state = 'pause';
  setTimeout(() => { level++; setupLevel(); state = 'playing'; }, 2000);
}
function finish() {
  state = 'over'; overAt = performance.now();
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('radio-best', best); } catch {} }
  isBest && score > 0 ? Arcade.sfx.fanfare() : Arcade.sfx.fail();
  showScreen(Arcade.resultScreen({ emoji: '📡', label: '전파 점수', score, unit: '점', msg: level > 7 ? '목성까지 닿았다! 우주 통신사에서 연락 왔어요' : level > 4 ? '화성까지 마음이 전해졌어요' : '전파가 우주로… 외계인이 읽었을지도',
    rows: [['보낸 메시지', `${level - 1}개`]], isBest: isBest && score > 0, best }));
  Arcade.gameOver(score);
}
function tapStart() {
  if (state === 'ready') start();
  else if (state === 'over' && performance.now() - overAt > 1200 && !Arcade.inRun()) { reset(); start(); }
}

// ---------- ray tracing ----------
function trace() {
  const pts = [emitPos.clone()];
  let p = emitPos.clone(), d = new THREE.Vector2(Math.cos(emitAng), Math.sin(emitAng)), lastMirror = null;
  for (let b = 0; b < 10; b++) {
    let best = 60, kind = 'out', which = null;
    for (const s of sats) {   // mirrors are segments
      if (s === lastMirror) continue;
      const a = new THREE.Vector2(Math.cos(s.ang), Math.sin(s.ang)).multiplyScalar(MIRROR_L / 2), A = s.p.clone().sub(a), B = s.p.clone().add(a);
      const e = B.clone().sub(A), den = d.x * e.y - d.y * e.x; if (Math.abs(den) < 1e-6) continue;
      const w = A.clone().sub(p), t = (w.x * e.y - w.y * e.x) / den, u = (w.x * d.y - w.y * d.x) / den;
      if (t > 1e-4 && u >= 0 && u <= 1 && t < best) { best = t; kind = 'mirror'; which = s; }
    }
    const circ = (cx, cy, r, k) => { const f = p.clone().sub(new THREE.Vector2(cx, cy)), bq = f.dot(d), c = f.lengthSq() - r * r, disc = bq * bq - c; if (disc < 0) return; const t = -bq - Math.sqrt(disc); if (t > 1e-4 && t < best) { best = t; kind = k; } };
    circ(target.x, target.y, stage.r * 1.1, 'target');
    if (sun.visible) circ(sun.position.x, sun.position.y, 1.3, 'sun');
    for (const r of rocks) circ(r.m.position.x, r.m.position.y, r.r, 'rock');
    if (b > 0) circ(EARTH.x, EARTH.y, RE, 'earth');
    const q = p.clone().addScaledVector(d, best); pts.push(q);
    if (kind === 'mirror') {
      const tv = new THREE.Vector2(Math.cos(which.ang), Math.sin(which.ang)), n = new THREE.Vector2(-tv.y, tv.x);
      d.sub(n.multiplyScalar(2 * d.dot(n))).normalize(); p = q; lastMirror = which; continue;
    }
    return { pts, hitTarget: kind === 'target', end: kind };
  }
  return { pts, hitTarget: false, end: 'out' };
}

// ---------- input: grab a satellite and twist it ----------
const ndc = new THREE.Vector2(), ray = new THREE.Raycaster(), planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hitP = new THREE.Vector3();
const toWorld = (x, y) => { ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); ray.ray.intersectPlane(planeZ, hitP); return new THREE.Vector2(hitP.x, hitP.y); };
let grab = null;
addEventListener('pointerdown', e => {
  if (e.target.closest('#send, .arcade-btn')) return;
  if (state === 'ready' || state === 'over') { tapStart(); return; }
  const w = toWorld(e.clientX, e.clientY);
  let bestS = null, bd = SAT_GRAB * 1.3;
  for (const s of sats) { const d = s.p.distanceTo(w); if (d < bd) { bd = d; bestS = s; } }
  if (bestS) { sel = bestS; grab = { s: bestS, start: Math.atan2(w.y - bestS.p.y, w.x - bestS.p.x), base: bestS.ang }; $hint.style.display = 'none'; Arcade.sfx.tap(); }
});
addEventListener('pointermove', e => {
  if (!grab) return;
  const w = toWorld(e.clientX, e.clientY), a = Math.atan2(w.y - grab.s.p.y, w.x - grab.s.p.x);
  grab.s.ang = grab.base + (a - grab.start);
});
addEventListener('pointerup', () => { grab = null; });
$send.addEventListener('click', () => sendPulse());
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); state === 'playing' ? sendPulse() : tapStart(); return; }
  if (state !== 'playing' || !sats.length) return;
  if (e.code === 'Tab') { e.preventDefault(); sel = sats[(sats.indexOf(sel) + 1) % sats.length]; }
  if (!sel) sel = sats[0];
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') sel.ang += .05;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') sel.ang -= .05;
});
function sendPulse() {
  if (state !== 'playing' || flight) return;
  const tr = trace();
  flight = { pts: tr.pts, seg: 0, u: 0, ok: tr.hitTarget, end: tr.end };
  pulse.visible = true; Arcade.sfx.whoosh(true); Arcade.sfx.note(0); Arcade.vibrate(20);
  ripple(emitPos.x, emitPos.y, 0xff6b6b);
}

function placeCamera() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const minX = EARTH.x - RE - 1, maxX = target.x + stage.r * 2.2, minY = -6.2, maxY = 6.2;
  const half = THREE.MathUtils.degToRad(camera.fov / 2), cx = (minX + maxX) / 2, cy = (minY + maxY) / 2 + .3;
  const d = Math.max((maxY - minY) / 2 / Math.tan(half) + 2, (maxX - minX) / 2 / (Math.tan(half) * camera.aspect));
  camera.position.set(cx, cy, d); camera.lookAt(cx, cy, 0);
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); placeCamera(); });

// ---------- loop ----------
let last = performance.now();
reset(); showIntro();
window.__radio = { get state() { return state; }, get sats() { return sats; }, trace, sendPulse, get level() { return level; }, get lives() { return lives; }, get score() { return score; }, get target() { return target; }, setLevel(v) { level = v; setupLevel(); } };

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  for (const r of rocks) { r.m.position.set(r.x, r.y0 + Math.sin(t * r.sp + r.ph) * r.amp, 0); r.m.rotation.x += dt; r.m.rotation.y += dt * 1.3; }
  // live laser preview
  const tr = trace(); path = tr.pts;
  const was = connected; connected = tr.hitTarget;
  if (connected && !was && state === 'playing' && !flight) { Arcade.sfx.coin(); Arcade.vibrate(25); }
  const arr = laserGeo.attributes.position.array;
  for (let i = 0; i < LASER_MAX; i++) { const p = path[Math.min(i, path.length - 1)]; arr[i * 3] = p.x; arr[i * 3 + 1] = p.y; arr[i * 3 + 2] = .05; }
  laserGeo.attributes.position.needsUpdate = true;
  laser.visible = false; drawBeam(path);
  const bc = connected ? 0x69db7c : tr.end === 'rock' ? 0xffa94d : 0xff6b6b;
  beamMat.color.setHex(bc); beamGlowMat.color.setHex(bc);
  beamMat.opacity = flight ? .25 : .75 + Math.sin(t * 8) * .15; beamGlowMat.opacity = flight ? .08 : .2 + Math.sin(t * 8) * .08;
  $send.classList.toggle('ready', connected && state === 'playing' && !flight);

  if (state === 'playing') {
    if (!flight) { timeLeft -= dt; if (timeLeft <= 0) { timeLeft = 0; lost('⏰ 통신 시간 초과!'); } }
    else {
      // the pulse travels along the path frozen at send time; asteroids can still drift into it
      let move = 9 * dt;
      while (move > 0 && flight) {
        const a = flight.pts[flight.seg], b = flight.pts[flight.seg + 1];
        if (!b) { flight.ok ? delivered() : lost(flight.end === 'sun' ? '☀️ 태양에 타버렸다!' : flight.end === 'rock' ? '☄️ 소행성에 막혔다!' : flight.end === 'earth' ? '🌏 지구로 되돌아왔다…' : '🌌 전파가 우주로 날아갔다…'); break; }
        const len = a.distanceTo(b), left = len * (1 - flight.u);
        if (move >= left) { flight.seg++; flight.u = 0; move -= left; if (flight.pts[flight.seg + 1]) { Arcade.sfx.note(Math.min(12, flight.seg + 1)); ripple(b.x, b.y, 0xffd43b); } }
        else { flight.u += move / len; move = 0; }
      }
      if (flight) {
        const a = flight.pts[flight.seg], b = flight.pts[flight.seg + 1] || a, p = a.clone().lerp(b, flight.u);
        pulse.position.set(p.x, p.y, .12);
        for (const r of rocks) if (r.m.position.distanceTo(pulse.position) < r.r + .2) { lost('☄️ 소행성에 부딪혔다!'); break; }
      }
    }
  }
  $('tfill').style.transform = `scaleX(${timeLeft / timeMax})`;
  for (const s of sats) {
    s.g.rotation.z = s.ang;
    s.ring.material.opacity = s === sel || s === grab?.s ? .6 : .2 + Math.sin(t * 3) * .08;
    s.mirror.material.emissiveIntensity = .5 + (s === grab?.s ? .6 : 0);
  }
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; r.m.scale.setScalar(1 + r.t * 6 * r.m.userData.s); r.m.material.opacity = .9 * (1 - r.t / .6); if (r.t > .6) { scene.remove(r.m); rings.splice(i, 1); } }
  earth.rotation.y += dt * .08; planetBody.rotation.y += dt * .15;
  planetAim.material.opacity = connected ? .9 : .35 + Math.sin(t * 4) * .2; planetAim.material.color.setHex(connected ? 0x69db7c : 0xffffff);
  sunGlow.scale.setScalar(1 + Math.sin(t * 3) * .05); pulseGlow.scale.setScalar(1 + Math.sin(t * 20) * .2);
  placeCamera();
  Arcade.applyShake(camera, dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
