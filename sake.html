  const dt = Math.min(.1, (now - last) / 1000); last = now; const t = now / 1000;
  if (state === 'playing') {
    if (cupState === 'slide') { cupGroup.position.x += (0 - cupGroup.position.x) * Math.min(1, dt * 9); if (Math.abs(cupGroup.position.x) < .01) { cupGroup.position.x = 0; cupState = 'pour'; } }
    // bottle tilt follows the hold; flow ramps with tilt and how long you've held
    const want = holding && cupState === 'pour' ? 1 : 0;
    tilt += (want - tilt) * Math.min(1, dt * (want ? 5 : 9));
    if (holding && cupState === 'pour') holdT += dt; else holdT = 0;
    const flow = tilt > .35 ? (tilt - .35) / .65 * (.1 + Math.min(.62, holdT * holdT * .22 + holdT * .08) + Math.min(.12, cupNo * .01)) * cup.speed   /* accelerates the longer you hold */ : 0;   // cup-fulls per second
    flowNow += (flow - flowNow) * Math.min(1, dt * 10);
    if (flow > 0) inAir.push({ amt: flow * dt, t: FALL_T });
    let arrived = 0;
    for (const p of inAir) p.t -= dt;
    while (inAir.length && inAir[0].t <= 0) arrived += inAir.shift().amt;
    if (arrived > 0 && !spilled) {
      level += arrived;
      sloshV += (Math.random() - .5) * arrived * 25; slosh2V += (Math.random() - .5) * arrived * 25;   // impact makes waves
      pourT += dt;
      const n = Math.floor(level * 8);   // 도레미파솔라시도
      if (n > lastNote && n <= 7) { lastNote = n; Arcade.sfx.note(n); }
      if (level > 1 && Math.random() < dt * 9) Arcade.sfx.note(8 + ((Math.random() * 3) | 0), .1);   // trembling high notes on the dome
    }
    Arcade.sfx.pour(inAir.length ? Math.min(1, flow * 2 + .3) : 0, Math.min(1, level));
    // sloshing (damped springs)
    sloshV += -slosh * 60 * dt - sloshV * 3 * dt; slosh += sloshV * dt;
    slosh2V += -slosh2 * 55 * dt - slosh2V * 3 * dt; slosh2 += slosh2V * dt;
    const wave = (Math.abs(slosh) + Math.abs(slosh2)) * .045 * (cup.rt / .3);
    if (!spilled && cupState !== 'judged' && level + wave > limit) spill();
    if (cupState === 'pour' && !holding && !inAir.length && level > 0) { judgeT += dt; if (judgeT > .6) judge(); } else judgeT = 0;
    // HUD percentage
    if (level > 0 && !spilled) { $pct.textContent = `${Math.round(level * 100)}%`; $pct.className = `hud-ctl on ${level > 1 ? 'tension' : ''}`; }
  } else Arcade.sfx.pour(0);

  // bottle pose + stream
  bottle.rotation.z = -.5 - tilt * (1.55 + Math.min(.45, holdT * .25));
  bottle.position.set(BOTTLE_PIVOT.x + tilt * .3, BOTTLE_PIVOT.y - tilt * .12, 0);
  bottle.updateMatrixWorld(); spout.set(0, .62, 0); bottle.localToWorld(spout);
  const surfaceY = cupBaseY + cup.h * Math.min(level, 1) + .02;
  const flowing = state === 'playing' && inAir.length > 0;
  stream.visible = flowing;
  if (flowing) {
    const top = holding && tilt > .35 ? spout.clone() : new THREE.Vector3(spout.x, spout.y - (FALL_T - (inAir[inAir.length - 1]?.t || 0)) / FALL_T * (spout.y - surfaceY), spout.z);
    const bot = new THREE.Vector3(cupGroup.position.x + Math.sin(t * 20) * .01, surfaceY, 0);
    const lowest = inAir[0]; const arrivedFrac = lowest ? 1 - lowest.t / FALL_T : 1;
    if (!(holding && tilt > .35) && inAir.length) bot.y = surfaceY;
    // arcing stream: leaves the spout sideways, curves down under gravity, wobbles and thins as it falls
    const ctrl = new THREE.Vector3(top.x + (bot.x - top.x) * .85, top.y - .05, 0);
    const pts = []; for (let i = 0; i <= 18; i++) { const u = i / 18; const p = new THREE.Vector3().copy(top).multiplyScalar((1 - u) * (1 - u)).addScaledVector(ctrl, 2 * u * (1 - u)).addScaledVector(bot, u * u); p.x += Math.sin(u * 12 - t * 30) * .006 * u; p.z += Math.cos(u * 10 - t * 26) * .006 * u; pts.push(p); }
    const thick = .012 + Math.min(.035, flowNow * .05);
    stream.geometry.dispose(); stream.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 16, thick, 6, false);
    // impact: ripples on the surface, rising bubbles, a few splash droplets
    if (Math.random() < dt * 14) ripples.push({ x: (bot.x - cupGroup.position.x) / Math.max(.05, cup.rt), y: 0, t: 0, amp: .02 + flowNow * .03 });
    if (bubbles.length < 40 && Math.random() < .5) { const b = new THREE.Mesh(bubGeo, bubMat); b.scale.setScalar(.012 + Math.random() * .014); b.position.set(bot.x + (Math.random() - .5) * .08, bot.y - .02 - Math.random() * cup.h * Math.min(level, 1) * .6, (Math.random() - .5) * .08); scene.add(b); bubbles.push({ m: b, t: 0, top: bot.y - .01 }); }
    if (drops.length < 30 && Math.random() < .35) { const d = new THREE.Mesh(dropGeo, streamMat2); d.position.set(bot.x + (Math.random() - .5) * .1, bot.y, (Math.random() - .5) * .1); scene.add(d); drops.push({ m: d, v: new THREE.Vector3((Math.random() - .5) * .7, .6 + Math.random() * .8, (Math.random() - .5) * .7), t: 0 }); }
  }
  for (let i = bubbles.length - 1; i >= 0; i--) { const b = bubbles[i]; b.t += dt; b.m.position.y += dt * (.35 + b.t * .6); b.m.position.x += Math.sin(b.t * 20) * .002; b.m.scale.multiplyScalar(1 - dt * .6);
    if (b.m.position.y > b.top || b.t > 1.2) { scene.remove(b.m); bubbles.splice(i, 1); } }
  for (const rp of ripples) rp.t += dt; ripples = ripples.filter(rp => rp.t < 1.4).slice(-10);
  for (let i = drops.length - 1; i >= 0; i--) { const d = drops[i]; d.t += dt; d.v.y -= 9 * dt; d.m.position.addScaledVector(d.v, dt); if (d.t > .35) { scene.remove(d.m); drops.splice(i, 1); } }
  if (liquid) drawLiquid();
  if (spilled && spillSheet) { spillSheet.visible = true; spillSheet.scale.y = Math.min(1, spillSheet.scale.y + dt * 3); spillSheet.position.y = cupBaseY + cup.h - spillSheet.scale.y * cup.h / 2; }
  else if (spillSheet) spillSheet.scale.y = .01;

  Arcade.applyShake(camera, dt);
  renderer.render(scene, camera);
  placeCamera();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
