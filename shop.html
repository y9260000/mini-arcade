{ const h = new THREE.Mesh(new THREE.TorusGeometry(.12, .025, 4, 10, Math.PI), flat(0xe64980)); h.position.y = .53; sbMesh.add(h); }

  }
  s.cone.geometry.attributes.position.needsUpdate = true;
  s.cone.material.color.setHex(s.mode === 'approach' ? 0xff3b3b : s.notice > .05 ? 0xff7a1a : 0xffb000);
  s.cone.material.opacity = s.mode === 'cool' || s.mode === 'talk' ? .1 : .38 + s.notice * .3;
}

// ---------- state ----------
let state = 'ready', score = 0, floorN = 1, battery = 100, overAt = 0, levelT = 0, frozenT = 0, frozen = false, talking = null, sbT = 0, store = STORES[0];
let P = { x: 0, y: 0, dir: null, next: null, speed: 3.4 }, staff = [], crowd = [];
let best = 0; try { best = +localStorage.getItem('shop-best') || 0; } catch {}
const $score = $('score'), $lvl = $('lvl'), $goal = $('goal'), $center = $('center'), $bubble = $('bubble'), $bt = $bubble.firstElementChild, $state = $('state'), $hint = $('hint');
const showScreen = html => { $center.innerHTML = html; $center.style.display = ''; };
const showIntro = () => showScreen(Arcade.titleScreen({ emoji: '🛍️', title: '도와드릴까요?', how: [
  ['🎒', '탈의실에서 나왔더니 가방이 없다! <b>가방 찾아 출구로</b>'],
  ['👀', '직원 <b>시야(노란 부채꼴)</b>에 오래 있으면 눈치채고 말 걸러 와요'],
  ['✋', '꾹 누르면 <b>마네킹인 척</b>. 너무 오래 서 있으면 의심받아요'],
  ['🔋', '<b>소셜 배터리</b>가 0이면 니트 3벌 사고 귀가. 🟩 구석 벤치에서 충전'],
] }));
function updateHud() {
  $score.innerHTML = `${score}<small>점</small>`;
  $('batf').style.width = `${battery}%`; $('batf').style.background = battery < 25 ? '#fa5252' : battery < 55 ? '#fcc419' : '#51cf66';
  $('batp').textContent = `${Math.ceil(battery)}%`; $('bat').classList.toggle('low', battery < 25);
  $lvl.textContent = `${floorN}층 ${store.name}`;
  $('goal').textContent = bag.held ? '🚪 출구로!' : '🎒 가방 찾기'; $('goal').classList.toggle('go', bag.held);
}
function openTiles() { const a = []; for (let r = 1; r < N - 1; r++) for (let c = 1; c < N - 1; c++) if (G[r][c] === '.') a.push([c, r]); return a; }
function setupFloor() {
  store = STORES[(floorN - 1) % STORES.length];
  generate(store); buildWorld(store);
  const d = bfs(START), tiles = openTiles(), maxD = Math.max(...tiles.map(([c, r]) => d.get(key(c, r)) || 0));
  const far = tiles.filter(([c, r]) => (d.get(key(c, r)) || 0) >= maxD * .55 && r < N - 3);
  const bt = rnd(far.length ? far : tiles); Object.assign(bag, { c: bt[0], r: bt[1], held: false });
  bagMesh.visible = true; bagMesh.position.set(W(bag.c), 0, Z(bag.r)); myBag.visible = false;
  const mid = tiles.filter(([c, r]) => { const v = d.get(key(c, r)) || 0; return v > 3 && v < maxD * .6 && !(c === bag.c && r === bag.r); });
  const st = rnd(mid.length ? mid : tiles); Object.assign(sbag, { c: st[0], r: st[1], taken: false }); sbMesh.visible = true; sbMesh.position.set(W(sbag.c), 0, Z(sbag.r));
  P = { x: START[0], y: START[1], dir: null, next: null, speed: 3.4 };
  frozen = false; talking = null; sbT = 0; mySB.visible = false; levelT = 0;
  // staff
  for (const s of staff) { scene.remove(s.p.root); scene.remove(s.cone); }
  staff = [];
  const n = Math.min(5, 1 + floorN), spots = tiles.filter(([c, r]) => (d.get(key(c, r)) || 0) >= 5);
  for (let i = 0; i < n; i++) {
    const [c, r] = rnd(spots);
    const s = { x: c, y: r, dir: null, speed: 1.5 + floorN * .1, p: makePerson({ ...STAFF_STYLE[i % STAFF_STYLE.length], scale: .62 }), cone: makeCone(), i,
      mode: 'patrol', target: rnd(tiles), lookT: 0, yaw: Math.random() * 6.28, baseYaw: 0, notice: 0, seenFrozen: 0, coolT: 0, lostT: 0, range: Math.min(5.5, 3.6 + floorN * .3), line: rnd(store.lines) };
    staff.push(s);
  }
  for (const c of crowd) scene.remove(c.p.root);
  crowd = [];
  if (store.crowd) for (let i = 0; i < 4; i++) { const [c, r] = rnd(tiles); crowd.push({ x: c, y: r, dir: null, speed: 1.2, p: makePerson({ top: rnd(COLORS), hair: 0x3b2316, scale: .5 }) }); }
  updateHud();
}
function reset() { score = 0; floorN = 1; battery = 100; setupFloor(); }
function start() {
  state = 'count'; $center.style.display = 'none'; $hint.style.display = '';
  Arcade.countdown({ final: '살금살금!', onTick: n => n ? Arcade.sfx.tick() : Arcade.sfx.go(), onDone: () => { state = 'playing'; } });
}
function escaped() {
  state = 'clear'; frozenT = 2;
  const bonus = 300 + Math.round(battery * 2) + Math.max(0, Math.round(150 - levelT * 3));
  score += bonus; battery = Math.min(100, battery + 25); updateHud();
  Arcade.sfx.fanfare(); Arcade.confetti({ y: innerHeight * .4, count: 100, emoji: ['🛍️', '🏃', '🎒'] }); Arcade.vibrate([30, 30, 80]);
  Arcade.toast(`🏃 탈출 성공! +${bonus} · 🔋+25`, '#2b8a3e');
}
function finish() {
  state = 'over'; overAt = performance.now(); $bubble.style.display = 'none'; $state.style.display = 'none';
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('shop-best', best); } catch {} }
  isBest && score > 0 ? Arcade.sfx.fanfare() : Arcade.sfx.fail();
  showScreen(Arcade.resultScreen({ emoji: '🫠', label: '도망 점수', score, unit: '점', msg: '🔋 방전… 결국 니트 3벌 사서 나왔습니다',
    rows: [['탈출한 매장', `${floorN - 1}곳`], ['마지막 매장', store.name]], isBest: isBest && score > 0, best }));
  Arcade.gameOver(score);
}
function tapStart() {
  if (state === 'ready') start();
  else if (state === 'over' && performance.now() - overAt > 1200 && !Arcade.inRun()) { reset(); start(); }
}

// ---------- staff brain ----------
function seesPlayer(s) {
  const dx = P.x - s.x, dy = P.y - s.y, d = Math.hypot(dx, dy);
  if (d > s.range || d < .01) return d < .01;
  let da = Math.atan2(dx, dy) - s.yaw; da = Math.atan2(Math.sin(da), Math.cos(da));
  return Math.abs(da) <= HALF && lineOfSight(s.x, s.y, P.x, P.y);
}
const yawOf = d => ({ down: 0, up: Math.PI, right: Math.PI / 2, left: -Math.PI / 2 })[d];
function updateStaff(s, dt, t) {
  if (s.mode === 'talk') return;
  if (s.mode === 'cool') { s.coolT -= dt; if (s.coolT <= 0) s.mode = 'patrol'; }
  const sees = s.mode !== 'cool' && !talking && seesPlayer(s);
  if (s.mode === 'patrol' || s.mode === 'look') {
    if (sees) {
      let rate = 1 / .75;
      if (frozen) { rate *= .12; s.seenFrozen += dt; if (s.seenFrozen > 2.4) { s.notice = 1; s.line = '어? 이 마네킹 처음 보는데…'; } }
      if (sbT > 0) rate *= .45;
      s.notice = Math.min(1, s.notice + dt * rate);
      if (s.notice >= 1) { s.mode = 'approach'; s.lostT = 0; Arcade.sfx.hmm(); Arcade.vibrate(30); if (s.line.startsWith('어?')) Arcade.toast('🧍 마네킹 들킴!', '#e8590c'); }
    } else { s.notice = Math.max(0, s.notice - dt * .6); s.seenFrozen = Math.max(0, s.seenFrozen - dt); }
  }
  if (s.mode === 'approach') {
    if (sees || Math.hypot(P.x - s.x, P.y - s.y) < 2) s.lostT = 0; else s.lostT += dt;
    if (s.lostT > 2.2) { s.mode = 'patrol'; s.notice = 0; s.target = [Math.round(s.x), Math.round(s.y)]; s.line = rnd(store.lines); Arcade.toast('🤷 "어디 가셨지…?"', '#868e96'); }
    if (Math.hypot(P.x - s.x, P.y - s.y) < .75) startTalk(s);
  }
  // movement
  const speed = s.mode === 'approach' ? 2.9 + floorN * .12 : s.speed;
  if (s.mode === 'look') { s.lookT -= dt; s.yaw = s.baseYaw + Math.sin(t * 1.8 + s.i) * 1.1; if (s.lookT <= 0) { s.mode = 'patrol'; s.target = rnd(openTiles()); } return; }
  const sp = s.speed; s.speed = speed;
  stepMover(s, dt, 'staff', (c, r) => {
    const [tc, tr] = s.mode === 'approach' ? [Math.round(P.x), Math.round(P.y)] : s.target;
    if (s.mode !== 'approach' && c === tc && r === tr) { s.mode = 'look'; s.lookT = 1.4 + Math.random() * 1.4; s.baseYaw = s.yaw; return null; }
    return pathStep(c, r, tc, tr);
  });
  s.speed = sp;
  if (s.dir && s.moving) { const ty = yawOf(s.dir); let dy = ty - s.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); s.yaw += dy * Math.min(1, dt * 10); }
}
function startTalk(s) {
  talking = s; s.mode = 'talk'; s.talkT = 1.6; frozen = false; P.dir = null; P.next = null;
  battery = Math.max(0, battery - 28); updateHud();
  Arcade.sfx.hmm(); Arcade.shake(.2); Arcade.vibrate([60, 40, 100]);
  Arcade.toast(rnd(EXCUSES), '#495057');
}

// ---------- input: swipe to walk, tap to stop, hold = mannequin ----------
let ptr = null, keyDir = null, spaceHeld = false;
addEventListener('pointerdown', e => { if (state === 'ready' || state === 'over') { tapStart(); return; } ptr = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false }; });
addEventListener('pointermove', e => {
  if (!ptr) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  if (Math.hypot(dx, dy) < 22) return;
  P.next = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.moved = true; frozen = false; $hint.style.display = 'none';
});
addEventListener('pointerup', () => {
  if (ptr && !ptr.moved && performance.now() - ptr.t < 250 && !frozen) { P.next = null; P.stop = true; }
  if (frozen && !spaceHeld) { frozen = false; }
  ptr = null;
});
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { e.preventDefault(); keyDir = KEYMAP[e.code]; P.next = keyDir; frozen = false; spaceHeld = false; $hint.style.display = 'none'; }
  else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (state === 'playing') { spaceHeld = true; } else tapStart(); }
});
addEventListener('keyup', e => {
  if (KEYMAP[e.code] === keyDir) { keyDir = null; P.next = null; P.stop = true; }
  if (e.code === 'Space') { spaceHeld = false; frozen = false; }
});

function placeCamera() {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 55 : 42; camera.updateProjectionMatrix();
  const half = Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
  const d = Math.max((N / 2 + .6) / Math.tan(half), (N / 2 + 3.2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  camera.position.set(0, d * .92, d * .38); camera.lookAt(0, 0, -1.1);
}
placeCamera();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); placeCamera(); });

// ---------- loop ----------
const tmpV = new THREE.Vector3();
function bubbleAt(x, y, cls, text) {
  tmpV.set(W(x), 1.25, Z(y)).project(camera);
  $bubble.style.display = 'block'; $bubble.style.transform = `translate(${(tmpV.x * .5 + .5) * innerWidth}px,${(-tmpV.y * .5 + .5) * innerHeight}px)`;
  $bubble.className = `hud-ctl ${cls}`; if ($bt.textContent !== text) $bt.textContent = text;
}
let last = performance.now();
reset(); showIntro();
window.__shop = { get state() { return state; }, get P() { return P; }, staff: () => staff, bag, get battery() { return battery; }, get floorN() { return floorN; }, get score() { return score; }, G: () => G, START: () => START,
  teleport(c, r) { P.x = c; P.y = r; P.dir = null; }, freeze(v) { frozen = v; spaceHeld = v; } };

function frame(now) {
  const dt = Math.min(.04, (now - last) / 1000); last = now; const t = now / 1000;
  if (state === 'playing') {
    levelT += dt;
    // mannequin: hold still (touch) or Space
    if ((ptr && !ptr.moved && now - ptr.t > 250) || spaceHeld) { if (!frozen) { frozen = true; Arcade.sfx.tap(); Arcade.vibrate(15); } }
    if (talking) {
      talking.talkT -= dt;
      if (talking.talkT <= 0) { talking.mode = 'cool'; talking.coolT = 4; talking.notice = 0; talking.target = rnd(openTiles()); talking.line = rnd(store.lines); talking = null; }
    } else if (!frozen) stepMover(P, dt, 'me');
    const pc = Math.round(P.x), pr = Math.round(P.y);
    if (Math.abs(P.x - pc) < .3 && Math.abs(P.y - pr) < .3) {
      if (!bag.held && pc === bag.c && pr === bag.r) { bag.held = true; bagMesh.visible = false; myBag.visible = true; score += 100; Arcade.sfx.perfect(4); Arcade.vibrate([20, 30, 40]); Arcade.toast('🎒 내 가방! 이제 출구로 살금살금', '#7048e8'); }
      if (!sbag.taken && pc === sbag.c && pr === sbag.r) { sbag.taken = true; sbMesh.visible = false; sbT = 9; mySB.visible = true; score += 50; Arcade.sfx.coin(); Arcade.toast('🛍️ 쇼핑백 위장! 이미 산 사람인 척 (9초)', '#e64980'); }
      if (bag.held && pc === EXIT[0] && pr === EXIT[1]) escaped();
    }
    if (sbT > 0) { sbT -= dt; if (sbT <= 0) mySB.visible = false; }
    for (const s of staff) updateStaff(s, dt, t);
    for (const c of crowd) stepMover(c, dt, 'staff', (cc, rr) => { const o = Object.keys(DIRS).filter(d => passable(cc + DIRS[d][0], rr + DIRS[d][1], 'staff') && d !== OPP[c.dir]); return o.length ? rnd(o) : rnd(Object.keys(DIRS).filter(d => passable(cc + DIRS[d][0], rr + DIRS[d][1], 'staff'))); });
    // social battery
    let drain = .35;
    for (const s of staff) if (s.mode !== 'talk' && Math.hypot(s.x - P.x, s.y - P.y) < 2.2) drain += 3;
    for (const c of crowd) if (Math.hypot(c.x - P.x, c.y - P.y) < 1.6) drain += 2.5;
    const resting = restTiles.some(([c, r]) => Math.abs(P.x - c) < .45 && Math.abs(P.y - r) < .45);
    battery = Math.max(0, Math.min(100, battery + (resting ? 14 : -drain) * dt));
    if (battery <= 0) finish();
    updateHud();
    // HUD: the most alert staff gets the bubble
    const alert = staff.filter(s => s.notice > .05 || s.mode === 'approach' || s.mode === 'talk').sort((a, b) => (b.mode === 'talk') - (a.mode === 'talk') || b.notice - a.notice)[0];
    if (alert) bubbleAt(alert.x, alert.y, alert.mode === 'talk' ? 'talk' : alert.mode === 'approach' ? 'alert' : '', alert.mode === 'talk' || alert.mode === 'approach' ? alert.line : alert.notice > .6 ? '…!?' : '…?');
    else $bubble.style.display = 'none';
    const st = talking ? '😶 대화 중… 🔋 쭉쭉 닳는 중' : frozen ? '🧍 마네킹인 척…' : resting ? '🟩 혼자만의 시간 (충전 중)' : sbT > 0 ? `🛍️ 이미 산 사람 위장 ${Math.ceil(sbT)}` : '';
    $state.style.display = st ? 'block' : 'none'; if (st) $state.textContent = st;
  } else if (state === 'clear') {
    frozenT -= dt;
    if (frozenT <= 0) { floorN++; setupFloor(); state = 'playing'; Arcade.toast(`🛗 ${floorN}층 · ${store.name}`, '#2b2438'); }
  }

  // visuals
  const face = (p, m, yaw) => { let d = yaw - p.root.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); p.root.rotation.y += d * .3; };
  const walk = (p, moving, sp) => { const ph = t * sp; p.legs[0].rotation.x = moving ? Math.sin(ph) * .7 : 0; p.legs[1].rotation.x = moving ? -Math.sin(ph) * .7 : 0; };
  me.root.position.set(W(P.x), 0, Z(P.y)); walk(me, P.moving && !frozen && !talking && state === 'playing', 14);
  if (P.dir) face(me, P, yawOf(P.dir));
  me.head.rotation.x = frozen ? 0 : .25;
  me.arms.forEach((a, i) => { a.rotation.z = frozen ? (i ? -1.2 : 1.2) : 0; a.rotation.x = frozen ? -.3 : 0; });   // stiff mannequin pose
  me.body.rotation.z = talking ? Math.sin(t * 25) * .04 : 0;
  meRing.position.set(W(P.x), .03, Z(P.y)); meRing.material.color.setHex(frozen ? 0xadb5bd : sbT > 0 ? 0xf783ac : 0xffd43b);
  for (const s of staff) {
    s.p.root.position.set(W(s.x), 0, Z(s.y)); walk(s.p, s.moving && s.mode !== 'look' && s.mode !== 'talk', 11);
    const yawToMe = Math.atan2(P.x - s.x, P.y - s.y);
    s.p.root.rotation.y = s.mode === 'talk' ? yawToMe : s.yaw;
    s.p.arms[1].rotation.x = s.mode === 'approach' || s.mode === 'talk' ? -2.2 + Math.sin(t * 8) * .3 : 0;
    updateCone(s);
  }
  for (const c of crowd) { c.p.root.position.set(W(c.x), 0, Z(c.y)); walk(c.p, c.moving, 9); if (c.dir) face(c.p, c, yawOf(c.dir)); }
  bagMesh.rotation.y += dt; bagGlow.material.opacity = .5 + Math.sin(t * 6) * .3; sbMesh.rotation.y -= dt * 1.5;
  if (doorMat) { doorMat.color.setHex(bag.held ? 0x8ce99a : 0xa5d8ff); exitSign.material.color.setHex(bag.held ? 0x2f9e44 : 0xe03131); }

  Arcade.applyShake(camera, dt);
  renderer.render(scene, camera);
  placeCamera();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
