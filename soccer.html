<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>슛 말고!</title>
<script src="common.js?v=12"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#3a8f3e;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #cast{position:fixed;left:50%;top:max(132px,calc(env(safe-area-inset-top) + 122px));transform:translateX(-50%);z-index:3;pointer-events:none;
    display:flex;align-items:center;gap:10px;background:rgba(20,24,40,.9);color:#fff;border-radius:18px;padding:8px 16px 8px 10px;max-width:calc(100% - 32px);box-sizing:border-box;
    box-shadow:0 8px 24px rgba(0,0,0,.35);transition:background .1s}
  #cast .mic{font-size:30px;flex:none}
  #cast .who{font:700 11px "Noto Sans KR",sans-serif;opacity:.7}
  #cast .line{font-family:"Jua",sans-serif;font-size:clamp(20px,5.4vw,28px);line-height:1.15;white-space:nowrap}
  #cast.warn{background:#f59f00;animation:shk .1s linear infinite}
  #cast.shout{background:#e03131;transform:translateX(-50%) scale(1.15);animation:shk .07s linear infinite}
  #cast.shout .line{font-size:clamp(28px,8vw,42px)}
  #cast.goal{background:#2b8a3e}
  @keyframes shk{25%{margin-left:-3px}75%{margin-left:3px}}
  .toast{top:60%}
  #hint{position:fixed;bottom:max(13vh,80px);left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
  #hint .pill{font-size:15px;padding:10px 18px}
  #bug{font-family:"Jua",sans-serif;letter-spacing:1px}
</style>
</head>
<body>
<div class="hud">
  <div id="score" class="hud-score">0<small>골</small></div>
  <div class="hud-row"><span class="pill dark" id="bug">⚽ 1번째 공격</span><span class="pill" id="lives"></span></div>
</div>
<div id="cast" class="hud-ctl"><div class="mic">🎙️</div><div><div class="who">캐스터 · 생중계</div><div class="line" id="line">자 경기 시작합니다!</div></div></div>
<div id="hint" class="hud-ctl"><span class="pill">👆 캐스터가 <b>"슛!" 안 할 때</b> 탭해서 슛</span></div>
<div class="screen" id="center"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $ = id => document.getElementById(id);

// ---------- three ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ff);
scene.fog = new THREE.Fog(0x9fd3ff, 40, 90);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, .1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7a3a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(8, 20, 12); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 25, bottom: -10, near: 1, far: 60 });
scene.add(sun);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, flatShading: true, ...extra });
const box = (w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m; };

const crowd = [];
// pitch: goal line at z = 0, the attacker runs in from +z
{
  const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d');
  for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#3f9a43' : '#47a84b'; g.fillRect(0, i * 32, 64, 32); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 3); t.colorSpace = THREE.SRGBColorSpace;
  const pitch = new THREE.Mesh(new THREE.PlaneGeometry(60, 80), new THREE.MeshStandardMaterial({ map: t, roughness: 1 }));
  pitch.rotation.x = -Math.PI / 2; pitch.position.z = 20; pitch.receiveShadow = true; scene.add(pitch);
  const line = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const strip = (w, d, x, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), line); m.rotation.x = -Math.PI / 2; m.position.set(x, .01, z); scene.add(m); };
  strip(40, .12, 0, 0); strip(16, .12, 0, 7); strip(.12, 7, -8, 3.5); strip(.12, 7, 8, 3.5);
  strip(7, .12, 0, 2.5); strip(.12, 2.5, -3.5, 1.25); strip(.12, 2.5, 3.5, 1.25);
  const spot = new THREE.Mesh(new THREE.CircleGeometry(.12, 10), line); spot.rotation.x = -Math.PI / 2; spot.position.set(0, .011, 5.2); scene.add(spot);
  // goal
  const post = flat(0xffffff, { roughness: .4 });
  const GW = 5.4, GH = 2.2;
  for (const s of [-1, 1]) box(.14, GH, .14, post, s * GW / 2, GH / 2, 0);
  box(GW + .14, .14, .14, post, 0, GH, 0);
  const net = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(GW, GH, 1.6, 12, 6, 4)), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .55 }));
  net.position.set(0, GH / 2, -.8); scene.add(net); window.__net = net;
  // stands with a crowd behind the goal
  const crowdCols = [0xff6b6b, 0x4dabf7, 0xffd43b, 0xffffff, 0x69db7c, 0xe64980];
  for (let r = 0; r < 6; r++) {
    box(44, .5, 1.4, flat(0x868e96), 0, .25 + r * .7, -6 - r * 1.4);
    for (let i = -20; i <= 20; i += 1.1) if (Math.random() < .8) {
      const f = box(.5, .7, .4, flat(crowdCols[(Math.random() * crowdCols.length) | 0]), i + Math.random() * .3, .85 + r * .7, -6 - r * 1.4);
      f.userData.ph = Math.random() * 6; crowd.push(f);
    }
  }
  // ad boards
  const adc = ['#e03131', '#1971c2', '#f59f00', '#2b8a3e'];
  for (let i = -5; i <= 5; i++) box(3.8, .8, .1, flat(new THREE.Color(adc[(i + 5) % 4]).getHex()), i * 4, .4, -4);
}
const GOAL_W = 5.4, GOAL_H = 2.2;

// ---------- people ----------
function makePlayer(shirt, shorts, skin = 0xffd2a8, hair = 0x2b2b2b) {
  const root = new THREE.Group();
  const legs = [-1, 1].map(s => { const p = new THREE.Group(); p.position.set(s * .15, .85, 0); box(.2, .45, .22, flat(shorts), 0, -.2, 0, p); box(.18, .42, .2, flat(skin), 0, -.6, 0, p); box(.22, .12, .34, flat(0x222222), 0, -.82, .05, p); root.add(p); return p; });
  const body = box(.62, .72, .36, flat(shirt), 0, 1.25, 0, root);
  const arms = [-1, 1].map(s => { const p = new THREE.Group(); p.position.set(s * .4, 1.55, 0); box(.16, .62, .18, flat(shirt), 0, -.3, 0, p); const h = new THREE.Mesh(new THREE.DodecahedronGeometry(.1, 0), flat(skin)); h.position.y = -.66; p.add(h); root.add(p); return p; });
  const head = new THREE.Group(); head.position.y = 1.62; root.add(head);
  box(.42, .44, .4, flat(skin), 0, .22, 0, head); box(.46, .14, .44, flat(hair), 0, .48, 0, head);
  for (const s of [-1, 1]) box(.06, .07, .02, flat(0x222222), s * .1, .26, .205, head);
  root.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { root, legs, arms, head, body };
}
const me = makePlayer(0xe03131, 0xffffff); me.root.rotation.y = Math.PI; scene.add(me.root);   // runs toward -z
const num = box(.3, .3, .01, flat(0xffffff), 0, 1.3, -.19, me.root);
const keeper = makePlayer(0xfcc419, 0x212529); scene.add(keeper.root);
for (const a of keeper.arms) { const glove = new THREE.Mesh(new THREE.DodecahedronGeometry(.13, 0), flat(0x51cf66)); glove.position.y = -.68; a.add(glove); }
const defender = makePlayer(0x1971c2, 0x1971c2); scene.add(defender.root);
const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(.17, 0), flat(0xffffff)); ball.castShadow = true; scene.add(ball);
{ const patches = new THREE.Mesh(new THREE.IcosahedronGeometry(.172, 0), new THREE.MeshBasicMaterial({ color: 0x222222, wireframe: true })); ball.add(patches); }

// ---------- caster lines ----------
const SHOUTS = ['슛!!!', '슛!!!!!', '때려요!!', '지금!! 슛!!', '슈우우웃!!', '차요 차!!'];
const FAKES = ['…슈퍼 플레이네요~', '…슈크림 먹고 싶네요', '…슈퍼스타 등장!', '…슈렉 닮았네요', '…슈팅 각 재는 중!'];
const FILLER = ['드리블~ 드리블~', '아 좋습니다', '침착하게…', '수비 하나 제칩니다!', '관중들 일어섭니다!', '숨 막히는 순간…', '아 이거…', '스피드 좋네요!'];

// ---------- state ----------
const LIVES = 3, START_Z = 17, TACKLE_Z = 3.2;
let state = 'ready', goals = 0, lives = LIVES, attack = 0, overAt = 0;
let pz = START_Z, px = 0, runV = 3, phase = 'run', phaseT = 0, castMode = 'filler', castT = 0, castLine = '', fakeNext = false;
let shot = null, keeperDive = 0, keeperTarget = 0, netShake = 0, streak = 0;
let best = 0; try { best = +localStorage.getItem('soccer-best') || 0; } catch {}
const $score = $('score'), $lives = $('lives'), $bug = $('bug'), $cast = $('cast'), $line = $('line'), $center = $('center'), $hint = $('hint');
const showScreen = html => { $center.innerHTML = html; $center.style.display = ''; };
const showIntro = () => showScreen(Arcade.titleScreen({ emoji: '⚽', title: '슛 말고!', how: [
  ['🎙️', '캐스터가 쉴 새 없이 <b>"슛!!"</b>을 외쳐요'],
  ['🧤', '키퍼는 캐스터 말을 듣고 막아요. <b>"슛!" 할 때 차면 선방</b>'],
  ['⚽', '캐스터가 <b>딴소리할 때</b> 탭해서 슛 → 골!'],
  ['🟨', '"슈…"는 페이크일 수도. 너무 오래 끌면 태클당해요'],
] }));
const rnd = a => a[(Math.random() * a.length) | 0];
function updateHud() {
  $score.innerHTML = `${goals}<small>골</small>`;
  $lives.textContent = '❤️'.repeat(lives) + '🤍'.repeat(LIVES - lives);
  $bug.textContent = `⚽ ${attack + 1}번째 공격`;
}
function setCast(mode, line, t) {
  castMode = mode; castLine = line; castT = t;
  $line.textContent = line;
  $cast.className = `hud-ctl ${mode === 'shout' ? 'shout' : mode === 'warn' ? 'warn' : mode === 'goal' ? 'goal' : ''}`;
  if (mode === 'shout') { Arcade.sfx.shout(); Arcade.vibrate(15); }
  if (mode === 'warn') Arcade.sfx.hmm();
}
const lvl = () => Math.min(1, attack / 12);
function nextCast() {
  // the caster never shuts up; gaps get shorter as attacks go on
  if (castMode === 'shout' || castMode === 'fake') return setCast('filler', rnd(FILLER), .45 + Math.random() * (1.1 - lvl() * .6));
  if (castMode === 'warn') return fakeNext ? setCast('fake', rnd(FAKES), .7 + Math.random() * .4) : setCast('shout', rnd(SHOUTS), .55 + Math.random() * (.35 + lvl() * .45));
  if (Math.random() < .3 + lvl() * .15) { fakeNext = Math.random() < .5; return setCast('warn', '슈…', .45 - lvl() * .1); }
  return setCast('shout', rnd(SHOUTS), .55 + Math.random() * (.35 + lvl() * .45));
}
function newAttack() {
  pz = START_Z; px = (Math.random() - .5) * 4; runV = 2.6 + lvl() * 1.6; phase = 'run'; phaseT = 0; shot = null; keeperDive = 0;
  keeper.root.position.set(0, 0, .6); keeper.root.rotation.set(0, 0, 0);
  defender.root.position.set(px * .5 + 1.5, 0, 6.5); defender.root.rotation.set(0, 0, 0);
  setCast('filler', attack === 0 ? '자 공격 들어갑니다!' : rnd(['다시 공격!', '역습입니다!', '볼 잡았어요!']), .9);
  updateHud();
}
function reset() { goals = 0; lives = LIVES; attack = 0; streak = 0; newAttack(); }
function start() {
  state = 'count'; $center.style.display = 'none'; $hint.style.display = '';
  Arcade.countdown({ final: '킥오프!', onTick: n => n ? Arcade.sfx.tick() : (Arcade.sfx.go(), Arcade.sfx.crowd(.6)), onDone: () => { state = 'playing'; newAttack(); } });
}
function shoot() {
  if (state !== 'playing' || phase !== 'run') return;
  $hint.style.display = 'none';
  const saved = castMode === 'shout';     // keeper only reacts to the caster's "슛!"
  const tx = (Math.random() < .5 ? -1 : 1) * (1 + Math.random() * 1.4), ty = .4 + Math.random() * 1.4;
  shot = { from: new THREE.Vector3(px + .2, .17, pz - .4), to: new THREE.Vector3(tx, ty, -.2), t: 0, dur: .5 - lvl() * .08, saved, castWas: castLine };
  phase = 'shot'; phaseT = 0;
  keeperTarget = saved ? tx : -tx * .8;  // reads it perfectly on a shout, guesses wrong otherwise
  keeperDive = 0;
  Arcade.sfx.kick(); Arcade.shake(.12); Arcade.vibrate(25);
}
function resolve(goal) {
  phase = 'after'; phaseT = 0;
  if (goal) {
    goals++; streak++; netShake = 1;
    setCast('goal', rnd(['…어? 골!!! 골이에요!!!', '아 슛… 아니 골이네요!?', '고오오오올!!!', '이걸 넣네요!!!']), 1.6);
    Arcade.sfx.crowd(1.2); Arcade.sfx.fanfare(); Arcade.shake(.3); Arcade.vibrate([30, 30, 90]);
    Arcade.confetti({ y: innerHeight * .4, count: 90, emoji: ['⚽', '🎉', '🔥'] });
    Arcade.toast(streak >= 3 ? `🔥 ${streak}연속 골!` : '⚽ GOAL!', '#2b8a3e');
  } else {
    lives--; streak = 0;
    setCast('filler', shot && shot.saved ? '아~ 선방! 제가 슛이라 했잖아요~' : '아 뺏겼어요…', 1.4);
    Arcade.sfx.thud(); Arcade.sfx.miss(); Arcade.shake(.2); Arcade.vibrate([50, 30, 50]);
    Arcade.toast(shot && shot.saved ? '🧤 선방! (캐스터 따라 찼다)' : '🦵 태클! 너무 끌었어요', '#e03131');
  }
  updateHud();
  setTimeout(() => {
    if (state !== 'playing') return;
    if (lives <= 0) return finish();
    attack++; newAttack();
  }, 1700);
}
function finish() {
  state = 'over'; overAt = performance.now();
  const isBest = goals > best;
  if (isBest) { best = goals; try { localStorage.setItem('soccer-best', best); } catch {} }
  isBest && goals > 0 ? Arcade.sfx.fanfare() : Arcade.sfx.fail();
  const msg = goals >= 10 ? '캐스터: "저 이제 조용히 할게요…"' : goals >= 5 ? '엇박의 신. 해외 진출 각' : goals >= 2 ? '캐스터 목소리에 흔들리지 마세요' : '캐스터 말 너무 잘 들음';
  showScreen(Arcade.resultScreen({ emoji: '⚽', label: '넣은 골', score: goals, unit: '골', msg, rows: [['공격 횟수', `${attack + 1}번`]], isBest: isBest && goals > 0, best }));
  Arcade.gameOver(goals);
}
function tapStart() {
  if (state === 'ready') start();
  else if (state === 'over' && performance.now() - overAt > 1200 && !Arcade.inRun()) { reset(); start(); }
}
addEventListener('pointerdown', () => { if (state === 'playing') shoot(); else tapStart(); });
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (state === 'playing') shoot(); else if (!e.repeat) tapStart(); } });

// ---------- loop ----------
let last = performance.now();
reset(); showIntro();
window.__soc = { get state() { return state; }, get cast() { return castMode; }, shoot, get goals() { return goals; }, get lives() { return lives; }, get phase() { return phase; } };
const camPos = new THREE.Vector3(0, 3.2, START_Z + 5), camLook = new THREE.Vector3();

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (state === 'playing') {
    phaseT += dt;
    castT -= dt;
    if (castT <= 0 && phase === 'run') nextCast();
    else if (castT <= 0 && castMode !== 'goal' && castMode !== 'filler') setCast('filler', rnd(FILLER), 2);
    if (phase === 'run') {
      pz -= runV * dt;
      px += Math.sin(t * 2.3) * dt * .8;
      if (pz <= TACKLE_Z) resolve(false);
    }
    if (phase === 'shot' && shot) {
      shot.t += dt / shot.dur;
      const k = Math.min(1, shot.t);
      const p = new THREE.Vector3().lerpVectors(shot.from, shot.to, k); p.y += Math.sin(k * Math.PI) * .6;
      ball.position.copy(p); ball.rotation.x -= dt * 25;
      keeperDive = Math.min(1, keeperDive + dt * (shot.saved ? 3.2 : 2));
      if (k >= 1) {
        if (shot.saved) { ball.position.set(keeperTarget * .9, shot.to.y, .5); resolve(false); }
        else resolve(true);
      }
    }
  }
  // player run cycle
  const running = state === 'playing' && phase === 'run';
  const ph = t * 12;
  me.root.position.set(px, 0, pz);
  me.legs[0].rotation.x = running ? Math.sin(ph) * .8 : 0; me.legs[1].rotation.x = running ? -Math.sin(ph) * .8 : 0;
  me.arms[0].rotation.x = running ? -Math.sin(ph) * .6 : 0; me.arms[1].rotation.x = running ? Math.sin(ph) * .6 : 0;
  if (phase === 'shot' && phaseT < .25) me.legs[1].rotation.x = -1.4 * Math.sin(phaseT / .25 * Math.PI);
  if (phase === 'run' || state !== 'playing') { ball.position.set(px + .2, .17, pz - .45 - Math.abs(Math.sin(ph * .5)) * .15); ball.rotation.x -= dt * runV * 6; }
  // keeper: bouncing ready stance during a shout, relaxed (looking at the booth) otherwise, dives on shots
  const kr = keeper.root;
  if (phase === 'shot' || (phase === 'after' && shot)) {
    kr.position.x = keeperTarget * keeperDive * .9; kr.position.y = Math.sin(keeperDive * Math.PI) * .5;
    kr.rotation.z = -Math.sign(keeperTarget) * keeperDive * 1.3;
    keeper.arms.forEach(a => a.rotation.z = Math.sign(keeperTarget) * 2.6);
  } else {
    const ready = castMode === 'shout' || castMode === 'warn';
    kr.position.x += (px * .3 - kr.position.x) * Math.min(1, dt * 3);
    kr.position.y = ready ? Math.abs(Math.sin(t * 12)) * .12 : 0; kr.rotation.z = 0;
    keeper.arms.forEach((a, i) => { a.rotation.z = ready ? (i ? 1 : -1) * -.8 : 0; a.rotation.x = ready ? -.6 : 0; });
    keeper.head.rotation.y += ((ready ? 0 : -.9) - keeper.head.rotation.y) * Math.min(1, dt * 8);   // glances at the caster booth when calm
  }
  // defender closes in
  if (phase === 'run') { defender.root.position.x += (px - 1.5 - defender.root.position.x) * dt * 1.2; defender.root.position.z = Math.max(TACKLE_Z - .6, 6.5 - (START_Z - pz) * .12); }
  if (phase === 'after' && !shot) { defender.root.position.z += (pz - .5 - defender.root.position.z) * dt * 6; defender.root.rotation.x = -.5; }
  else defender.root.rotation.x = 0;
  defender.root.rotation.y = Math.PI * 0;
  // net + crowd
  netShake *= Math.exp(-dt * 4);
  window.__net.position.z = -.8 - Math.sin(t * 30) * netShake * .15;
  const cheer = castMode === 'shout' || castMode === 'goal' ? 1 : .3;
  for (const f of crowd) f.position.y = f.userData.base ?? (f.userData.base = f.position.y), f.position.y = f.userData.base + Math.max(0, Math.sin(t * 9 + f.userData.ph)) * .18 * cheer;

  // camera: behind the attacker
  camera.fov = camera.aspect < 1 ? 70 : 55; camera.updateProjectionMatrix();
  const portrait = camera.aspect < 1;
  const cp = new THREE.Vector3(px + (portrait ? 1.1 : 1.6), portrait ? 4 : 3.4, pz + (portrait ? 6.5 : 5.2));   // over the right shoulder so the goal stays visible
  const look = new THREE.Vector3(px * .3 - .3, .9, Math.min(pz - 6, 0));
  camPos.lerp(cp, Math.min(1, dt * 5)); camLook.lerp(look, Math.min(1, dt * 5));
  camera.position.copy(camPos); Arcade.applyShake(camera, dt); camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
