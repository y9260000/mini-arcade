<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>thumb renderer</title>
<style>body{margin:0;background:#888}canvas{display:block}</style></head>
<body>
<script type="module">
// Offline renderer for hub thumbnails + favicon (models live in ../thumbs/models.js). Not linked from the site.
import { M, stage, THREE } from '../thumbs/models.js';
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
R.outputColorSpace = THREE.SRGBColorSpace; R.setPixelRatio(1); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);
window.render = (id, w = 640, h = 400, t = 1) => {
  R.setSize(w, h); const s = stage(id, w, h); s.tick(t);
  R.setClearColor(0x000000, 0); R.render(s.scene, s.camera);
  return R.domElement.toDataURL('image/png');
};
window.IDS = Object.keys(M);
window.ready = true;
</script>
</body>
</html>
