<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>영끌 타워</title>
<script src="common.js?v=17"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd3ff;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #price{font-family:"Jua",sans-serif;font-size:18px}
  #price.up{animation:pu .3s}
  @keyframes pu{50%{transform:scale(1.15);background:#d3f9d8}}
  #wind{position:fixed;left:50%;top:max(160px,calc(env(safe-area-inset-top) + 150px));transform:translateX(-50%);z-index:3;pointer-events:none;font:700 16px "Noto Sans KR",sans-serif;color:#fff;background:rgba(25,113,194,.88);border-radius:999px;padding:6px 14px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.25)}
  #wind b{font:22px "Jua",sans-serif;letter-spacing:-2px;margin:0 4px;animation:wb .5s infinite alternate} @keyframes wb{to{opacity:.55}}
  #event{position:fixed;left:50%;top:max(118px,calc(env(safe-area-inset-top) + 108px));transform:translateX(-50%);z-index:3;pointer-events:none;display:none;
    font-family:"Jua",sans-serif;font-size:18px;color:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 6px 16px rgba(0,0,0,.25);white-space:nowrap}
  #hint{position:fixed;bottom:max(12vh,76px);left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
  #hint .pill{font-size:15px;padding:10px 18px}
  .toast{top:36%}
</style>
</head>
<body>
<div class="hud">
  <div id="score" class="hud-score">0<small>층</small></div>
  <div class="hud-row"><span class="pill dark" id="price">시세 3.0억</span><span class="pill" id="combo" style="display:none"></span></div>
</div>
<div id="event" class="hud-ctl"></div><div id="wind" class="hud-ctl" style="display:none"></div>
<div id="hint" class="hud-ctl"><span class="pill">👆 탭해서 층을 떨어뜨려요. 딱 맞추면 PERFECT!</span></div>
<div class="screen" id="center"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

{

  for (let i = 0; i < 40; i++) {

// window texture for floors

// ---------- building zones: the tower changes character as it climbs ----------

  { upto: 25, name: '🏙️ 유리 오피스텔', kind: 'glass', motion: ['slide', 'swing', 'erratic'] },

  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; texCache[key] = t; return t;
}
function styleFor(n) {
  const z = zoneOf(n);
  if (n >= 5 && Math.random() < .12) return { kind: 'gold', v: 0, gold: true };

}
const H = .8, D = 2.4;
function makeFloor(w, idx, style = { kind: 'apt', v: idx }) {
  const tex = kindTex(style.kind, style.v).clone(); tex.needsUpdate = true; tex.repeat.set(Math.max(.5, w / 1.6), 1);
  const side = new THREE.MeshStandardMaterial({ map: tex, roughness: style.kind === 'glass' ? .15 : .7, metalness: style.kind === 'glass' || style.kind === 'space' ? .4 : 0, emissive: style.gold ? 0x7a4a00 : 0x000000, emissiveIntensity: style.gold ? .5 : 0 });
  const top = flat(style.kind === 'pent' ? 0x343a40 : style.gold ? 0xfab005 : 0xced4da);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, H, D), [side, side, top, top, side, side]);

}

// crane
const crane = new THREE.Group(); scene.add(crane);
const mast = box(.35, 30, .35, flat(0xfab005), -6.5, 15, -6, crane);   // tucked behind the tower
const jib = box(14, .3, .3, flat(0xfab005), 0, 30, 0, crane);
const arm = box(.3, .3, 6, flat(0xfab005), -6.5, 30, -3, crane);
const trolley = new THREE.Group(); crane.add(trolley);
const cable = box(.04, 1, .04, flat(0x212529), 0, 0, 0, trolley);
const hook = box(.3, .2, .3, flat(0x495057), 0, 0, 0, trolley);

// ---------- state ----------
const $wind = document.getElementById('wind');
let windDir = 1, windPow = 1, windNow = 0, windVis = 0;
const streaks = [];
for (let i = 0; i < 36; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(.8 + Math.random() * 1.4, .035, .035), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false })); m.position.set((Math.random() - .5) * 28, 0, -2.5 + Math.random() * 6); m.userData = { dy: (Math.random() - .5) * 12, k: .4 + Math.random() * .6 }; m.visible = false; scene.add(m); streaks.push(m); }
const sock = new THREE.Mesh(new THREE.ConeGeometry(.22, 1.1, 8, 1, true), new THREE.MeshStandardMaterial({ color: 0xff6b35, side: THREE.DoubleSide, flatShading: true })); sock.geometry.translate(0, -.55, 0); sock.visible = false; scene.add(sock);
let state = 'ready', floors = [], cur = null, falling = null, debris = [], overAt = 0, combo = 0, perfects = 0, price = 3, eventT = 0, ev = null, swingT = 0, nextW = null;
let best = 0; try { best = +localStorage.getItem('tower-best') || 0; } catch {}
const $score = $('score'), $price = $('price'), $combo = $('combo'), $center = $('center'), $event = $('event'), $hint = $('hint');
const showScreen = html => { $center.innerHTML = html; $center.style.display = ''; };
const showIntro = () => showScreen(Arcade.titleScreen({ emoji: '🏢', title: '영끌 타워', how: [
  ['👆', '크레인에 매달린 층을 <b>탭</b>해서 떨어뜨려요'],
  ['✂️', '삐져나온 부분은 잘려나가요 (하자 보수비)'],
  ['✨', '딱 맞추면 <b>PERFECT</b>! 시세 프리미엄 + 폭이 회복돼요'],
  ['🏙️', '빌라 → 아파트 → 오피스텔 → 펜트하우스 → <b>우주</b>! 구간마다 움직임이 달라요'],
  ['🏆', '가끔 오는 <b>황금층</b>을 PERFECT로 받으면 시세 +25%'],
] }));
const topY = () => .4 + floors.length * H;
const topFloor = () => floors[floors.length - 1];
function fmtPrice(p) { return p >= 10 ? `${p.toFixed(1)}억` : `${p.toFixed(2)}억`; }
function updateHud(up) {
  $score.innerHTML = `${floors.length - 1}<small>층</small>`;
  $price.textContent = `시세 ${fmtPrice(price)}`; if (up) { $price.classList.remove('up'); void $price.offsetWidth; $price.classList.add('up'); }

}
function reset() {
  for (const f of floors) scene.remove(f.m); for (const d of debris) scene.remove(d.m);
  if (cur) scene.remove(cur.m); if (falling) scene.remove(falling.m);
  floors = []; debris = []; cur = null; falling = null; combo = 0; perfects = 0; price = 3; ev = null; eventT = 0; nextW = null;
  zoneName = ''; const base = makeFloor(3, 0, { kind: 'shop', v: 2 }); base.position.set(0, .4 + H / 2, 0); floors.push({ m: base, x: 0, w: 3 });   // ground floor (lobby)
  spawn(); updateHud();
}
let zoneName = '';
function spawn() {
  const w = nextW ?? topFloor().w; nextW = null;
  const n = floors.length, z = zoneOf(n), style = styleFor(n);
  if (z.name !== zoneName) { if (zoneName) { Arcade.toast(`${z.name} 진입! 움직임이 달라져요`, '#7048e8'); Arcade.sfx.coin(); } zoneName = z.name; }
  const motion = n <= 2 ? 'swing' : z.motion[(Math.random() * z.motion.length) | 0];

  swingT = Math.random() * Math.PI * 2;
  $('combo').style.display = ''; $('combo').textContent = `${z.name.split(' ')[0]} ${{ swing: '🔁 흔들흔들', slide: '➡️ 직진 왕복', erratic: '🌀 투기 과열' }[motion]}${style.gold ? ' · 🏆 황금층' : ''}`;
}
function start() { state = 'playing'; $center.style.display = 'none'; $hint.style.display = ''; Arcade.sfx.go(); }
function drop() {

function land() {

const EVENTS = [

}
function finish() {
  const n = floors.length - 1, isBest = n > best;
  if (isBest) { best = n; try { localStorage.setItem('tower-best', best); } catch {} }
  isBest && n > 0 ? Arcade.sfx.fanfare() : Arcade.sfx.fail();
  const msg = n >= 40 ? '랜드마크 등극! 영끌 성공의 신화' : n >= 20 ? '역세권 대장 아파트 완성' : n >= 8 ? '그럭저럭 빌라 한 채' : '대출 이자만 남았다…';

    rows: [['최종 시세', fmtPrice(price)], ['PERFECT', `${perfects}번`]], isBest: isBest && n > 0, best }));

}
const rings = [];
function ring(x, y) { const r = new THREE.Mesh(new THREE.RingGeometry(.3, .45, 32), new THREE.MeshBasicMaterial({ color: 0xffd43b, transparent: true, opacity: .9, side: THREE.DoubleSide })); r.rotation.x = -Math.PI / 2; r.position.set(x, y + .02, 0); scene.add(r); rings.push({ m: r, t: 0 }); }
addEventListener('pointerdown', () => { state === 'playing' ? drop() : tapStart(); });
addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); state === 'playing' ? drop() : tapStart(); } });

// ---------- loop ----------
const camPos = new THREE.Vector3(0, 6, 12), camLook = new THREE.Vector3(0, 3, 0);
let last = performance.now();
reset(); showIntro();
window.__tower = { wind() { ev = EVENTS.find(e => e.key === 'wind'); eventT = ev.dur; windDir = 1; windPow = 1.4; $event.style.display = 'block'; $event.style.background = ev.col; $event.textContent = ev.name; }, get state() { return state; }, get cur() { return cur; }, top: () => topFloor(), drop, get floors() { return floors.length - 1; }, get price() { return price; } };

function frame(now) {
  const dt = Math.min(.04, (now - last) / 1000); last = now; const t = now / 1000;
  const n = floors.length;
  if (ev && ev.dur) { eventT -= dt; if (eventT <= 0) { ev = null; $event.style.display = 'none'; } }
  // the hook swings faster as the tower grows (and crazily during a rate hike)
  const hookY = topY() + 3.4;
  if (cur && state !== 'over') {
    const speed = 1.6 + Math.min(2.2, n * .06) + (ev?.key === 'rate' ? 1.6 : 0), amp = 2.6 + (ev?.key === 'rate' ? 1 : 0);
    if (cur.motion === 'erratic') swingT += dt * speed * (1 + Math.sin(t * 2.7) * .55 + Math.sin(t * 6.1) * .25);   // jittery speed
    else swingT += dt * speed * (cur.motion === 'slide' ? .9 : 1);
    cur.x = cur.motion === 'slide' ? (2 / Math.PI) * Math.asin(Math.sin(swingT)) * amp : Math.sin(swingT) * amp;   // triangle wave = constant speed
    cur.m.position.set(cur.x, hookY - .6, 0); cur.m.rotation.z = Math.cos(swingT) * .05;
  }
  trolley.position.set(cur ? cur.x : 0, 0, 0);
  const jibY = Math.max(30, hookY + 8); jib.position.y = jibY; arm.position.y = jibY; mast.scale.y = jibY / 30; mast.position.y = jibY / 2;
  cable.scale.y = Math.max(.1, jibY - hookY); cable.position.set(0, (jibY + hookY) / 2, 0); hook.position.set(0, hookY, 0);
  trolley.position.z = 0;
  // 💨 wind: steady direction with gusts, shown by streaks, a windsock and a HUD meter
  const windOn = ev?.key === 'wind'; windNow = windOn ? windDir * windPow * (.75 + .35 * Math.sin(t * 2.3)) : 0;
  windVis += ((windOn ? 1 : 0) - windVis) * Math.min(1, dt * 3);
  for (const st of streaks) {
    st.position.x += windDir * (7 + windPow * 8) * (.6 + st.userData.k) * dt;
    if (st.position.x > 14) st.position.x = -14; if (st.position.x < -14) st.position.x = 14;
    st.position.y = camLook.y + st.userData.dy; st.material.opacity = windVis * .55 * st.userData.k;
    st.visible = windVis > .02;
  }
  sock.visible = windVis > .05; sock.position.set(trolley.position.x + .2, jib.position.y - .1, .6);
  sock.rotation.z = windDir > 0 ? -Math.PI / 2 : Math.PI / 2; sock.rotation.x = Math.sin(t * 9) * .25 * windVis; sock.scale.set(1, .4 + .6 * Math.min(1, Math.abs(windNow) / 1.4), 1);
  if (cur && windOn) cur.m.rotation.z += -windNow * .05;
  $wind.style.display = windVis > .1 ? '' : 'none';
  if (windOn) { const lvl = Math.min(3, Math.max(1, Math.round(Math.abs(windNow) * 2))), ar = windDir > 0 ? '→' : '←';
    $wind.innerHTML = `💨 <b>${ar.repeat(lvl)}</b> 풍속 ${(Math.abs(windNow) * 9).toFixed(1)}m/s`; }
  if (falling) {
    falling.vy -= 22 * dt; falling.y += falling.vy * dt;
    if (ev?.key === 'wind') falling.x += windNow * dt * 1.25;
    falling.m.position.set(falling.x, falling.y, 0); falling.m.rotation.z *= .9;
    if (falling.y - H / 2 <= topY()) land();
  }
  for (let i = debris.length - 1; i >= 0; i--) { const d = debris[i]; d.t += dt; d.vy -= 18 * dt; d.m.position.y += d.vy * dt; d.m.position.x += d.vx * dt; d.m.rotation.z += d.rz * dt; if (d.m.position.y < -3 || d.t > 4) { scene.remove(d.m); debris.splice(i, 1); } }
  for (const f of floors) if (f.m.userData.squash !== undefined && f.m.userData.squash < 1) { f.m.userData.squash += dt * 5; f.m.scale.y = 1 - .3 * Math.cos(f.m.userData.squash * Math.PI * 2) * (1 - f.m.userData.squash); }
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; r.m.scale.setScalar(1 + r.t * 8); r.m.material.opacity = .9 * (1 - r.t / .5); if (r.t > .5) { scene.remove(r.m); rings.splice(i, 1); } }
  // sky darkens toward space as you climb
  const k = Math.min(1, n / 45); scene.background.copy(SKY_LOW).lerp(SKY_HIGH, k); if (n > 38) scene.background.lerp(new THREE.Color(0x05060f), Math.min(1, (n - 38) / 8)); scene.fog.color.copy(scene.background);
  // camera follows the top
  const portrait = innerWidth < innerHeight;
  const ty = topY();
  const cp = state === 'over' ? new THREE.Vector3(0, ty * .55 + 4, Math.max(14, ty * 1.1)) : new THREE.Vector3(0, ty + (portrait ? 5 : 4), portrait ? 15 : 11);
  const cl = state === 'over' ? new THREE.Vector3(0, ty * .45, 0) : new THREE.Vector3(0, ty + 1.2, 0);
  camPos.lerp(cp, Math.min(1, dt * 3)); camLook.lerp(cl, Math.min(1, dt * 3));
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  camera.position.copy(camPos); Arcade.applyShake(camera, dt); camera.lookAt(camLook);
  sun.position.set(camLook.x + 6, camLook.y + 10, 8); sun.target.position.copy(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));
requestAnimationFrame(frame);
</script>
